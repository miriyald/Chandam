name: Deploy to GitHub Pages

on:
  push:
    branches: [ beta ]
  pull_request:
    branches: [ beta ]
  workflow_dispatch:
    # Allow manual trigger from Actions tab

permissions:
  contents: write # Required to push to gh-pages branch
  checks: write   # Required for test workflow to publish results
  pull-requests: write # Required by reusable tests workflow permissions

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy to Pages
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for proper git operations

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore .NET dependencies
        run: dotnet restore Chandam.sln

      - name: Install npm dependencies
        run: npm install
        working-directory: Chandam.Wasm/Client

      - name: Build TypeScript bundle
        run: npm run build
        working-directory: Chandam.Wasm/Client

      - name: Generate metrics snapshot for deployment
        shell: pwsh
        run: |
          ./.github/scripts/generate-metrics.ps1 `
            -EventName "${{ github.event_name }}" `
            -Sha "${{ github.sha }}" `
            -RefName "${{ github.ref_name }}"

      - name: Publish Blazor WASM
        run: |
          dotnet publish Chandam.Wasm/Chandam.Wasm.csproj \
            -c Release \
            -p:ExcludeYaml=true \
            -o publish

      - name: Make page scripts executable
        run: chmod +x .github/scripts/prepare-github-pages.sh .github/scripts/publish-metrics-to-pages.sh

      - name: Publish metrics into site output
        run: bash .github/scripts/publish-metrics-to-pages.sh

      # Uploaded before the base href is set, so downstream jobs can rebase it
      # to their own sub-path without rebuilding.
      - name: Upload unbased site output
        uses: actions/upload-artifact@v4
        with:
          name: wasm-publish
          path: publish/wwwroot
          retention-days: 1
          include-hidden-files: true

      - name: Prepare for GitHub Pages
        run: bash .github/scripts/prepare-github-pages.sh publish/wwwroot /chandam/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/beta'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish/wwwroot
          publish_branch: gh-pages
          force_orphan: true # Keep gh-pages branch clean (no history)
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy from ${{ github.sha }}"

  publish-hub:
    name: Publish /v2/ to chandamu.github.io
    needs: deploy
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Download unbased site output
        uses: actions/download-artifact@v4
        with:
          name: wasm-publish
          path: site

      - name: Checkout hub repository
        uses: actions/checkout@v4
        with:
          repository: chandamu/chandamu.github.io
          ref: main
          token: ${{ secrets.HUB_DEPLOY_TOKEN }}
          path: hub

      - name: Rebase site output to /v2/
        run: bash .github/scripts/prepare-github-pages.sh site /v2/

      - name: Write /v2/ and root 404.html into the hub
        run: bash .github/scripts/publish-to-hub.sh site hub

      - name: Commit and push
        working-directory: hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Hub already up to date - nothing to push"
            exit 0
          fi
          git commit -m "Publish v2 from miriyald/chandam@${{ github.sha }}"
          git push origin main
