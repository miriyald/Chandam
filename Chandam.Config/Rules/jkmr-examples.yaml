identifier: jkmr-examples
name: జెజ్జాల కృష్ణ మోహన రావు సేకరణ
description: racchabanda/chandassu Google Groups ఉదాహరణలు
examples:
  lalitaSIrshakamu:
  - text: "ప్రణయాబ్ధి వాఙ్మయీ ప్రహరిణీ వైష్ణవీ\n  బ్రాహ్మణీ బ్రహ్మజా వాణి లలితా\n\
      స్వనమూర్తి వైభవీ భావజా భయహరీ\n  భైరవీ భవహరీ పద్య మిమ్మా\nవనజాక్షీ వర్ణినీ భవనాశ\
      \ భారతీ\n  భాషిణీ భాస్వరీ భక్తితోడన్\nప్రణవాత్మ ప్రభవాత్మ ప్రాణదా ప్రాకృతీ\n\
      \  స్వర్ణదీ స్వస్తికా పదము గొల్తున్\n\nవరదాయి వాక్చతుర వసుమతీ పలుకులమ్మా\nస్వరరూపి\
      \ వర్ధినీ వందితా ప్రణతు లివిగో\nపరమాత్మ భగవతీ భారవీ వాక్కు లిమ్మా\nపరమేష్ఠి\
      \ పరమార్థ వాక్సుధా ప్రథమదేవీ"
  kuMdamu:
  - text: 'కుందము లపూర్వ

      సుందరములు నవ శోభాకృతమౌ

      మందిరములు శ్రీ

      చందనము లమృత చషకము లవనిన్'
  - text: 'మనసున నీవే

      మనుగడ నీవే మమతయు నీవే

      ప్రణయము నీవే

      ప్రణవస్వరమున ప్రాణము నీవే'
  - text: 'లలితము నగవులు

      లలితము స్వరములు లలితము పదముల్

      లలితము తలపులు

      లలితము వలపులు లలితము ముదముల్'
  - text: 'లలితము సదనము

      లలితము వదనము లలితము హృదయము

      లలితము చలనము

      లలితము నటనము లలితోజ్జ్వలితా'
  - text: 'నాయక జగద్వి-

      నాయక గణాధినాయక శుభసం-

      ధాయక మంగళ

      దాయక వరప్రదాయక ప్రణతుల్'
  - text: 'తల్లిని సుందర

      వల్లిని సుకల్పవల్లిని విష్ణువు

      చెల్లిని కరుణల

      వెల్లిని లలి ప్రభవిల్లగ గొలుతున్'
  - text: 'వనిలో నెఱ యా-

      మనిలో సుమముల మసలో మోదపు

      ధ్వనిలో నిను యా-

      మినిలో వెలుగుల మిసలో దలతున్'
  - text: 'కలలై యాశల

      వలలై గగన శబలలై భయవి-

      హ్వలలై గానపు

      టలలై జనించె ననయము దలపుల్'
  - text: 'జననీ సృష్టికి

      జననీ కళలకు జననీ త్రిజగ-

      జ్జననీ మదీయ

      జననీ యనుంగు జననీ రావే'
  - text: 'నిధిగా నొక పె-

      న్నిధిగా ప్రవిమల నిధిగా కరుణా

      నిధిగా నీ స-

      న్నిధినే దలంతు నిధిగా నెపుడున్'
  - text: 'జీవము నవ రా-

      జీవము రసమయ జీవము భవ సం-

      జీవము నీవే

      జీవన కవనము జీవవసంతా'
  jalajaata:
  - text: 'హరీ యని దలంచగ హాయియే కల్గె

      తరించగ సుఖమ్ములు తాకగా దోచె

      స్థిరమ్మగు మనస్సున దీపమే వెల్గె

      సరస్సను హృదిన్ జలజాతమే పూచె'
  - text: 'నిరంతర పరిశ్రమ నేను గావింతు

      కరమ్ములు వరమ్ములె కష్ట జీవాన

      మరీచిక యయెన్ గద మంచి నీళ్ళైన

      విరించియు రచించిన వేదమో మంకి'
  caMdrakaaMti:
  - text: 'పున్నమిలో వెన్నెలలో పూర్ణచంద్ర కాంతిలో

      నన్ను నేను మఱచిపోయినాను నీదు భ్రాంతిలో'
  - text: 'అనురాగపు కడలిలోన నానందపు టలలపై

      మన సిప్పుడు తూగి యూగె మధుచంద్రిక డోలపై'
  - text: 'మందానిలమందు తేలె మంద్రస్వర గీతము

      సుందరమై సురుచిరమై శోభిలె సంగీతము'
  - text: 'మోముపైన చిఱునవ్వులు మోహనాస్త్ర వీచికలు

      భామ తీకష్ణ వీక్షణములు ప్రణయశాస్త్ర సూచికలు'
  - text: 'చంద్రకాంతి ఛాయలలో శర్వరి చిన్మాయలో

      సంద్రపు సైకతసీమలు సకియ రా కవుగిలిలో'
  manOraMjitamu:
  - text: 'ఆడంగా మనసు గల్గె నాడ నిమ్ము నృత్యమ్ము

      పాడంగా మనసు గల్గె బాడ నిమ్ము గీతమ్ము

      వేడంగా మనసు గల్గె వేడ నిమ్ము నామమ్ము

      చూడంగా మనసు గల్గె జూపవేల నీ మోము'
  - text: 'బంగార మ్మదియు వద్దు భార మౌను మోయంగ

      పొంగెన్ నా మనసు నేడు పూర్ణ మౌను నా యుంకి

      శృంగారస్వరము పాడు శృంగ మెక్కెదన్ నేను

      రంగా నా దరికి రమ్ము రంగు నిండు నాకింక'
  nirjharadhvani:
  - text: 'తారావళుల్ గగన వారాశిలో వెలిగె

      నీరాల ముత్యముల తీరై కనంగా

      శ్రీరాగ సుస్వనము నీ రాత్రి బాడెదను

      నోరార నీకొఱకు రారా వినంగా

      భారమ్ము నా బ్రదుకు నీ రమ్య సుస్వనము

      గోరేను నా మనసు చేరంగ రావా

      ప్రేరించ నీ ధ్వనులు చేరేను నిర్ఝరిని

      తీరాన నుంటి సఖ గారాన రావా'
  - text: 'రంగా యనంగ మది పొంగేను గంగవలె

      శృంగార భావముల శృంగారదీపా

      బంగారు మేఘముల రంగేళి యాకసము

      నిన్ గాన గోరె మది రంగా శుభాంగా

      నింగిన్ మునింగె రవి సంగీత నాదపు త-

      రంగాలె యెల్లెడ వినంగా విహారీ

      కంగారుతో మనసు క్రుంగేను దుఃఖమున

      సంగాతి చూడు నను చెంగావి సంధ్యన్'
  - text: 'అందాల యామినిది యందాల భామిని క-

      మందమ్ముగా పెదవు లందించ నౌనా

      మందాకినీ తటిని మందానిల మ్మొసగు

      మందార పుష్పముల గంధమ్ము తేనా

      సౌందర్య సాగరము నందుండు వీచికల

      యందాల ఫేనమును చిందింతు చానా

      సందేహ మేల నిక సంధించు వేళ యిది

      ముందుండి మోద మివ నిందిప్డు రానా'
  priyasakhi:
  - text: 'మధువును ద్రాగనా ప్రియసఖీ మనోజ్ఞమగు సంధ్యవేళలో

      నిదురను మాననా ప్రియసఖీ నిరంతర విరక్తి రాత్రిలో

      పదముల బాడనా ప్రియసఖీ స్వరమ్ముల విరాజమానమై

      హృదయము జూపనా ప్రియసఖీ హితమ్ము భవమందు నిండగా'
  - text: 'కథలను జెప్పవా ప్రియసఖీ కవిత్వరసపాత్ర నీయవా

      యధరము లానవా ప్రియసఖీ యనూహ్య నవభోగ మీయవా

      మధురిమ నింపవా ప్రియసఖీ మనమ్మున ముదమ్ము జిమ్మవా

      పథమును జూపవా ప్రియసఖీ పదమ్ముల నిడన్ రయమ్ముగా'
  pArijAtamu:
  - text: 'గోపాల నీవెగా నాపాలి కెల్లయున్

      గుందితిని నీకొఱకు కొంచె మిట రారా

      శ్రీపారిజాతమున్ నీపాదపూజకై

      చెల్వముగ బూచె వని జేరువకు రారా

      భూపాల రాగమున్ నే పాడెదన్ సఖా

      భూమిపయి వెల్లువయె పూర్ణ నవకాంతుల్

      దీపాల వెల్గులో రూపమ్ము జూడగా

      దృప్తియగు నా మనసు తేలు మది శాంతుల్'
  - text: 'అందాల నింగిలో జిందించె వెన్నెలల్

      హ్లాదముగ నా శశియు నాశలను రేపెన్

      మందాకినీనదిన్ సౌందర్య వీచియై

      మానసము ముంచుచును మాల్మి నను లేపెన్

      బంధాల సూత్రమై స్పందించు పాత్రమై

      పల్లవిని బాడు మధువల్లకియు పల్కన్

      మందార పుష్పమై యందించు మాధురుల్

      మంద్రమగు నాదములు మంజులత నొల్కన్'
  tapasvinI:
  - text: 'అలోల చిత్తినీ అలబ్ధవాఙ్మయీ అలోప వాణినీ

      కళంకనాశినీ కళాతపస్వినీ కళాప్రవర్ధినీ

      విలాపవారిణీ విలాసలోలినీ విలక్షణాగ్రణీ

      ఖలప్రహారిణీ కలిప్రియాంబికా కలందికానిధీ'
  kanakAMbaramu:
  - text: 'రా కనవే కనకాంబర రమ్య హాస చంద్రికలను

      రా కనవే హరితాంబర రంగవల్లి చిత్రములను

      రాకాచంద్రుని వెన్నెల రశ్మి నింపె కళల నలగ

      రా కమ్మని తీయని నవ రాగలహరియందు మునుగ'
  - text: 'తీయగ హాయిగ రేయిని దివ్యముగను గడుపుదమా

      మాయల యూయెల గూర్చుని మంచి పాట పాడుదమా

      సోయగ మీ యెద నిండగ సొక్కి సోలిపోవుదమా

      నా యలివేణీ పువ్వుల నవ్వు రేక చల్లుదమా'
  - text: 'ఒంటరిగా నిను గంటిని యుర్వశి యని నే దలచితి

      వింటిని నీ చిరు గీతము ప్రేమ పొంగ నిను వలచితి

      కంటికి నీవొక శశియే కామ ధనువు వర్ణమాల

      యింటికి రా నా అతిథిగ నింక చాలు జాల మేల'
  - text: 'మల్లెల మొల్లల మాలల మంచిగా రచించినాను

      తెల్లని యుల్లము నాయది తెలుగు లతను పెంచినాను

      చిల్లర దైవము గొలువను శ్రీలు జిందు నిన్ను తప్ప

      ఫుల్లమ్మయె బ్రదు కిప్పుడు భువిని నాకు నీవె గొప్ప'
  lalitAkrAMta:
  - text: 'లలితాక్రాంతా లయల సొబగై లాస్య మాడంగ రావా

      కలలో నీవీ కలికి యెదలో గారు చిచ్చుంచినావా

      యలయై రావా యలఘుతర మోదాబ్ధిలో ముంచ రావా

      తెలియందమ్మై తెలుగు కవితై తేనె లూరించ రావా'
  - text: 'విరహాంబోధిన్ విచలితగ నేన్ వేగమై ముంగుచుంటిన్

      సరసాకారా సముదముగ నన్ జల్లగా దాకమంటిన్

      మఱుగింకేలా మఱల మఱలన్ మానస మ్మిందు దల్చెన్

      నిరవద్యమ్మై నిశి ఘడియలో నిన్నె డెందమ్ము బిల్చెన్'
  - text: 'ప్రియ రాగాలన్ వినుమ త్వరగా ప్రేమతో బాడుచుంటిన్

      నయగారాలన్ నవము నవమై నందమై చిల్కుచుంటిన్

      లయతోడన్ నే లలిత పదముల్ లాసమై పల్కుచుంటిన్

      స్వయమై రా యీ జ్వలిత హృదిలో చల్లవా హైమ ధారల్'
  rasadhuni3:
  - text: 'మల్లెపూవు మనసు నీది

      యుల్ల మలర నొజ్జగా

      నెల్ల విద్య లీయు మిపుడు

      చల్లగాను శారదా'
  - text: 'నాకు నీవు నీకు నేను

      రాకుమారి రావె రా

      చీకు చింత లేక నుండి

      యేక మౌద మిల నికన్'
  rasadhuni4:
  - text: 'గగనమునందున మృగశిర వెలిగెను

      సొగసుల జిందుచు శుభమయమై

      సుగమును వెదకుచు సగమయె రేయియు

      నగవుల రసధుని యగపడవా'
  - text: 'ప్రేమకు రూపము విరుల స్వరూపము

      యామిని రూప మ్మా శశిదే

      భామిని రూపము ప్రకృతికి దీపము

      నా మది రూపము నవనవమే'
  rasadhuni5:
  - text: 'నా యింటి దీపమై నా కంటి పాపవై

      రాయంచవలె యాడ రా యిపుడు రా

      నా యసువు నీవెగా నా వసువు నీవెగా

      నా యుసురు నీవెగా నవ సుమమ రా'
  - text: 'కొండ దిగి వెళ్లెనా కోనేటిరాయ డిట

      నిండుకొన కారణము నేనెఱుగనే

      పండు వెన్నెలలోన ప్రక్కలో లేడాయె

      మండుచున్నది మనసు మార్గమేమో'
  rasadhuni6:
  - text: 'చందమామ వన్నె నిచ్చు సారంగము పఱుగు నిచ్చు

      కందర్పుడు రూపు నిచ్చు కాకి కాటుకన్

      ఇందిరమ్మ సిరుల నిచ్చు నీశ్వరి దీర్ఘాయు విచ్చు

      నిందు వాణి విద్దె లిచ్చు నీ శిశువునకున్'
  - text: 'చందమామ వచ్చినాడు చల్ల గాలి దెచ్చినాడు

      వంద విరుల నిచ్చినాడు గంధమయముగా

      చందమామ మా యింటను సందడితో గంతులేసి

      తొందరగా నిదురించెను దోర కలలతో'
  picCha:
  - text: 'నెమ్మికి పింఛము నిగ్గు నిచ్చు

      కమ్మకు ముత్తెము కాంతి నిచ్చు

      తమ్మికి సూర్యుడు తావి నిచ్చు

      అమ్మకు బిడ్డయె యంద మిచ్చు'
  - text: 'పల్లవి పాటకు ప్రాణ మిచ్చు

      తెల్లమి మాటకు దేట నిచ్చు

      మల్లియ రాత్రికి మత్తు నిచ్చు

      జల్లులు వానకు జాలు నిచ్చు'
  - text: 'వాణికి వీణయె వర్ణ మిచ్చు

      వీణకు తంత్రులు వేగ మిచ్చు

      వేణికి బూవులె వీక నిచ్చు

      ప్రాణికి ప్రేమయె త్రాణ నిచ్చు'
  - text: 'యోగికి ధ్యానమె యోగ మిచ్చు

      భోగికి కామమె మోహ మిచ్చు

      రాగికి రాగమె రక్తి నిచ్చు

      త్యాగికి ధైర్యము ధర్మ మిచ్చు'
  - text: 'శోధన మంకికి శోభ నిచ్చు

      నీ దయ నాకిల నిండు నిచ్చు

      నీదగు ప్రేమయె నెయ్య మిచ్చు

      మోదము నీయది ముక్తి నిచ్చు'
  madhurima:
  - text: 'వెల్గె శశియు గగన తలిన్ వెలుగు దిశల కొనకు జనెన్

      గల్గె హృదయ సరసి తలిన్ గలల జిలుగు యలలవలెన్

      తెల్గు నుడియు మధువువలెన్ దియగ తియగ బొఱలె నిలన్

      వాల్గనులను గనగ మదిన్ వఱద తెరలె వలపు నదిన్'
  - text: 'ఇంద్రుని ధనువయె నిజమై యిచటను తనువు సువదనా

      చంద్రుని వెలుగయె నిజమై సముదిత వదనము మదనా

      సంద్రపు టలలయె నిజమై సరసుని దలవగ హృదియే

      మంద్రపు స్వరములు నిజమై మదనుని శరముల సడియే'
  - text: 'మల్లియల మధురిమల మానసము విరిసె గద కనవా

      పల్లవియు పదములుగ బాట యయె ముదములుగ వినవా

      చల్లనిది ఘడియ యిది జల్లుమనె హృదయ మిది యిపుడున్

      తెల్లనగు చిఱునగవు దీపములు వెలుగు మది నెపుడున్'
  - text: 'నాదు హృదయపు ననయు పూచెను నయపు సొగసుగ చెలీ

      నాద రవముల నవత విరియగ నగుమ నవరసవళీ

      మోద సరసిని మురళి తరగల మునుగు సరసిజముఖీ

      నీదు హృదయపు నిదుర లేపుమ నిముసమున బ్రియ సఖీ'
  - text: 'దివ్యమైన బ్రదుకు గదా త్రిదివ మయెను ధరణి సదా

      సవ్యపు పలుకుల నుడితో సరస సురవముల వడితో

      నవ్యమగు రచనలను నందముగ లలితముగ నియనా

      భవ్య మగు నిక ప్రణయ సంపద బ్రదుకు వృథ నిను వినా'
  anAmika:
  - text: 'ఓ యనామిక యెట్టు లుద్భవించితివి

      నా యీ మనస్సులో నేడు

      ఓ యనామిక నీవు రాయంచవోలె

      నా యీ సరస్సులో నీదు

      ఓ యనామిక నాదు యుల్లమ్ములోన

      మాయమ్ము గాకుండ నుండు

      ఓ యనామిక నీకు యుంగర మ్మొకటి

      వేయంగ నెంచేను రమ్ము'
  - text: 'ఎందాక పోదాము ఎందాక చెప్పు

      ఎందాక ఎందాక చెప్పు

      అందాక ఆకాశ మందాక మనము

      అందుండు మేఘాల దాక

      అందాక నక్షత్ర హారాల దాక

      అందాక హరివిల్లు దాక

      అందాక నవకాంతి యాకరమ్ములకు

      అందాక సృష్ట్యాది వఱకు'
  - text: 'చిన్నారి యేడ్చేను చింద కన్నీళ్లు

      అన్నానికై యింట చూడు

      కన్నీరు తుడువరా కరముతో నీవు

      కన్నయ్య తినిపించు బువ్వ

      సన్న బియ్యము వద్దు శాకమ్ము వద్దు

      యిన్ని గింజలు చాలు మాకు

      చిన్న పాకయు పాత చీర యొక్కటియు

      దున్న నొక్కెకరమ్ము చాలు'
  nelarEka:
  - text: 'నీవున్న చోటులో బూవులే బూయు

      రావే వసంతాల రాగిణీ

      నీవాడు మాటలో నెలరేక రాలు

      రావే నిరీక్షింతు రాక నేన్

      నీ వన్నె నవ్వులో నెఱయు గావ్యాలు

      రావేల గీతాల రాగమై

      నా విశ్వమోహినీ భావాల మూర్తి

      రా వింత పద్యాల రచనకై'
  - text: 'రాముడు రవికుల సోముడు వాడు

      భీముడు భండన భీముడై

      కాముడు దేవికి గాముని దండ్రి

      వ్యోమము నిండిన దేముడై

      భూమికి నొడయడు కోమల వరుడు

      శ్యామల వర్ణుడు దాముడై

      నా మనమందున స్వామియు నిండె

      ధీమతి గొల్తును ప్రేమతో'
  SubhakAmI:
  - text: 'స్వామీ యిక రావా శుభ

      కామీ నను గావా

      క్షేమ మ్మియ రావా ప్రియ

      భామన్ గన రావా

      రామా మృదురావా ఘన

      శ్యామా విన రావా

      నా మంగళసూత్రా నయ

      ప్రేమామృతపాత్రా'
  SyAmala:
  - text: 'నా మనసున బూచెన్ బలు

      ప్రేమ సుమము లెన్నో

      కోమలహృదయా రా నిను

      స్వామి యనుచు గొల్తున్

      శ్యామల ఘన రూపా యెద

      గానపు నది పొంగెన్

      జాము గడిచె రాత్రిన్ హరి

      నా మొఱ విన రావా'
  mEghamAlA:
  - text: 'సుదిన మిదియె

      చూడవా యో నిశాసుందరీ చంద్రికా

      చొక్కుగా జక్కగా

      ముదము లొసగ

      మోడిగా నాగమై ముందు రా విందుగా

      మోహినీ వాహినీ

      హృదయ మిదియె

      హేల రా స్రగ్విణీ హేమకాంచీధరీ

      హ్రీమయీ శ్రీమయీ

      మృదువుగ నల

      మేలుగా తేలి రా మేఘమాలా దరిన్

      మృష్టమై వృష్టియై'
  hEmakAMchI:
  - text: 'సుదిన మిదియె చూడవా యో నిశాసుందరీ చంద్రికా చొక్కుగా

      ముదము లొసగ మోడిగా నాగమై ముందు రా విందుగా మోహినీ

      హృదయ మిదియె హేల రా స్రగ్విణీ హేమకాంచీధరీ హ్రీమయీ

      మృదువుగ నల మేలుగా తేలి రా మేఘమాలా దరిన్ మృష్టమై'
  niSA:
  - text: 'రఘుపతిరపి జాతవేదోవిశుద్ధాం ప్రగృహ్య ప్రియాం

      ప్రియసుహృది విభీషణే సంగమయ్య శ్రియం వైరిణః

      రవిసుతసహితేన తేనానుయాతః ససౌమిత్రిణా

      భుజవిజిత విమానరత్నాధిరూఢః ప్రతస్థే పురీం'
  - text: 'సుదిన మిదియె చూడవా యో నిశాసుందరీ చంద్రికా

      ముదము లొసగ మోడిగా నాగమై ముందు రా విందుగా

      హృదయ మిదియె హేల రా స్రగ్విణీ హేమకాంచీధరీ

      మృదువుగ నల మేలుగా తేలి రా మేఘమాలా దరిన్'
  sugaMdhi:
  - text: 'రా విరించి పత్ని రా వరాల నివ్వ నవ్వి రా

      రావె మోహనాంబ రా స్వరాల దేవ గంగ రా

      రావె జేతు పూజ రా సురామ్ర పల్లవాంగి రా

      రావె విద్దె లమ్మ రా పురాతనాంతరాత్మ రా'
  - text: 'రా విపంచి-జన్య-రాగ-రాశి-పూర్ణ-వాణి రా

      రా విదూషి సత్వరాన రా సులక్షణాల రా

      రా విభూతి నియ్య రా నరార్త జన్మ కావ రా

      రావె దేవ దేవి రా వరాబ్జ సత్సుగంధి రా'
  aSvadhATi:
  - text: 'కావేటి రంగ వరదా కావ రమ్మిపుడు

      దేవాధిదేవ సముదా

      రావేల నన్ను కనగా నీవె నాకెపుడు

      జీవాన సర్వ మనఘా

      భావించ నిన్ను మదిలో నీవు నవ్వుచును

      దీవింతు వొక్క త్రుటిలో

      భావాల కెల్ల కవితై జీవ మిత్తువుగ

      రావాల గీత సుధయై'
  - text: 'గోపాల వేగముగ రా దీప ముంచితిని

      నాపాలి దైవముగ రా

      తాపాల నార్చగను రా యోపలే నిచట

      శాపాల దీర్చగను రా

      నా పొంగు మానసములో శ్రీపదాబ్జముల

      నీ పైడి విగ్రహమె రా

      యీ పేద నిన్ దలచెరా సాపరాధనుర

      భూపాల నన్ను గనరా'
  - text: 'పాలించు వేళ యిదిరా కేలతోడ నను

      లాలించు వేళ యిదిరా

      తేలించు వేళ యిదిరా లీలతో పదము

      లాలించు వేళ యిదిరా

      గేలించు వేళ యిదిరా కేళి యాడుచును

      తూలించు వేళ యిదిరా

      శీలించు వేళ యిదిరా మేలు సౌఖ్యముల

      గాలించు వేళ యిదిరా'
  aSvadhATiKrottaNaDaka:
  - text: 'కావేటి రంగ వరదా కావ రమ్మిపుడు

      దేవాధిదేవ సముదా

      రావేల నన్ను కనగా నీవె నాకెపుడు

      జీవాన సర్వ మనఘా

      భావించ నిన్ను మదిలో నీవు నవ్వుచును

      దీవింతు వొక్క త్రుటిలో

      భావాల కెల్ల కవితై జీవ మిత్తువుగ

      రావాల గీత సుధయై'
  kaluvadaMDa:
  - text: 'చెన్నుగ గీచె చిత్రముల

      చెల్వపు

      కన్నులు వ్రాసె కావ్యముల

      తెన్నులు జూపె పుష్పముల

      తిన్నగ

      మున్నడ పల్కె నందముల

      వెన్నెల వెల్గు దీపముల

      విందుగ

      సన్నగ బాడె గీతముల

      వన్నెల నిండు భావముల

      భామిని

      యెన్నగ దెచ్చె స్వర్గముల'
  - text: 'పెదవులు బల్కె సత్కవిత

      ప్రేమల

      ముదములు పాఱు సత్సరిత

      వదనము బాడె ప్రీతి కథ

      బంగరు

      హృదయమునందు గానసుధ

      తధిమిత యంచు నాడెగద

      తాళము

      వదలక వేసె నా యెడద

      రదనము రమ్య చంద్రకళ

      రాగల

      బ్రదు కొక యందమైన కల'
  - text: 'నిదురయు నాకు రాదుగద

      నిండిన

      హృదయము భార మాయెగద

      వదనము మూగవోయెగద

      వాక్కున

      పద మది యొండు రాదుగద

      కుదియని వంత హెచ్చెగద

      గుంజన

      బధిరునితోడి మాటగద

      యెదుటను వాడు రాడుగద

      యెక్కడొ

      వెదుకుట కష్టమయ్యెగద'
  - text: 'అరుణము రాగదీపికలు

      హంసిని

      యరుణము పద్మబాలికలు

      యరుణము మేఘమాలికలు

      హాసిని

      యరుణము చిత్ర శారికలు

      యరుణము పుష్పవాటికలు

      హారిణి

      యరుణము పల్లవాగ్రములు

      యరుణము భాను సద్రుచులు

      హ్లాదిని

      యరుణము సుప్రభాతములు'
  - text: 'వేసెద కల్వదండలను

      వేయుచు

      జూసెద గల్వ కన్నులను

      వ్రాసెద నవ్య ఛందముల

      వ్రాయుచు

      జూసెద నందచందములను

      కోసెద క్రొత్త పూవులను

      గోయుచు

      జూసెద తేనెమోవులను

      చేసెద నవ్య సృష్టులను

      జేయుచు

      జూసెద దివ్య దృష్టులను'
  vAgjhari:
  - text: 'వృత్తమ్ముల్ బలు కూర్చినాను విధిదేవి నీవు గ్రహించు, నా

      చిత్తమ్మందు సువిగ్రహమ్ముగ నినుంచితిన్ నిజభక్తితో

      నిత్తె మ్మీ నను గావు మమ్మ వరదా నిరంతర వాగ్ఝరీ

      ముత్తెమ్మై పదముల్ సితాబ్జవదనా ముదమ్మున రాల్చుమా'
  - text: 'కృష్ణా యంచనరాదొ పాపములు తగ్గి శాంతియు కల్గు, యో

      వృష్ణీ యంచనరాదొ కాంతిమయమై వెలుంగు భవమ్ము, యో

      జిష్ణుప్రేమి యనంగ రాదొ మది భాసిలున్ శుభదీపమై

      కృష్ణా నీవె గదా సదా జగమునన్ కృపాబ్ధి వృషాకపీ'
  - text: 'తల్లీ నిన్ను దలంచి పుస్తకము జే-

      త బూనితి నీవు నా

      యుల్లంబందున నిల్చి జృంభణముగా

      నుదాత్త పదమ్ము శో-

      భిల్లం బల్కుమ నాదు వాక్కునను సు-

      ప్రియమ్ముగ మోహినీ

      ఫుల్లాబ్జాక్షి సరస్వతీ భగవతీ

      ముదేందుముఖాంబికా'
  - text: 'రాగద్వీపములో రసార్ద్ర మతితో రమించగ రమ్మురా

      రాగాంభోనిధిలో ప్రసన్న మతితో భ్రమించగ రమ్మురా

      భాగమ్మౌదునురా వసించి మదిలో ప్రమోద మొసంగగన్

      ఆగంజాలనురా హసన్వదన రా నమోఘ సుఖమ్మియన్'
  rAsAMtaraMga:
  - text: 'రేపు రా రేరాజ ఱేడిట లేడే

      వృథయౌను నీ వెన్నెలల్

      రేపు రా పవనమా ఱేడిక రాడే

      వృశ్చికము నీ తాకిడుల్

      రేపు రా తారకా ఱేని కలుకయెన్

      నృపుడు నా రిపు డయ్యెనే

      రేపు రా పుష్పమా ఱేడు మఱచెనే

      రిక్తమే సౌగంధ్యముల్'
  - text: 'నీవు తాకిన చోట నిగనిగ విరిసెన్

      నెత్తావితో బూలతీగల్

      నీవు పల్కిన మాట నిజముగ నగునే

      నిండు యర్థాల పదముల్

      నీవు చూచిన చూపు నిముసములో నను

      నిప్పువలె కాల్చివేసెన్

      నీవు వచ్చిన చాలు నెఱయగు నా యీ

      నిస్సారమగు మంకియున్'
  - text: 'నీకేమి తెలుసురా నెలత హృదయమును

      నిప్పులో మండేనుగా

      నీకేమి తెలుసురా నిర్ఘృణ నా స్థితి

      నీ ప్రేమ బూటకముగా

      నీకేమి తెలుసురా నిరతము వ్యధతో

      నిట్టూర్పు యుష్ణోగ్రతల్

      నీకేమి తెలుసురా నీవును నావలె

      నేలపై జన్మించరా'
  - text: 'రసములను జిలుకరా రసమయహృదయా

      రాసాంతరంగా హరీ

      ప్రసవించె గ్రొన్ననలు వనమున

      లతలన్ వాసనల పరిమళముతో

      దెసలలో గ్రొవ్వెలుగు తిమిరము నాపన్

      దేదీప్యమానమయ్యెన్

      నిసిలోన గ్రొంగ్రొత్త నృత్యము లాడుచు

      నే గీతి బాడెదను రా'
  kalakaMTha:
  - text: 'మనసార నిన్ను గన దనివార నిన్ను గన

      కనులార నిన్ను గనగా

      జనియించె గోరికలు చినచిన్న కోరికలు

      ప్రణయాంక భేరికలుగా

      నను జూడ రాగమయి యనురాగ కాంతిమయి

      యనురంజనాంగమయి రా

      నునుపైన యందముల దనరారు చందముల

      దినదిన్నగా దరికి రా'
  - text: 'కలకంఠ రావముల దులలేని భావముల

      వలపించు ఠేవముల రా

      యలరింపు జాడగను చెలువంపు నీడగను

      లలితంపు మేడగను రా

      యలలోని యింపులుగ వెలలేని కెంపులుగ

      శిలలోని వంపులుగ రా

      వెలుగారు వెన్నెలగ దళుకారు వన్నెలుగ

      గులుకారు చిన్నెలుగ రా'
  madakalanI:
  - text: 'ఉదయము నందలి యుషవా

      ఉదిత సువాంఛల తృషవా

      ముదమను పాలకు నురువా

      ముదితల మధ్యపు కఱవా

      చెదిరెడు కాంతుల వలవా

      చిదిమిన కుంకుమ శిలవా

      మదిరకు తీయని నిషవా

      మదకలనీ నను గనవా'
  - text: 'విరిసిన పుష్పపు చెలువా

      విరిసిన యందపు తరువా

      కురిసిన వర్షపు సెలవా

      కురిసిన యందపు చెరువా

      తరిసిన డెందపు నెలవా

      తరిసిన యందపు బరువా

      మురిసిన మోహపు కెలవా

      మురిసిన యందపు తెరువా'
  rasapriya:
  - text: 'భళీ వసంత ఋతూదయమ్ము ప్రమోదకారి యయెన్ గదా

      కిలా కిలంచు వనిన్ పులుంగు కృషిన్ జరించె బెడంగుతో

      కలల్ గనంగ మదిన్ దలంతు కళాస్వరూప నిలన్ సదా

      చెలీ వినంగ సుధాస్వరాల సెలల్ బిరాన నిటుండితిన్'
  - text: 'మదిన్ వెలింగె హరీ యనంగ సదా త్వదీయ శుభాకృతుల్

      మదిన్ మెలంగె హరీ యనంగ సుధా తరంగ రసోదధుల్

      మదిన్ జెలంగె హరీ యనంగ ముదానుభూతి సుమావళుల్

      మదిన్ దొలంగె హరీయనంగ హృదాంతరాళ వ్యధాశ్రువుల్'
  - text: 'వరాంగి నిన్ను స్మరింతు నెప్డు ప్రశాంతమైన మనస్సుతో

      వరాల నిమ్ము కరాలతోడ ప్రసూనరాశివలెన్ దయన్

      స్వరాలతోడ గళమ్ము విప్పి పదాలచెంత బదమ్ములన్

      విరించిరాణి విపంచిపాణి ప్రియాన బాడి నుతింతు నిన్'
  - text: 'తరించినాను నిజమ్ముగాను తరంగగీతి వినంగ నే

      భరించలేను నిమేషమైన ధరిత్రిలోన విడంగ నిన్

      చరించినాను జగమ్మునందు సరోజనేత్ర కనంగ నిన్

      విరాళితోడ గృహాన నుంటి బిరాన రమ్ము రసప్రియా'
  jayabhAratamAnasamu:
  - text: 'గానము నీకే సుకవీంద్రా యజయా

      నేనఓ భారత-మణి నిను ధ్యనింతున్

      మానసమ్మునందు మదీయ మోహనా

      నీ నామ-స్మరణె నిరత మో కృష్ణా!'
  bhRmgi:
  - text: 'పిలిచితి మదియమ్దు పేరాశలన్ నింపి ప్రేమించుచున్

      పలుకుమ వడి నాకు ప్రాణమ్ములన్ నింప పాలించ రా

      నెలత మనసు వంత నీ యూహ కందేనె నిర్ణాయకా

      నెలతగ మరు జన్మ నీకౌను తాపాగ్ని నిశ్వాసముల్!'
  nArAca:
  - text: 'పిలిచితి మదియమ్దు పేరాశలన్ నింపి ప్రేమించుచున్

      పలుకుమ వడి నాకు ప్రాణమ్ములన్ నింప పాలించ రా

      నెలత మనసు వంత నీ యూహ కందేనె నిర్ణాయకా

      నెలతగ మరు జన్మ నీకౌను తాపాగ్ని నిశ్వాసముల్!'
  dvipadaSuddhaMaMjarIdvipada:
  - text: 'గగనములో శశి కళలన్ వెలిగెగ

      మొగమును గన నతి ముదముల్ కలిగెగ

      నగవుల ముద్దుల నను ముంచు రయము

      సొగసగు మాటల సుఖమౌ హృదయము'
  lIlAkhElA:
  - text: 'కల్లోలమ్ముల్ తాపాగ్నుల్ సంగ్రామమ్ముల్ సందోహాలై

      యుల్లంబందున్ పల్ సందేహా లుత్పన్నమ్మౌ నిత్యమ్మై

      చల్లార్చంగా హృద్రంగమ్మున్ శాంతుల్ సంతోషా లీవే

      ఫుల్లాబ్జాక్షీ లీలాఖేలంబుల్గా నీ సత్కృత్యంబుల్'
  kRshNapriya:
  - text: 'గగ-భ-స-నలముల కలమున నేడిటి

      కమ్మని పదముల కలిపి తుదన్

      బిగువుగ గురువును పెట్టగ కృష్ణ-

      ప్రియ యగు నింపుల విమలునికై

      సొగసుగ ధ్రువముల చూడగ నబ్ధుల

      సురుచుల వడులవి శోభిలుగా

      ద్విగుణిత మగునే తెలుగున కందము

      త్రింశతి మాత్రల తేనెలతో'
  karNATacaupadamu:
  - text: 'పులుల కేకల దేహమో వణకు లెత్తున్

      పలుకు ధైర్యము లివ్వవా ప్రణతు లిత్తున్

      కలగె డెందము భీతి కారడవి యందున్

      వెలుగు దివ్వెల చూపు వేగముగ నిందున్'
  caMdravadana:
  - text: 'విరబూయునా విరులు పేద బృందావనిన్

      మరి ముంగునా మనసు మంద్ర మందాకినిన్

      చిరు-నవ్వులో సిరుల జేర్చి చిందించుమా

      హరుసమ్ము నీ వతి నయాన నందించుమా'
  maMjari:
  - text: 'విరబూయునా విరులు పేద బృందావనిన్

      మరి ముంగునా మనసు మంద్ర మందాకినిన్

      చిరు-నవ్వులో సిరుల జేర్చి చిందించుమా

      హరుసమ్ము నీ వతి నయాన నందించుమా'
  biMba-pratibiMbakanDamu:
  - text: 'గంగా-నది మీది జల-త-

      రంగమ్ముల్ చేయు సడులు రమ్యతతో శ్రీ-

      రంగని మురళీ-నినద-త-

      రంగములను జేరి సుఖ-తరంగము లయెనే'
  bhramaravilasitamu:
  - text: 'ఈ వాసంతం బిడు పలు విరులే

      నీ వుండంగా నిరతము సిరులే

      నైవేద్యమ్మో నవ-రస-భరితం

      భావాబ్జాలో భ్రమర-విలసితం'
  - text: 'అంగాంగాలో, హరి హరి యనెరా

      శృంగారాలన్ చిలికెద నిటరా

      సంగీతమ్మున్ సరసత వినరా

      రంగా రంగా రమణిని కనరా'
  baMdhukamu:
  - text: 'అరుదుగ పిడికిట నడగెడు నడుముల్

      హస్తి సమానపు యానములున్

      గురు-జఘనములును కుచముల భరమున్

      కొప్పుల గొప్పతనంబులు మే-

      గర-గరికలు సిరిగల నగు-మొగముల్

      కల్కి మెరుంగు కనుంగవలున్

      దొరయగ వెల-పడతులు విట-ధనములు

      దోతురు చొప్పడ నప్పురిలోన్'
  - text: 'వనమున సుమములు పలు-పలు రకముల్

      వందల రంగుల పూచినవే

      మనసున తలపులు మధురపు సుఖముల్

      మత్తగు మందుల ముంచినవే

      నిను గన నిలిచితి నిముసము యుగమై

      నీ వరుదెంచెద వంచును నే

      నెనయగ నను గను మెగురుచు ఖగమై

      నింపగు తెల్గున పాటలతో'
  mattAkrIDa:
  - text: 'నీకై నేనే నీవే నాకై

      నిరత మిటు నిలువ నగవుల కరుదా?

      ఏకాకిన్ నే లేరే నాకై

      యిల నెవరు హృదిని నలగుచు వెతతో

      శోకాగ్నిన్ మాపేవా నాకో

      శుభములగు సురుచి నలుగడ వెలయున్

      శ్రీకాంతుల్ చిందించన్, నాకై

      చిరునగవు సిరుల ననయుచు వడి రా!'
  mattamayUri:
  - text: 'రోజూనాకీ ప్రొద్దుటనే పద్యము నిస్తూ

      మోజున్ దీర్చే ముద్దియ రాదేమిటె నెమ్మీ !

      పూజింపమ్గా పూవుల దెచ్చేనని , ఆ నా

      రాజీవాక్షిన్ రమ్మని చెప్తావటె కొమ్చెం !'
  - text: 'వచ్చేవా ! నా ప్రార్థన విన్నానని తెల్పన్

      విచ్చేశేవా విద్యల దేవీ అతివేగన్ !

      ఎచ్చోటున్నా ఏపనినున్నా ప్రభ కోసం

      తెచ్చేవా నీ తీయని పద్యం ముదమారన్ !'
  - text: 'వ్రాయాలంటూ పద్యము చేసే మొక యత్నం

      మాయీ యత్నం మమ్చిది యంటూ అనునిత్యం

      సాయమ్జేస్తూ ఛమ్దము తోడన్ ,పలుకిస్తే

      మ్రోయిస్తామే రోదసి నిమ్డా పదఘోషల్.'
  priyaMvada:
  - text: 'శిశిర కాలమున గాలి హోరులో

      శశియు మండె నట నాకసమ్ములో

      నిశిలొ నొంటరిగ నీదు రాకకై

      దిశల జూచితి ప్రియా ప్రియంవదా!'
  - text: 'వరద వెల్లువగ పారి చేర రా

      కిరణ జాలముల చల్లి మెల్ల రా

      స్వ్రపు మాలికల నల్లి పాడ రా

      సరస జేరవె ప్రియా ప్రియంవద!'
  - text: 'మనసు రెండవియు నొక్కటాయెగా

      తనువు రెండవియు నొక్కటౌనికన్

      మనకు భావి యొక స్వర్ణ-కాలమౌ

      కనుల గాంచవె ప్రియా ప్రియంవదా!'
  kaLAtma:
  - text: 'రావె యాడెద నవ రత్న రంగముపయి

      రా ప్రియాన లతగ బ్రాతి బ్రాకగా

      రావె పాడెద వర రాగ రాగిణులను

      రా ముదాన నిచట ప్రాణ రాగదా

      రావె మీటెద నతి రమ్య రావములను

      రా సుధాంశ గళము రక్తి క్రంగగా

      రావె వ్రాసితి నొక రంగు రంగుల కల

      రా కళాత్మ ప్రణయ రాత్రి రశ్మిగా

      నీవె మానసమున నెమ్మి నిండుకొనిన

      నిగ్గు గాదె వెలుగు నీల తారకా

      నీవె మానసమున స్నేహ నిర్మలతకు

      నిష్ఠ గాదె నెనరు నింపు తల్చగా'
  kOkilasvarapaMchamamu:
  - text: 'కొమ్మకొమ్మలు ప్రకటించె క్రొత్త విరుల శుభాగమము

      రెమ్మరెమ్మల నిండె గద ఱింగుమను భ్రమ రాగమము

      గుమ్ముగుమ్మను వాసనల కోకిల స్వర పంచమము

      కమ్మగాను వసంతమున గలుగు ప్రేమ సమాగమము'
  - text: 'కన్ను కన్నులు కలియగా కలలు నిజముగ పండుగా

      నిన్ను జూచిన క్షణములో నేను గోరితి మెండుగా

      నన్ను మఱచితి, కడాలిలా నాకు హృదయము పొంగెరా

      చిన్నదానిని జూడరా చేరి సుధ లొలుకంగ రా'
  - text: 'చంద్ర బింబము కాంతితో సంధ్యయం దుదయించగన్

      సంద్ర మందున సడులతో చాల యల లలరించగన్

      మంద్ర స్వరముల నూదరా మధుర వృష్టియు కురియగన్

      nింద్రధనువున రంగులై హృదయ సుమములు విరియగన్'
  - text: 'ఆదివార మ్మెందుకో యవని ఫెళ్ళున కంపించె

      ఖేద మొసగగ నా జడధి కెరటముల బలు పంపించె

      వేదనలతో జగమెల్ల వెక్కి యేడ్చుచు విలపించె

      మేదినిపై తాండవముతో మృత్యు దేవత కనిపించె'
  - text: 'మేదినిన్ గనిపించునా మిసిమి నవ్వుల నవ కాంతి

      మేదినిన్ వినిపించునా మించు స్వరముల సుఖ శాంతి

      మేదినిన్ మురిపించునా మీననయనలు గీతముల

      మేదినిన్ బ్రదికించునా మీది దేవుడు ప్రేతముల'
  harsha:
  - text: 'ఘర్షమ్ము లాగు నింక, ప్రజలకు

      హర్షమ్ము గల్గు నీ యవని, ముద

      వర్షమ్ము గల్గు నీ వసుధ, నవ

      వర్షమ్ము తెచ్చు సంపద సిరులు'
  - text: 'భూదేవి శాంతితో పులక లిడ

      భూదేవి కాంతితో మురువు లిడ

      మోదమ్ము నిచ్చు నీ భువి జనుల

      కా దేవు డెప్పుడున్ హరుసముగ'
  muvvalamrOta:
  - text: 'తెల్లని మేఘాలు తెచ్చేను జ్ఞప్తికి

      మాతృదేశపు మంచి తలపులు

      బొమ్మల కొలువుల కమ్మని పాటలు

      మనసులో నాకు మారుమ్రోగేను'
  - text: 'దసరాల సరదాల మిసిమించు వెల్గులన్

      కనులముందుగ కనిపించె నిపుడు

      పంతుల వరహాలు పప్పు బెల్లాలు

      విజయదశమియు వెచ్చని స్మృతులు'
  - text: 'మురిపించు మువ్వల మ్రోతల సందడి

      నవముగా నిల్చె నాలోన యెప్డు

      తూరుపు రంగుల నీ రోజు పడమట

      కలలలో జూచి కలగుచు నుంటి'
  aaTaveladi:
  - text: 'చందమామ రావె జాబిల్లి రా రావె

      చిన్ని పాప జూడ శీఘ్రముగను

      చింద రావె వంద యందచందాలను

      వెన్నెలలను తెచ్చి విందు నిడవె'
  veladigeeti:
  - text: 'ఏడువకుమ పాప యేడువకుము

      నిద్ర పొమ్ము భయము నీవు మాని

      ప్రక్కనుండు తల్లి పాలు నీయ

      ప్రక్కనుండు తండ్రి పాట పాడ'
  aaTageeti:
  - text: 'చిట్టి పాప కెపుడు శ్రీరామ రక్ష నా

      కంటి పాప కెపుడు కన్నయ్య రక్ష యీ

      చంటి పాప కెపుడు జంట దైవము రక్ష

      జడుసుకొనకు పాప జగ మెల్ల నీ రక్ష'
  pannITijallU:
  - text: 'పన్నీటి జల్లో నవరసాల పలుకో

      మిన్నేటి యందాలో మిసి మించు కులుకో

      కన్నీటి గీతాలొ కరుణార్ద్ర కలితా

      నన్నూపి లేపేవు నడిరేయి కవితా'
  ElA:
  - text: 'ప్రభవంపు ప్రాభవపు ప్రతిమయగు దేవీ,

      విభవంపు వేవెలుగ, విమలతర మూర్తీ,

      శుభమైన రోజు యిది, సుకరముగ నీ స-

      త్సభలోన సంతతము దయ నొసగ వేలా?'
  citralahari:
  - text: 'చిత్ర వర్ణములను చిత్ర గగన మందు

      చిత్రముగ రచించె చిత్రకారు డిందు

      చిత్ర లహరి లేచె చిత్ర హృదయ మందు

      చిత్ర మగును బ్రదుకు చిత్ర భువన మందు'
  susvaralahari:
  - text: 'భంగిమ లెన్నియొ చూడర భావము లొలికెద రారా

      రంగుల నింపెద రాత్రుల రాగము పలికెద రారా

      పొంగును డెందపు సంద్రము పున్నమి వెలుగుల చిందున్

      సంగతు లెన్నియొ చెప్పెద సంగమ సమయము నందున్'
  AnaMdalahari:
  - text: 'భువనాల యెల్లలో జనియించె ముదమిచ్చు మురళి గీతపు సిరులు

      నవరాగ లతికలో వికసించె నగుచున్న నందనపు నును విరులు

      రవము లొక యానంద లహరియై రమ్యముగ మదిలోన లేచెగా

      నవరంగ సీమలో నొక క్రొత్త నటన యది నన్నిపుడు యూచెగా'
  ardhasusvaralahari:
  - text: 'తళతళ లాడెను దివియును

      మిలమిల లాడెను భువియును

      గలగల లాడెను నదియును

      విలవిల లాడెను హృదియును'
  aSOkamu:
  - text: 'ఆకలి ఖరమౌ యాకృతి దాల్చెన్

      భీకరమగుచున్ ప్రేవుల గాల్చెన్

      వ్యాకుల హృదిలో బాధలు నిండెన్

      చీకటిమయమై చింతల మండెన్'
  praharaNakalita:
  - text: 'హలములు బరువా హలికులు కరువా

      బిలమయె కడుపుల్ వెతలకు చెరువై

      ఫలరహితము లీ బ్రదుకుల తరువుల్

      శిలయయె తనువుల్ శిథిలము లిరవుల్'
  ramaNageeti:
  - text: 'తలచితి నిను తడబడ హృదయము

      తలచి తలచి నిను తడియయె కన్నులు

      తలను చూప తన్మయ మగు నెద

      తలుపులు తెఱచితి త్వరగను రా హరి'
  - text: 'రమణ గీతి రచియించితిని ప్రీతి

      విమల నీ విందుగ వేడ్కలు చిందగ

      రమణ రార రసము లొలుక చేర

      భ్రమలు తొలగు నింక బ్రదుకు విరియు నింక'
  ravIiMdracaMdrika:
  - text: 'నేను లోకమునకు

      లేను, చాల దినాల

      నీ నన్ను మఱచి రెల్ల


      మేను దిన దినము

      క్షీణించె, చివర కీ

      ప్రాణ పక్షియు నెగురు


      ప్రాణములను వదలి

      నే నైదు భూతాల-

      తో నొక్కటయ్యెదను


      కాని, నీదు ప్రేమ

      నేను మఱువజాల

      nే నాడు సత్యముగ'
  nartakigeeti:
  - text: 'మనసునందు నీవె

      కనులయందు నీవె

      స్వనములందు నీవె

      వనజ నయన

      నిను దలంచె మనసు

      నిను దలంచె తనువు

      నను దలంచి రార

      వనజ నయన'
  lalitagati:
  - text: 'తరగలను పూర్ణ శశి ధారుణికి పంపెన్

      తరగలను హరి మురళి ధారలుగ నింపెన్

      తరగలను యమున నది తళతళలు తెచ్చెన్

      తరగలవి లలితగతి తన్మయత లిచ్చెన్'
  aanaMda:
  - text: 'ఎందుకోయి బాటసారి యిటుల నేడ్తువే

      కుందకోయి తిమిర మందు కొందళమ్ముతో

      ముందు గలదు మంచి రోజు ముదము నీయ నా-

      నంద సూర్యు డవతరించు నాట్యమాడరా'
  - text: 'కాంతి కిరణ జాలములను గాంచు తూర్పులో

      చింత వదలు వంత లెల్ల చెదరి పోవుగా

      శాంతి నిండ మనసులోన సాగు బాటలో

      నంత మవని యాశతో ననంత దృఢిమతో'
  pogaDasaramu:
  - text: 'పదముల పాడెదన్, పిలిచి వలపుల పీటను వేతు, పుల్కలన్

      బెదరుచు పూతు గంధమును, పృథుకము పెట్టెద నావుపాలితో

      ముదమున, పేద పైదలియు పొగడ సరాలను పోహణింతు, నీ

      సుదినము పౌర్ణమిన్ బ్రదుకు శుభమవ, పండ తపః ఫలమ్ము రా!'
  bhAminIshaTpadi:
  - text: 'చెలియ బంగరు చెలిమి బంగరు

      వలపు బంగారమని చెబితివి

      చెలిని చూడవు కాదు సరి యిది చిలిపి కృష్ణయ్యా

      కలత నిద్దురలోన కంటిని

      కలువ కన్నుల వాని కలలో

      నులికి పడి లేచితిని నేనిట చిలిపి కృష్ణయ్యా'
  - text: 'వెలిగె నాకాశమున తారలు

      వెలిగె నాకాశమున చంద్రుడు

      వెలుగు నవ్వుల రూపు చూపర చిలిపి కృష్ణయ్యా

      పలుకు వజ్రపు తునకలా హరి

      పిలిచి యలసితి పిలుపు వినదా

      చిలుకరించగ సుధల వడి రా చిలిపి కృష్ణయ్యా'
  - text: 'తలచు కోగనె తనివి గూర్చెడి

      పలుకు జెలియవు పలుకు పడతివి

      వెలుగు నిచ్చెడి వెలదివీవవి కేలు మోడ్చంగా

      అలుక బూనిన యటుల ఆటలు !

      పలుకు లీనని పచ్చి కోతలు !

      నిలువ గలవటె తల్లి కూతురలిగి కూర్చొనినన్ !'
  - text: 'తేట మాటల తీయతీయగ

      పాట తోడను ప్రస్తుతించగ

      మాట లీయక యున్న నిజముగ బోటి నిలిచేనా !

      ఏటి కమ్మరొ యిట్టి మాటలు

      చీటి మాటికి చిలిపి ఆటలు

      కోటివీణలు మ్రోగినట్టుల పాట రానీకన్ !'
  mallelamAla:
  - text: 'మల్లెల మాలలో, మినుకు

      మని మిసి మీఱుచు వెల్గు తారలో,

      ముల్లెల మూటలో, మృదుల

      పులినములో, మెఱమెచ్చు మేరువో,

      జిల్లను మైకమో, మొగులు

      చిలికెడు వర్షమొ, మోహనోక్తియో,

      తెల్లని మౌక్తికాక్షతలొ,

      తెలుగు పదా లవి మంచి గందమో!'
  chilukapaluku:
  - text: 'చిలుకా యొంటరిగా మనస్సు నిలిచెన్ శిలయై విరాగాబ్ధిలో,

      పలుకో లేఖయొ లేదు, నిర్దయు డీ బలహీననుం జూడడే,

      వెలుగుల్ నింపుచు నింపు సొంపు లిడ, కంపిల దేహమ్ము, నా దరిన్,

      లలితాస్యుం డిటు వచ్చి మెచ్చి వర మాలల నిచ్చునా, చెప్పవే!'
  hariNagatirагаDа:
  - text: 'అత్త కన్నుల నగ్గి మండెను

      క్రొత్త కోడలు కుందు చుండెను

      చిత్త మందున చింత లౌరా

      బిత్తరిని గన వేగ రారా'
  - text: 'అందజేయక అడిగినట్టివి

      ఇంద యంచును యిత్తువిట్టివి

      ఎందుకమ్మరొ యిట్టి పద్యము

      అందమైనది యైన హృద్యము'
  - text: 'తెచ్చి పెట్టవె తీపి యందువు

      వచ్చి యిచ్చిన వద్దు అందువు

      పిచ్చి దంచును విసిరి వేతువు

      రచ్చ కీడ్తువు రభస జేతువు'
  - text: 'మంచి దిచ్చిన మాట వేతునె

      కొంచెమైనను గొడవ జేతునె

      అంచ యానకు హరుసమీయనె

      వంచి శిరసును ప్రణతి జేయనె'
  vitALacatuShpada:
  - text: 'ననలు విరిసినవి నంద వనమున

      కనక లతల ఛవి కనులకు కలిమి

      నినదముల యలల నెమలు లొనర్చె

      తనిసె చెవులు విని తన్మయ మొంది'
  ratnAvaLi:
  - text: 'ననలు విరిసినవి నంద వనమున కనక లతల ఛవి కనులకు కలిమి

      నినదముల యలల నెమలు లొనర్చె తనిసె చెవులు విని తన్మయ మొంది

      నునుపగు వెలుగులు నూత్న విధముగ నణు వణువున కొక నందము నిచ్చె

      నినె ప్రతి ఘడియయు నిజముగ తలతు వని నను గన హరి వలపుల రార'
  navanaMdinI:
  - text: 'నవ చేతనమ్ము లిట నాకు కలిగేనే

      నవ భావనమ్ము లిట నాకు వెలిగేనే

      నవ జీవనమ్ము లిట నాకు వెలసేనే

      నవనందినిన్ గనగ నంద ముబికేనే'
  - text: 'ముదమార మోదకము మోదమిడ నిత్తున్

      హృది నిన్నె యో చతుర యీ చవితి పాడెన్

      మది పారె గంగ వలె మంగళకరమ్మై

      యుదరమ్మమేయ జగ మో యభయహస్తా

      మద హస్తి మస్తక సమస్త గణ నాథా

      యిదె నాకు చూపు కృప నింపుగ కుమారా'
  cArumatI:
  - text: 'నా చిలుక నేర్చినది

      నందముగ నేడు నవ

      నైపుణుల క్రొత్త పదమున్

      నా చిలుక ముద్దుగను

      నత్తి నుడి యాడినది

      నవ్వు లవి పువ్వు లయెగా

      పూచినది నా హృదియు

      పూర్ణతను పొందె ముద

      మొందె హరి నామము వినన్

      యాచనము జేతు విన-

      యాన నిక పల్కు హరి

      యంచు హరి యంచు హరిణీ'
  bhAratavajra:
  - text: 'భారతదేశము భవ్య సక్షేత్రమ్ము ప్రమోదకారియే సదా

      భారతదేశము స్వర్ణ భూలోకమ్ము ప్రజా సమూహమే గదా

      భరత వజ్రము రంగులన్ శోభించు భవిష్యగీతి మ్రోయగా

      హారతు లెత్తగ రండు రండోయ్ వేగ మనంతయాత్ర జేయగా'
  maanini:
  - text: 'రమ్మిట రాగిణి రాగమయీ కన

      రమ్మిట నన్ననురాగమయీ

      చిమ్ము ముదమ్ముల భోగకరీ విర-

      జిమ్ము సుగంధము యోగకరీ

      కమ్మగ బాడుమ గానసుధా కన-

      కమ్మయి వెల్గుమ కాంతిరదా

      సమ్ముద మీయు లసన్మదిరా సర-

      సమ్ముగ జేరు హసన్మధురా'
  gItika:
  - text: 'మనసందు మోహన రూపమే దినమందు నల్లని రాత్రిలో

      నిను జూడగా మనసాయెరా నను నెమ్మితో గనరా ప్రియా

      విను గీతికల్ ప్రణయంపు రాగిణి వెల్లు వయ్యెనురా సఖా

      ధన మీవె యో వనమాలి జీవనతారవై కనిపించరా'
  giribAlA:
  - text: 'శిర మెత్తెన్ హరు జూచెన్ చిఱు డెందం బెర యాయెన్

      సరసాలన్ మరు డేసెన్ శరముల్ తా హరు పైనన్

      వరియించెన్ గిరిబాలన్ పరమేశుం డరుసమ్మై

      తరులెల్లన్ విరులాయెన్ తరుణమ్మో సిరి యాయెన్'
  - text: 'గిరులందున్ దరులందున్ విరులందున్ మురిసేవా

      సురబాలా గిరిబాలా సరసాలన్ కురిసేవా

      హరలీలాంబర తారా హరిలీలాంబర చంద్రా

      వరదాయీ పరమాత్మా హరుసాలన్ వరమీవా'
  dhavaLakusumamu:
  - text: 'ధవల-కుసుమ-ధారిణీ మృదుల-హసిత-కారిణీ

      విశద-విమల-హారిణీ వివిధ-లలిత-హారిణీ

      తరుణ-హృదయ-హారిణీ మదన-జలధి-తారిణీ

      విపుల-జఘన-భారిణీ ద్విరద-మధుర-చారిణీ'
  - text: 'ధవళ కుసుమ మాలలన్ దనర నిచట నల్లితిన్

      తవ గళమున వేయగా దగు నిది యని నమ్మితిన్

      శ్రవణములకు నింపుగా స్వరమయమగు గీతముల్

      నవ రసముల నింపితిన్ నయ మవగను జిత్తముల్'
  - text: 'కనుల గనులు జూడగా కవనము లయె బాడగా

      మనసు మనసు జూడగా మధుర రసము బుట్టెగా

      వినగ బ్రణయ రాగముల్ వెలిగె వలపు దీపముల్

      మినుకు లయెను మోహముల్ మెలిక లయెను దేహముల్'
  - text: 'అనవసరపు యోచనా యమల కమల లోచనా

      యనఘ యఘ విమోచనా యమిత కరుణ సూచనా

      యనుపమ సుఖ శాంతితో నమృత భరిత కాంతితో

      మనుగడ సరిజేయుమా మమతల నను డాయుమా'
  - text: 'నవము నవముగా హిమం బవని బడెను చల్లగా

      ధవళ కుసుమ రాశు లీ చెవుల బడక మెల్లగా

      దివియు మణుల జల్లగా భువియు ముదము నందెగా

      శివము నటన మాడెగా కవిత లలరి చిందగా'
  suSObha:
  - text: 'చకచక వచ్చితిన్ సరస చల్లగ జూడు మనసిట బొంగగా

      ప్రకటము లౌనుగా వలపు వల్లరి బూచు ప్రవిమల పుష్పముల్

      వికలముగాను జేయకుము విహ్వలనైతి గడు వెతతోడ నేన్

      సుకముల నీయవా యిక సుశోభలు పండి భవ మిల నిండగా'
  mAninImaNi:
  - text: 'రాధను నే నిను గోరితి

      వేదనతో నిట వేగితి

      బాధలతో

      వాదనలన్ విడనాడుము

      కాదనకన్ నను జేరుము

      మోదముతో

      ఆదరమున్ నను గూడను

      నా దరికిన్ దయతోడను

      ముందుగ రా

      తాధిమితా యని యాడుచు

      నాదములన్ బలు పాడుచు

      విందుగ రా'
  iMdumukhI:
  - text: 'అందముగా వెల్గులతో నంబరమే నిండెనుగా

      సుందరమై తోచెనుగా చుక్కలతో చంద్రు డటన్

      విందులయెన్ గంధముతో వేయి విరుల్ తీవెలలో

      నెందు గనన్ దల్తు నినే యిందుముఖీ ప్రాణసఖీ'
  - text: 'వన్నెలతో చిన్నెలతో మిన్నల వెల్గున్న ప్రియా

      కన్నులతో నన్ను గనన్ పున్నమిలా తిన్నగ రా

      తిన్నని నీ తెన్నులలో వెన్నెలలే క్రొన్ననలే

      యెన్నడు నే నిన్ను గదా నెన్నితిగా సన్నుతులన్'
  kAdaMbari:
  - text: 'నీలమౌ కాదంబినీ

      నీలదేహుని జూచితే

      యేల రాడో త్రాగగా

      లీల నీ కాదంబరిన్'
  - text: 'చూసితిన్ గాదంబినిన్

      వ్రాసితిన్ గాదంబరిన్

      రాసలీలాలోలునిన్

      వాసుదేవున్ బిల్చితిన్'
  - text: 'ఆటలన్ నే నాడెదన్

      బాటలన్ నే బాడెదన్

      నీటుగాడా రమ్మురా

      గాటమై ముద్దిమ్మురా'
  - text: 'పువ్వు పాదాలందునన్

      నవ్వుతో నే నిచ్చెదన్

      నవ్వుతోడన్ రమ్మురా

      దివ్వె నీకై యుంతురా'
  maMdAkinI:
  - text: 'మందాకినిన్ నీరాడితిన్ మంత్రాల నే వల్లించితిన్

      సౌందర్యమున్ నే జూచితిన్ సౌదామినిన్ సంద్రాలలో

      విందైన సద్గీతమ్ములన్ ప్రేమించి నిన్ నే బాడితిన్

      నందాత్మజా యర్పింతు నే నా జీవమున్ నీకై సదా'
  - text: 'వాడేలకో రాడాయెనే నేడేలకో రాడాయెనే

      పాడంగ లే నాడంగ లే వాడేడనో రాడాయెనే

      తోడుండి నన్ కూడంగ నా ఱేడేలకో రాడాయెనే

      నా డెందమో పాడాయెనే వాడంగ నే రాడాయెనే'
  varUthini:
  - text: 'ధరామరుడు పురమ్ము జన దపించె నట హిమాద్రిపై

      వరూథినిని ద్యజించి చనె వరించకను హరీ హరీ

      సరోజముఖి కలంగె మది చరించె వని నతి వ్యధన్

      విరించనుని విలాసములు విరూపమగు విషాదమా'
  janani:
  - text: 'రమించ కవిత సరసముల రసముల

      భ్రమించ మనసు విభవమున భవమున

      నమింతు జనని వినయముగ నయముగ

      క్షమించి యొసగు ప్రకరముల కరముల'
  manOjna:
  - text: 'భారతి, సార్థకమైన మంచి చదువుల్ భారమ్ము లేకుండ స-

      ద్ధారగ నీయుమ, పూజ సేతు నిను నిత్యమ్మున్ మదిన్ భక్తితో

      ప్రేరణ లిమ్ము నిరంతరమ్ము విలసత్ప్రేమార్ద్ర భావమ్ముతో

      సారమతిన్ సుమనోజ్ఞ కావ్యరచనా సంసిద్ధికై శ్రీమతీ'
  lAlitya:
  - text: 'తల్లీ, నా మది నిల్చి గావుమా, త్వత్పాదమ్ములన్ భక్తితో

      నుల్ల మ్మందున నెప్డు బూచు బూలన్ సోత్సాహినై గొల్తు నేన్

      సల్లాలిత్యము నింపుమా పదాలన్ సౌందర్య మొప్పారగా

      జల్లై జిల్కు భవత్కృపాసుధన్ సచ్ఛందోంబుధీ, భారతీ'
  dIrgha:
  - text: 'రాధన్ గానగ రమ్ము, దుర్భరము సఖ, రాత్రుల్ సుదీర్ఘమ్ము, లీ

      బాధల్ తాళగ జాల, బంది యయితిని, వాదమ్ము లింకేలరా,

      మోద మ్మీయర, మోహనా, మధురముగ మూన్నాళ్ళు నా కీ భువిన్

      మోదమ్మే గద ముఖ్య వేదము, వరద, మోమెల్ల కన్నాయెరా'
  SubhAMgi:
  - text: 'అమ్మా, నమ్మితినిన్ను, బాయకను నా యాశలన్ దీర్చుమా, దీ-

      పమ్మై వెల్గుచు నంధకారమును బాపంగ వేగమ్ము రా, జ్ఞా-

      న మ్మీయన్ పదముల్ ముదమ్ముగ సదా నా కొసంగన్, శుభాంగీ,

      నెమ్మిన్ నాపయి జూపు నీదు కరుణన్, నిర్వికల్పా సుధాంశా'
  tarurAja:
  - text: 'అరుదెంచె నామని త్వరగ నీ భువికి

      నందాల నందించ నాశలన్ నింప

      తరురాగములు జాల విరబూసె మఱల

      తరులలో గాలిలో దలల నూపుచును

      వర రాగముల బాడె దరుశాఖ లందు

      పంచమ స్వర మెత్తి వంద కోకిలలు

      హరి రార నా చెంత తరురాజ మనగ

      హరుసాల కురిపించి యాట లాడంగ'
  sudha:
  - text: 'మదిలో నిను దల్చుచున్ సదా,

      మధురత నింపెదన్, రమణ, మై

      యది వేచెను బుల్కరించుచున్,

      యధరము లయ్యె చిందు సుధయై,

      ముద ముల్లసిలన్ గనంగ రా,

      ముదితకు నీయగా సుకృతముల్,

      వదనమ్మును జూచి పొంగుచున్,

      పదముల బాడెదన్, వరరవా!'
  rAtri:
  - text: 'రాత్రి వేళాయెరా కన్నయ్య రావేల వేవేగ యింటికిన్

      చిత్రమౌ వెన్నెలన్ జూపించు చిద్రూపమున్ నాదు కంటికిన్

      గాత్రమున్ లేచుగా నిన్ జూడ గానంపు గంధర్వ రాగముల్

      ధాత్రిపై నీకు నే జూపింతు ధారాళమై స్వర్గభోగముల్'
  haravijaya:
  - text: 'మానసమ్మునందు బుట్టు మారు జంపినావు మహేశా

      జ్ఞానబిందు వీవు గానసార మీవు దేవ ఉమేశా

      ప్రాణవాయు వీవె మాకు శ్వాసయందు యెప్డు నవాంశా

      దీనబంధు వంచు ప్రస్తుతింతు నిన్ హరా విజయాంశా'
  ratnaaMgi:
  - text: 'శ్రీలతో రత్నాంగి చిందించ సొబగులన్ రా, నీ

      కాలితో నాట్యాల గన్విందు నొసగుమా రాణీ

      మాలలన్ నే వేతు మచ్చిత్త ప్రతిమకున్ రావా

      పూలతో నే గొల్తు పూర్ణేందు వదన సద్భావా'
  gaganavihAri:
  - text: 'నీవో గగనవిహారి,

      నేను జీవింతు నిందు

      నేలపై, బందిగా నుందుగా

      రావా, యుగముల హారి,

      రమ్ము, వేచేను నేను

      రాత్రి యానందమున్ బొందగా

      భావాల సరసిలోన

      పద్మపత్రాలు నిండె,

      పాట లెన్నెన్నొ పుట్టేను రా

      నా విశ్వపరిధి కెప్డు

      నైజ కేంద్రము నీవె,

      నర్మ నాట్యమ్ము సల్పేను రా'
  tribhaMgivale mAnini:
  - text: 'మన్ననతో గనుమా కథలన్ వినుమా ప్రియ యంచనుమా మనుమా

      చిన్నియలే కురిసెన్ గలువల్ విరిసెన్ మదియో మురిసెన్ దరిసెన్

      వెన్నెలలో నలపే యెపుడున్ దలపే హృదిలో వలపే పిలుపే

      పున్నమిలో సరమున్ హృదయాంబరమున్ గొను సంబరమున్ గరమున్'
  amRtagIti:
  - text: 'అందాల శశిని నేను ఆనంద తార వీవు

      అందాల విరిని నేను ఆనంద మధుప మీవు

      అందాల పాత్ర నేను అందున్న అమృత మీవు

      అందల యువత నేను అపురూప కవిత నీవు'
  - text: 'పలుకు మకరంద మందు చిలుకు మాధుర్య మేను

      కులుకు మణిపూస పైన వెలుగు కిరణమ్ము నేను

      తలపు నునుపొంగులోన పులక తెలినురుగు నేను

      కలల చిరుమాయలోన వలపు కవుగిలిని నేను'
  - text: 'నవరాగ వీణ సల్పు నవతంత్రి ధ్వనులు నీవు

      కవనాల కల్పనలకు నవ సృష్టికర్త నీవు

      భువనాల యెల్ల లందు రవళించు రంగు నీవు

      నవరంగసీమలోన నాట్యాల చిందు నీవు'
  - text: 'నయమగు సిగ్గును నేను నగవుల నిగ్గువు నీవు

      భగభగ మంటలు నేను సొగసగు హిమములు నీవు

      మొగిలున వానను నేను గగనపు హరివిలు నీవు

      సగమగు రేయిని నేను జగతికి కాంతివి నీవు'
  - text: 'రమ్మని యంటిని నేను రానని యంటివి నీవు

      ఇమ్మని యంటిని నేను యీయక యుంటివి నీవు

      కమ్మని బ్రదుకును నీవు కాదని యిపు డనినావు

      పొమ్మిక నా దరి రాకు బొమ్మను మఝచితి వీవు'
  - text: 'పఝగగ కొత్తయె క్రొత్త పాతగ మాఝెను ప్రాత

      అరయగ రాతయె వ్రాత అది యవ దెప్పుడు వాత'
  mAkandamu:
  - text: 'దేవిని సతతము గొలుతును

      పావని ననిశము దలతును

      శ్రీవిద్యల నొసగు మంచు జీవిత మందున్

      ప్రావీణ్యత నొసగు మంచు భావము లందున్'
  - text: 'కందమునే మలచితి మా-

      కందముగా పలికితి ఆ

      ఛందమునకు వింత గతులు సమకూరుస్తూ

      స్పందమునకు క్రొత్త శ్రుతులు సంపాదిస్తూ'
  pushpakELika:
  - text: 'నందకుమార నీ కొసగ నావద్ద లేదేమియున్

      మందిర మౌను మానసము మాధుర్య ముప్పొంగు నీ

      సుందర పుష్పకేళికను జూడంగ రావేలరా

      వందలుగాను పాటలను భావమ్ముతో పాడెదన్'
  - text: 'సంజె వెలుంగులో సరస సయ్యాట లాండంగ రా

      రంజిలు మానసమ్ము ఘనరాగమ్ము లాలించ రా

      కంజదళాక్ష నేను నయగారాలతో నిందు నీ

      కంజలు లిచ్చి రాల్చెదను శుభానంద బాష్పమ్ములన్'
  - text: 'వారము లెన్నియో గడచె భారమ్ము జీవమ్ము, యో

      సారసనేత్ర రమ్ము మెల చల్లంగ జూడంగ నన్

      గూరిమితోడ ముద్దు లిడి కూడంగ వేళాయె, పొం-

      గారును మానసమ్ము చిరకాలమ్ము నిన్ జూడగన్'
  pushpaDOlika:
  - text: 'తరగలవోలె గాలి మెల దాకంగ దేహమ్ము, రా

      మురియుచు పుష్పడోలికల మోదమ్ముతో నూగగన్

      విరియును పుష్పమై మదియు వేవేల పత్రమ్ములన్

      హరి హరి యంచు పిల్చి నిను హారమ్ము వేతున్ సఖా'
  madalalita:
  - text: 'మదలలి తమ్మగు మణిమయ రాత్రుల్

      సదమల గాత్రులు సరసిజ నేత్రుల్

      విధవిధమౌ పలు ప్రియమగు పాటల్

      మధురపు టూహలు మనసున గోటల్'
  chaMdralEkha:
  - text: 'రసమయము యీ రాత్రి రా చంద్రలేఖా

      రసమయము యీ ధాత్రి రా చంద్రరేఖా

      రసమయము నీ కుల్కు రా యింద్రచాపా

      రసమయము నీ పల్కు రా రత్నదీపా'
  vimala:
  - text: 'కమనీయమ్మౌ కావ్యము వలపుల్

      రమణియ మ్మా రంగని తలపుల్

      విమలాంగా యావేదన గలిగెన్

      రమణా రమ్మీ రాత్రియు వెలిగెన్'
  kamalAkshi:
  - text: 'ఉమవలె వెలిగెడు యో కమలాక్షీ

      రమవలె దరి వడి రా చపలాక్షీ

      రమణను పదము సరస్వతి వోలెన్

      భ్రమ లిడ మధురత బాడుమ లీలన్'
  bhaMgi:
  - text: 'భంగిమ లెన్నియొ చూడర భావము లొలికెద రారా

      రంగుల నింపెద రాత్రుల రాగము పలికెద రారా

      పొంగును డెందపు సంద్రము పున్నమి వెలుగుల చిందున్

      సంగతు లెన్నియొ చెప్పెద సంగమ సమయము నందున్'
  padmamu:
  - text: 'శిల యయితివా శ్రీ పద్మాక్షా

      చేర రావేలరా నన్

      పిలిచితిని నిన్ బ్రేమించంగా

      ప్రీతితో వేగ రారా

      వలపు వరమై వచ్చేవా నా

      ప్రాణపుష్పమ్ము పూయున్

      చిలిపి నగవుల్ చిందించేవా

      చిక్కు లెల్లన్ నశించున్'
  rOhiNi:
  - text: 'ప్రియము లొలుకన్ ప్రేమాధారా

      వేగాన రాగాలతో

      రయముగ నిటన్, రాగాధారా

      రా, రోహిణీపాలకా,

      భయము తొలగున్ భావాధారా

      ప్రాప్తించు నానందముల్

      చెయిని నొసగన్ జీవాధారా

      శ్రీరాగమున్ బాడెదన్'
  alakanaMda:
  - text: 'అలకనందయు నాశావేశ-

      మ్మలర నా మందాకినిన్

      బులక లిడుచున్ బూర్ణానందము

      పొంగు లిడ జేరేనుగా

      కలసి నడిచెన్ గంగగను వే-

      గమ్ము సాగరము జేరన్

      తొలగు గాదా దురితము లెల్లన్

      దోయముల స్నాన మాడన్'
  sadratnamAla:
  - text: 'జ్ఞానోపార్జన జగతి జాలు, ధనముల్,

      సద్రత్నమాలల్ వృథా,

      సానందమ్ముగ సతత మిత్తు పదముల్

      సత్పద్యమాలల్ హరీ,

      యీ నా మానస మిరవు నీకు గుడియై,

      హృన్నాయకా ప్రేమతో

      ప్రాణ మ్మితును, ప్రణయమూర్తి దరి రా,

      ప్రత్యక్ష దైవమ్ముగా'
