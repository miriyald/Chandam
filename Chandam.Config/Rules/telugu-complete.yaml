- name: చిత్రపదము
  identifier: chitrapadamu
  lines: 4
  threshold: 3
  rules:
  - - భ
    - భ
    - గా
  yati: []
  prasa: true
  examples:
  - text: >-
      వారక భాగురుయుగ్మం

      బారఁగఁ జిత్రపదాఖ్యం

      జేరిన వేడ్కఁ గవీంద్రుల్‌

      గోరి నుతింతురు శౌరిన్‌.
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      కూడియు మున్నుగఁదోచిన్

      వాఁడిశరంబున దూయున్

      బోడి నియతునయందున

      లేడియకంపడకుండున్
    author: మహానుభావుడు.
    date: తెలియదు
