- name: స్రగ్విణీ (లక్ష్మీధర , పద్మినీ)
  identifier: sragviNi
  lines: 4
  threshold: 3
  rules:
  - - ర
    - ర
    - ర
    - ర
  yati:
  - - 7
  prasa: true
  examples:
  - text: >-
      దేవకీనందనున్‌ దేవచూడామణిన్‌

      భూవధూవల్లభుం బుండరీకోదరున్‌

      భావనాతీతునిం బల్కఁగా స్రగ్విణీ

      భావ మాద్యంతరేఫంబగున్‌ షడ్యతిన్‌.
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      అండజా ధీశవా హా జగద్ధేహ దో

      ర్దండ చండారినిర్ధారితారీ నతా

      క్షండలా గండరింఖన్మణీ కుండలా

      పుండరీకేక్షణా ప్రోవునన్ సుక్షణా
    author: మహానుభావుడు.
    date: తెలియదు
  ruleType: Name
  padyamType: Vruttam
  padyamSubType: Vruttam
  yatiMode: CharPosition
  language: Telugu
  frequency: Rare
- name: స్వాగతం
  identifier: svaagatavRttamu
  lines: 4
  threshold: 3
  rules:
  - - ర
    - న
    - భ
    - గా
  yati:
  - - 7
  prasa: true
  examples:
  - text: >-
      రాజరాజగుణరాజిత రాజ

      త్తేజ రాజకులదీపవిశిష్టాం

      భోజమిత్ర నృపపూజితపాదాం

      భోజ భూవినుతపుణ్యవరేణ్యా
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      నారదాదిమునినాయక వంద్యున్‌

      శౌరిఁ జేరుఁ డన స్వాగత మొప్పున్‌

      సారమైనయతి షణ్మితి నొందన్‌

      భూరిరేఫనభముల్‌ గగయుక్తిన్‌.
    author: మహానుభావుడు.
    date: తెలియదు
  ruleType: Name
  padyamType: Vruttam
  padyamSubType: Vruttam
  yatiMode: CharPosition
  language: Telugu
  frequency: Rare
- name: క్షమ(క్షప , చంద్రిక-2)
  identifier: kshama
  lines: 4
  threshold: 3
  rules:
  - - న
    - న
    - త
    - త
    - గ
  yati:
  - - 8
  prasa: true
  examples:
  - text: >-
      ఇతఁడు శతసహస్రేడితానీకినీ

      పతి సురపతిసాపత్యభోగుండునున్

      శతవలి యనఁగా శౌర్యనారాయణుం

      డితఁడు హరిచమూహీర మార్యోత్తమా
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      క్షమ నిహపరముల్‌- సాధ్యమౌ నాత్మతే
        జమతి వితతమై- జన్మ లక్ష్యాప్తికై
      సమయముఁ గనఁగన్‌- స్వస్వజీవక్షపా
        సముదయ మెడలున్‌, స్వర్గ మొప్పన్‌ మదిన్‌
    author: మహానుభావుడు.
    date: తెలియదు
  ruleType: Name
  padyamType: Vruttam
  padyamSubType: Vruttam
  yatiMode: CharPosition
  language: Telugu
  frequency: Rare
- name: ఖచరప్లుతము
  identifier: khacharaplutamu
  lines: 4
  threshold: 3
  rules:
  - - న
    - భ
    - భ
    - మ
    - స
    - స
    - వ
  yati:
  - - 12
  prasa: true
  examples:
  - text: >-
      వరద కేశవ దైత్యవిదారీ వారిజనాభ జగన్నిధీ

      కరుణఁ జూడుము మమ్ముఁ బ్రసన్నాకార హరీయని పల్కినన్‌

      వరుసతో సభభంబు మసావల్‌ వాలఁగ రుద్రవిరామ మై

      యరుదుగా మునిపుంగవవర్ణ్యంబై ఖచరప్లుత మొప్పగన్‌.
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      కనకసారససారసరేఖాగ్రస్థితపక్షిచయంబహో

      యనినయట్టులకట్టినరెక్కల్‌వ్యాయతచంచులునాడఁగన్

      కనినమున్నులకన్నులఁబంపాకాండసరోజలమూగఁగా

      దనుజనాయకుఁడాయకఁగొంచున్‌దాటిచనెన్ గగనాధ్వమున్
    author: మహానుభావుడు.
    date: తెలియదు
  ruleType: Name
  padyamType: Vruttam
  padyamSubType: Vruttam
  yatiMode: CharPosition
  language: Telugu
  frequency: Rare
- name: గీతాలంబనము (కలితాంత , కాంత , కాంతి , మోటనకమ్)
  identifier: geetaalaMbanamu
  lines: 4
  threshold: 3
  rules:
  - - త
    - జ
    - జ
    - వ
  yati:
  - - 8
  prasa: true
  examples:
  - text: >-
      నాళీకభవామరనాథు లొగిన్‌

      శ్రీలోలుని గీర్తన సేయ నొగిన్‌

      బోలంగఁ దజావలఁ బొందిన గీ

      తాలంబన మై చను నద్రియతిన్‌.
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      ధారాధరవాహనధైర్యకృతీ

      క్షీరాభ్ధిశిబీశ్వరశీతలరు

      గ్ధారాధరకల్పకకామగవీ

      తారాధిపసన్నిభదాననిధీ
    author: మహానుభావుడు.
    date: తెలియదు
