      నాపాలికి నాఁగాఁ

      బై పై తనుమధ్యన్‌

      బ్రాపించుఁ దయంబుల్‌.
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      గౌరీతనుమధ్యన్

      స్వారింగొని సింహం

      బారాధనలందున్

      క్రూరాగ్రియమయ్యున్
    author: మహానుభావుడు.
    date: తెలియదు
