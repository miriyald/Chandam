  references:
  - https://groups.google.com/forum/#!topic/telugu-unicode/WCB3vugeOPA
  ruleText: <div><b>పద్య లక్షణములు</b>:<ol><li> <span class="gName">4</span> పాదములు ఉండును.</li><li> ప్రాస నియమం <span class="gName">కలదు</span></li><li> ప్రతి పాదమునందు <span class="gName">3</span> వ గణము యొక్క చివరి అక్షరము యతి స్థానము</li><li>ప్రతి పాదమునందు <span class="gName">ఒక సూర్య , రెండు ఇంద్ర , ఒక చంద్ర</span> గణములుండును.</li></ol></div>
- name: అల్పాక్కర
  identifier: alpaakkara
  lines: 4
  threshold: 5
  rules:
  - - Indra
    - Indra
    - Chandra
  yati:
  - - 3
  prasa: true
  examples:
  - text: >-
      మీరిందు శంబరు మెచ్చిచూడ

      నారూఢి నేనొక్క హయము నెక్క

      చూరించి పోవన దుర్గభూమి

      భారంబుగా జొచ్చె నాజి వేగ
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      సుమనఃపతియుగము సోముండును

      నెమకంగఁ బ్రావళ్ళు నిండిమీఱ

      గమనీయవిభవంబుగాంచునెప్డు

      రమణీయ మల్పాక్కరము కృతుల
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      ఒగి నిద్దఱింద్రులు నొకవిధుండు

      జగతీధరుని పదాబ్జములు గొల్తు

      రగణితభక్తి నంచభినుతింప

      నెగడు నల్పాక్కర నియతితోడ.
    author: మహానుభావుడు.
    date: తెలియదు
  ruleType: Type
  padyamType: Jati
  padyamSubType: Akkara
  yatiMode: GPosition
  language: Telugu
  frequency: Rare
  ruleText: <div><b>పద్య లక్షణములు</b>:<ol><li> <span class="gName">4</span> పాదములు ఉండును.</li><li> ప్రాస నియమం <span class="gName">కలదు</span></li><li> ప్రతి పాదమునందు <span class="gName">3</span> వ గణము యొక్క మొదటి అక్షరము యతి స్థానము</li><li>ప్రతి పాదమునందు <span class="gName">రెండు ఇంద్ర , ఒక చంద్ర</span> గణములుండును.</li></ol></div>
- name: మధురాక్కర
  identifier: madhuraakkara
  lines: 4
  threshold: 5
  rules:
  - - Surya
    - Indra
    - Indra
    - Indra
    - Chandra
  yati:
  - - 4
  prasa: true
  examples:
  - text: >-
      రవియు నింద్రులు మువ్వురు రాజొకండును గలసి

      రవిసుధాకర లోచను రాజితాసన సరోజ

      రవికులేశ గొలుతురని ప్రస్తుతింతురు ధరిత్రి

      నవిరళం బగు మధురాక్కరాఖ్యచే సత్కవులు
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      తనర జనకుండు నన్నప్రదాతయును భయత్రాత

      యును ననఁగ నింతులకు మువ్వు రొగిన గురువులు వీర

      లనఘ యుపనేత మఱియు నిరంతరాధ్యాపకుండు

      ననఁగఁ బురుషున కియ్యేవు రనయంబును గురువులు
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      తరణి వాసవ త్రితయంబు ధవళ భానుయుతి నొంద

      నిరతి విశ్రాంతి నాలవనెలవున నింపుమీఱ

      సరసమధురార్ధములఁ జెప్పఁ జను మధురాక్కరంబు

      వరుసఁ బంచగణములను వాలి కృతుల వెలయు
    author: మహానుభావుడు.
    date: తెలియదు
  ruleType: Type
  padyamType: Jati
  padyamSubType: Akkara
  yatiMode: GPosition
  language: Telugu
  frequency: Rare
  references:
  - http://andhramahabharatam.blogspot.in/2005/11/1449.html
  ruleText: <div><b>పద్య లక్షణములు</b>:<ol><li> <span class="gName">4</span> పాదములు ఉండును.</li><li> ప్రాస నియమం <span class="gName">కలదు</span></li><li> ప్రతి పాదమునందు <span class="gName">4</span> వ గణము యొక్క మొదటి అక్షరము యతి స్థానము</li><li>ప్రతి పాదమునందు <span class="gName">ఒక సూర్య , మూడు ఇంద్ర , ఒక చంద్ర</span> గణములుండును.</li></ol></div>
- name: మధ్యాక్కర
  identifier: madhyaakkara
  lines: 4
  threshold: 4
  rules:
  - - Indra
    - Indra
    - Surya
    - Indra
    - Indra
    - Surya
  yati:
  - - 4
  prasa: true
  examples:
  - text: >-
      ఓజతో నిద్దఱింద్రులును నొక్కయాదిత్యుండు మఱియు

      రాజితంబుగ నిద్ద ఱమర రాజులు నొక్కసూర్యుండు

      పూజింతు రత్యంతభక్తిఁ బుండరీకాక్షు ననంతు,

      భ్రాజిల్లు బుధులు మధ్యాక్కరంబు నొప్పారఁ బల్కుదురు.
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      కలదవి నాలుగు మధ్య కరకును చరణము చూడ, 

      నిలుచును నిండగు ప్రాస నియమము చక్కని విధము 

      మొలకేత్తును యెతియు నిచట మొదలుగ నాల్గవగణము 

      చలుపుచు ఇంద్రులుభయులు చండాంశు రెండుమారులిక
    author: మహానుభావుడు.
    date: తెలియదు
    reference: శ్రీ పిరాట్ల వెంకట శివరామకృష్ణ ప్రసాద్ గారిచే విరచితం.
  - text: >-
      మహిళను దూషించువాడు మాన్యుడు జగతిన్ నిజమ్ము

      బహుబంధనములు గల్గించి పట్టిలాగుచునుండు ననుచు

      బహు విధముల వేదికపయి పల్కు ప్రగల్భాలు గాని

      మహినట్టి వాడె భార్యయెడ మసలు నెంతయు వినయమున
    author: మహానుభావుడు.
    date: తెలియదు
  ruleType: Type
  padyamType: Jati
  padyamSubType: Akkara
  yatiMode: GPosition
  language: Telugu
  frequency: Rare
  ruleText: <div><b>పద్య లక్షణములు</b>:<ol><li> <span class="gName">4</span> పాదములు ఉండును.</li><li> ప్రాస నియమం <span class="gName">కలదు</span></li><li> ప్రతి పాదమునందు <span class="gName">4</span> వ గణము యొక్క మొదటి అక్షరము యతి స్థానము</li><li>ప్రతి పాదమునందు <span class="gName">రెండు ఇంద్ర , ఒక సూర్య , రెండు ఇంద్ర , ఒక సూర్య</span> గణములుండును.</li></ol></div>
- name: మహాక్కర
  identifier: mahaaakkara
  lines: 4
  threshold: 5
  rules:
  - - Surya
    - Indra
    - Indra
    - Indra
    - Indra
    - Indra
    - Chandra
  yati:
  - - 5
  prasa: true
  examples:
  - text: >-
      ఆదివార మాదిగ ననుక్రమమున - నన్నివాసరముల నొక్కినుండు

      నాదితేయాధినాథు లేగురు నల - రారంగ నొక్కసుధాకరుండు

      నాది హరిఁ గొల్వ రెండును నాలుగు - నగు వాసరంబున నర్కుఁడైన

      నాదరంబున నెడసొచ్చునని మ - హాక్కరం బలుకుదు రార్యు లెల్ల.
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      వారిజాప్తుండు పంచేంద్రగణములు వనజారియును గూడి వెలయుచుండ

      నారయ రెండవ నాలవచోట్ల నర్కుండయిననుం దనర్చుచుండఁ

      గోరి యవ్వడిపంచమగణమునఁ గూడి మొదల నిలుపంగ నగు

      సారమై ప్రాసవడి సప్తగణములు సాఁగ మహాక్కర యతిశయిల్లు
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      మొదట  సూర్యుండు  పదపగా నింద్రుండు మొదలుగా నేవురు  వరలుచుమ్డ్రు

      మెదల  సూర్యుండు  పిమ్మట నేగురు పురుహుతులదకంగ జంద్రుడొండు

      ముదము తోనెడ సొచ్చు మహాక్కర మొనసి కావ్యములందు  నిడగ కృష్ణ
    author: మహానుభావుడు.
    date: తెలియదు
  ruleType: Type
  padyamType: Jati
  padyamSubType: Akkara
  yatiMode: GPosition
  language: Telugu
  frequency: Rare
  ruleText: <div><b>పద్య లక్షణములు</b>:<ol><li> <span class="gName">4</span> పాదములు ఉండును.</li><li> ప్రాస నియమం <span class="gName">కలదు</span></li><li> ప్రతి పాదమునందు <span class="gName">5</span> వ గణము యొక్క మొదటి అక్షరము యతి స్థానము</li><li>ప్రతి పాదమునందు <span class="gName">ఒక సూర్య ,ఐదు ఇంద్ర , ఒక చంద్ర</span> గణములుండును.</li></ol></div>
- name: ద్విపద
  identifier: dvipada
  lines: 2
  threshold: 4
  rules:
  - - Indra
    - Indra
    - Indra
    - Surya
  yati:
  - - 3
  prasa: true
  examples:
  - text: >-
      శ్రీకామినీనాధుజితదైత్యనాధు

      లోకరక్షణకృత్యులోకైకనిత్యు
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      నడురాత్రి యరుదెంచెనరలోకనాధ

      కడుడస్సినాడవుకనుమోడ్తుగాక
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      ఇంద్ర గణములు మూఁ డిన గణంబొకటి

      చంద్రాస్య ! ద్విపదకుఁ జను చెప్పరేచ
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      ద్విపదకు ద్విపదకుఁ దెగ జెప్పవలయు

      నెపుడు సంస్కృతమున నితర భాషలను
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      యతుల లోపలఁ బ్రాసయతి దక్క సకల

      యతులు చెల్లును బ్రయో గాతి సారమున
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      ద్విపద తో ద్విపద సంధిల నేకశబ్ద

      మపుడు రెంటను గూర్ప నది యయుక్తంబు
    author: మహానుభావుడు.
    date: తెలియదు
  ruleType: Type
  padyamType: Jati
  padyamSubType: Divpada
  yatiMode: GPosition
  language: Telugu
  frequency: Rare
  ruleText: <div><b>పద్య లక్షణములు</b>:<ol><li> <span class="gName">2</span> పాదములు ఉండును.</li><li> ప్రాస నియమం <span class="gName">కలదు</span></li><li> ప్రతి పాదమునందు <span class="gName">3</span> వ గణము యొక్క మొదటి అక్షరము యతి స్థానము</li><li>ప్రతి పాదమునందు <span class="gName">మూడు ఇంద్ర , ఒక సూర్య</span> గణములుండును.</li></ol></div>
