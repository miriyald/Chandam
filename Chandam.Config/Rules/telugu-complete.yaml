  examples:
  - text: >-
      శ్రీ రామ! జయరామ!

      ధీరాత్మ! నీ ప్రేమ	

      ధారాళముగ గొన్న ధన్య సీత!

      కారుణ్యమును జూపి

      నీరూప మును జూపి

      కోరిన ముక్తిని కొలుపుమయ్య!
    author: మహానుభావుడు.
    date: తెలియదు
  - text: >-
      మెఱియంగ నిద్దఱి

      ద్దఱు సురేంద్రులు మూఁడు

      తెఱెఁగులన్‌ శశిఁగూడ నర్థంబులన్‌

      నెఱిఁ గ్రాలఁగా వళ్ళు

      దొఱఁగ షట్పదరీతి

      వఱలుఁ జక్రిపదాబ్జ వర్ణనంబు.
    author: మహానుభావుడు.
    date: తెలియదు
