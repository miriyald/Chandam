      గుమ్మడేడే గోపదేవీ

      గుమ్మడేడే కన్నతల్లీ

      గుమ్మడిని పొడచూపగదవే - అమ్మ గోపెమ్మా

      గుమ్మడేడే గోపదేవీ

      గుమ్మడేడే కన్నతల్లీ

