identifier: topella-examples
name: అనంతచ్చంధము ఉదాహరణలు
description: 'వేగరాజు శ్రీరామ్ రచనల నుండి సేకరించిన అనంత ఛందస్సు ఉదాహరణలు'
examples:
  Chaaya:
  - text: |-
      శ్రీనివాస మూర్తీ !జీవాత్మన్ తెరగ చెలువమ్మై వెల్గు విశ్వాత్మవై
      భూనివాస కీర్తీ !పుష్పాలంకృత విబుధ గీతిన్ నిల్చు వేదాత్మవై
      నేను నేననార్తిన్ నిశ్వాసమ్ముల యునికి లెక్కన్ నిల్పు జీవమ్ములన్
      పూని పూతవై సంపూర్ణమ్మై యడరు పురుషార్ధమ్మేలికౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #402'
  Chaayaa-1:
  - text: |-
      సశాస్త్రీయమ్మౌ వైదిక విధుల సంజాతమ్ములై భక్తి నిం
      పు శేషాద్రుల్ విశ్వాలయ శిఖరమున్ పుణ్యార్ధ జిష్ణాత్మవై
      నిశీధుల్ పారద్రోలు కిరణములన్ నీరాజనారాధ్యమున్
      సుశీలాత్మా !కైవల్యమిడు బ్రతుకున్ సోహమ్మువౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #366'
  Chaayaa-2:
  - text: |-
      సదాచారమ్ముల్ బాసటగ నెలవౌ జన్మ విలాసమ్ములన్
      సదాగారమ్ముల్ తోడుగ చెలువమై సద్విషయా గ్రాహ్యమౌ
      చిదాకాశమ్మౌ విశ్వ సిరిధరుడా !జీవన ఘాతమ్ములున్
      నిదానించున్ నీచెంతన భసితమై నిల్చు ప్రభౌ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #367'
  Chalitaka-padaM:
  - text: |-
      కంకాళ తొడుగుల చుక్కగ తోలున్
      కైంకర్య ఘడియలనాగని జీవిన్
      ఘీంకార వెతల వడిన్ కిలుమౌ కా
      ర్యాకారణ సుకృతమీయర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #356'
    notes: yati/prasa relaxed, score=100%
  DiMDima:
  - text: |-
      అచంచల దయామయ సుమహార గీతమా
      ప్రచండ నిలయామలయ నివాస భూతమా
      రచించని సువేదమున విరాజమానమౌ
      రుచించు పథమున్ మధువన రూప శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #11'
  Rkshapaada:
  - text: |-
      అణువంత చోటు ప్రయాగ తీరమౌ భూ
      ఋణమై విరాజిలు లోక మేటికైనన్ 
      రణమందు తా బెదరన్ నరుండేడ్వ ని
      ర్గుణ విశ్వరూపము కొంత చూపు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #222'
    notes: yati/prasa relaxed, score=96%
  SObhaa:
  - text: |-
      అసాధ్యమ్మున్ సత్సాహసముగ నెలవై హైందవాద్యుండవై
      సుసాధ్యమ్మౌ పెన్ పాశుపత శరమువై శూర ధీరమ్మువై
      వసంతమ్మై లోకోత్పల హరితమువై వాసుదేవుండవై
      ప్రసాదమ్మై భక్తిన్ రసమయపదమై రమ్యమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #202'
  SRMgaaramu:
  - text: |-
      ఎగువ వైకుంఠ విలాసమ్మున్ హిత పరిజనుల విహిత సతి తోడై
      దిగువ లోకమ్ము నివాసమ్మున్ తిరుమలగిరి నృపతి  హృదయ దీపా !  
      తెగువ నీయంగ ధరిత్రిన్ శక్తిగ నిలుచుచు దశ దిశల వెలుంగన్ 
      మిగుల చింతల్ హరియించన్ నీ మిడుకు పదముల శమితమగు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #510'
  SRti:
  - text: |-
      ఆందోళనార్తిని హరివై బలమ్మై
      సందేహ మాలను శరణమ్ము నీవై
      ఛందః పదమ్ముల చలనస్థిరంబుల్  
      మందాకినీ తటి మనకంద శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #162'
    notes: yati/prasa relaxed, score=100%
  SaMbaraM:
  - text: |-
      అఖిల దైవిక యజ్ఞ సుధర్ముడా !సురల యక్షుల యాగ విరించివై
      నిఖిల లోక వినీల సనాతనా !నికర జీవుల నిల్చు ప్రకాశమై
      సుఖద పాత వసుంధర లోకమున్ మెరయు శ్రీనిధి ! సొంపుగ శిల్పమున్
      సఖిత రూపున సాక్షిగ మూర్తివై !గనుమ సత్య సుజాలక శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #410'
  SaMbaradhaaree:
  - text: |-
      నారద సంకీర్తనమై సా
      కార వియోగమ్ముల భక్తిన్
      తారక నారాయణ మంత్ర
      మ్మై రవళించున్ భువి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #22'
  SaMkara-1:
  - text: |-
      కత్తుల రణమౌ వెతల వికార జగానన్
      నెత్తుటి శిలనై దుడుకుల నేర తలానన్ 
      కుత్తుక చెర హారముగ సకోప గళానన్ 
      చిత్తమున నివాసిగ నిలు శ్రీకర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #196'
    notes: yati/prasa relaxed, score=96%
  SaMpaa:
  - text: |-
      వైషమ్యముల యుగానన్ వైష్ణోద్దీపా ! 
      భూషించు గుణములన్ సంభూతమ్మై సం
      తోషమ్ములనిడుమా !సద్యోమోక్షమ్మున్
      పోషించు తిరుమలన్ సంపూర్ణా !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #328'
  SaSikaaMtaa:
  - text: |-
      అనర్ధములర్ధమునర్ధయుతమ్మౌ యాతన గలుగన్ దగు సాయములార్తిన్
      ఘనార్ధ వివర్ధన  సార్ధకమౌ సంఘాతముల పరాజితుడన్ చిరు యొంటన్
      ధనార్జనలర్ధమనర్ధపు జీవిన్ దారుణ గతులన్ నిజ లాలస జన్మన్
      జనార్ధనుడా !కనరా !శరణార్దిన్ !సాకుము దయతో కరుణాకర!  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #580'
  SaSikaree:
  - text: |-
      అణువున్ పెను మహీధరన్ 
      గుణమున్ లభస లాలసన్
      రుణమున్ జనన చక్రమున్
      మణివై పొలయు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #237'
  Saardoola-2:
  - text: |-
      కోపమ్ముల్ జలపాతముల్ పుడమిపై క్షోభలన్ వేధించున్ 
      తాపమ్ముల్ వనవాసమౌ కొలువులన్ దగ్గు సంతాపమ్ముల్
      పాపమ్ముల్ బెనుగాడ్పులై వసతులన్ వ్రయ్యలౌ లీలా ! చి
      ద్రూపమ్మున్ వరదాయి వీవట విరాడ్రూప ధారీ!  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #528'
  Saardoolamu:
  - text: |-
      రుద్రాక్షన్ హరి గళసీమన నిలు రుగ్మతాంతమ్మున్ పెన్
      నిద్రాణమ్ముల జన మెల్కొలుపును నిత్య సంధ్యాక్రాంతిన్
      ముద్రాధారణుల మురారి ప్రతిని మోక్ష మత్తేభమ్మున్
      భద్రా !వేంకటగిరి సాంబుడ గను భాగ్యధాతా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #625'
  SaardoolavikreeDitamu:
  - text: |-
      రాద్ధాంతమ్మగు పుట్టుకల్ విలయమున్ లాలిత్య రాహిత్యమున్
      సిద్ధాంతమ్ముల వేద మార్గమున నిశ్చేష్టుండనౌ నిల్పులన్
      యుద్ధాంతమ్మున నిల్చు భీష్మునిగ సాయుజ్యమ్ము నర్ధించుచున్
      శుద్ధజ్ఞానములన్ నియోగ పథమున్ సూర్యుండనౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #201'
  SaataSara:
  - text: |-
      ఎక్కని గిరులనెక్కెడు పథమ్మెంచు సంకటహారుడా!
      దక్కని సిరుల చిక్కెడు నౌ మేథన్  కుదించుమ శ్రీవరా !
      మ్రొక్కుల ఫల విజేతయనునామోదమందగ భూధరా !
      చిక్కుల కథను దిక్కుగ విరాజిల్లు వెన్నుడ !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #198'
    notes: yati/prasa relaxed, score=96%
  Saephaavalee:
  - text: |-
      ప్రకోపమ్ముల్ త్రెంచన్ రా శ్రీనాధా
      వికారమ్ముల్ ముంచన్ వేదాంతమ్మై
      వికాసంబీయంగన్ విశ్వాకారా
      ప్రకాశమ్మై ప్రాపై రావా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #156'
  SakuMtalaa:
  - text: |-
      చరాచరమ్ముల్ జన్మ విలాసభంగిన్
      జరామయమ్ముల్ సర్వ నిధాన హేలన్
      ధరిత్రి జీవాధారమువై జగమ్మై
      నరోత్తమా వెన్నంటియె యుండు శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #351'
  SalabhalOlaa:
  - text: |-
      ఉపేక్షించకన్ కర్మ యుద్ధ వ్యసనమ్ముల్
      నిపాతమ్ములై క్రమ్ము నిర్ధయ జగమ్మున్
      కపోతమ్మునై శాంతి కారకుని చెంతన్
      తపోధారినై చేరు దారినిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #89'
    notes: yati/prasa relaxed, score=100%
  SarabhooriNee:
  - text: |-
      సారభూతమువై చరాచర లోక జాలము నేలు విష్ణు విహంగమై నిల్పున్
      కారణాకరణమ్ములన్ నివసించు గాఢతలన్ నివాసిత వాసపుం గెల్పున్
      పారమార్ధమువై పరాత్పర తేజ !  పావన వైదికమ్ముగ పుణ్య తీర్ధమ్మున్
      చేరువౌ గతిచూపుమా జగదీశ !  శ్రీధర !  దాస్య సీమలనిల్పరా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #310'
  SarakaaMDaprakaaMDaM:
  - text: |-
      తలనీలాల మ్రొక్కు జన మోహమాత్సర్యముల్ త్రెంచు ఘన్ శస్త్రమై
      కలి మానాభిమాన యుగ మాయలన్ గాడ్పులన్ వార్చు సవ్యాస్త్రమై
      నిలుచున్ బాధలన్ దునిమి భాగ్యముల్ నిశ్చలానందముల్ పొంగు గో
      కులమౌ వేంకటాద్రి హరి కోవెలన్ కూర్మి సంప్రాప్తమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #393'
  Sarakalpaa:
  - text: |-
      అడిగిన వరముల దాహములను దీర్చన్
      నడవడిచెడు నర దానవులను గూల్చన్
      వడిదుడుకుల పథమున్ వరదుడవై పు
      త్తడి కొలువున నెలవై దయనిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #16'
  Saramaala:
  - text: |-
      వేతన వృత్తుల భీతి లయమ్మగు యుగమాయన్
      చేతన చిత్ర విచిత్ర పథమ్ముల గమనమ్ముల్
      పూతములైన విభూతులు బంచు తిరుమలేశా
      ఘాతుక రోధక కార్యములన్ జయమిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #582'
  Saramaeyaa:
  - text: |-
      శరణార్దిన్ జగతి నాటక సీమన్
      కరుణాత్మా కలిమి నీదు పదమ్మౌ
      ధరణీశా దయనిడంగ హరీ !రా !
      వరమీవై పరమపావన శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #217'
    notes: yati/prasa relaxed, score=100%
  SarareeDhaa:
  - text: |-
      తదియను దాటెడు గంటల్
      విదియను దాటని గుండెల్
      ముదిమిని వీడని బుద్దుల్
      కుదురుల నీయుమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #169'
  Seelaa:
  - text: |-
      వర జల్లులన్ !సంప్రాప్తమ్మున్ విలాసమై
      ధర మాధవా !యాతాయాతమ్ము నాస్త్రమై
      చెర త్రెంచరా ! సచ్చింతన్ కారణాత్మవై  
      తిరు సుందరా సందీప్తమ్మీయు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #306'
  SiSu:
  - text: |-
      జీవాత్మల మధ్య తళుకై చిరు చిద్విలాసా ! 
      సావాసములన్ చలపతీ !  జనవాస శ్రీశా ! 
      కైవారములౌ పద సిరుల్ కరుణాలవాలా
      దావానలమై నిడుములన్ దునుమాడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #35'
    notes: yati/prasa relaxed, score=100%
  SikhaMDivirutamu:
  - text: |-
      సరోజ నయనా సంచార భూ తేజమా !
      విరాగ కళుకున్ వేదాద్రి పెన్భూతమా !
      పరాకు విడుమా !పాశమ్ములౌ దర్శనల్
      విరాజిత లయన్ వీక్షించుమా !శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #289'
  SileemukhOjjRMbhitaM:
  - text: |-
      ఆనందాతిశయమ్మునింపు రమణ !అనంతుడా ! ధారణా
      త్మానందాద్రి మహీద్ర సీమన నిలు మనోహరా !నిత్య వే
      దానందానిలయంబు నేలు పరమ దయాళువౌ !శ్రీనివా
      సా !నందంబగు నీదు దర్శన కృప సరాగమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #363'
  SraddharaaMtaa:
  - text: |-
      శ్రీనిథీ భూనిథీ చిద్విలాసా గిరీశా
      వైనతేయున్ విభో వైష్ణవాత్మా సిరీశా
      దీన లోకార్తివౌ తీర్ధ వైకుంఠ వాసా !
      కానరావా !నిరాకారుడా !విశ్వ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #99'
  SraeyOmaala:
  - text: |-
      అర్ధమ్ముల్ సౌఖ్యార్ధమ్ములన్ కలనార్ధ భా
      వార్ధమ్మున్ సావాసమ్ములన్ కదనార్ధ భూ
      వ్యర్ధమ్మున్ నవ్యార్ధమ్ములన్ కలితార్ధ జీ
      వార్ధమ్మున్ దివ్యార్ధమ్మువై నిలు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #302'
  Sreekara:
  - text: |-
      బలిమిన్ నియోగయోగ పారమార్ధమున్
      కలిమిన్ విశేష పోషకార్ధ కర్మలన్
      కొలువున్ సశేష భక్తి గోపురమ్ములన్
      నెలవౌ నిధాన ధారణీవు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #304'
  Sreemaataa:
  - text: |-
      దుర్మదమున్ మదోన్మత్తతతో చిర జీవన శూన్యమ్మున్
      దుర్ముఖ హేల తాళింపుల తోడుత భూమిని దీనుండన్
      ధర్మ నిరక్ష రాస్యుండను దాస్యతనీయర శ్రీనాథా
      ధార్మిక మార్గమున్ నిల్పర ధర్ముడ చక్రధరా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #623'
  Sreepada:
  - text: |-
      ధరునివై తారక విశ్వ హరీ!  గా  
      చు రమణా సొంపుగ సప్త గిరీశా !
      హరుడివౌ హవ్యవహుండ విహారీ
      వరములన్ పంచు శుభంకర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #343'
  Sreeyamunaa:
  - text: |-
      భావన భాగ్యమ్మువై దివ్యాంతరాత్మా
      దీవన యోగమ్ము తీర్ధమ్ముల్ ఫలార్ధ
      మ్మౌ వరసాయంపు మాహాత్యమ్ములీయన్
      గావర వేదాత్మ కౌసల్యాత్మ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #367'
  Subhataa:
  - text: |-
      సర్పమ్ముల్ కర్మలౌ భూషణమగు విషమున్ చరితార్ధమువై కం
      దర్పమ్మున్ వేల్పువై చిత్తముల వెలుగువై తరళమ్మునిడన్ సం
      కార్పణ్యమ్మున్ మరోశోకమునడరు భువిన్ కలకందని జీవిన్
      నేర్పౌ నారాయణా !పూనిత యుగముల మౌనిగ నిల్పర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #654'
  SuddhaaMtaM:
  - text: |-
      మమతల నిలయమ వేదాద్రీశా
      కమత శతముల కథన్ విశ్వాత్మా
      శమనుడ పరవశుడా !శేషాద్రీ
      శ మనుగడ గను వరాత్మా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #359'
    notes: yati/prasa relaxed, score=100%
  SuddhaviraaTi:
  - text: |-
      శేషాద్రిన్ నవ జీవ సారమై
      శోషమ్ముల్ విడి శోభచిందు ని
      ర్దోషమ్ముల్ వర తోరణమ్ము లై
      భూషించున్ హరి భూతి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #46'
  SvaetamaNimaalaa:
  - text: |-
      నైజముల లెక్కన్ నైరాశ్యపు లోయన్
      యోజనము దవ్వున్ యోగమ్ముగ దైవ
      మ్మై జనుల చెంతన్ మాహేశ సరూపా
      రాజసములన్  వైరాగ్యమ్మిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #374'
  aMbudaavaLee:
  - text: |-
      సరళీకృతమ్మౌ చలనాచలమ్ములన్
      కరుణాశ్రితమ్మౌ కమనీయ వాసమున్
      వరదోభవమ్మౌ పరమేశ్వరాత్మవౌ
      శరణాగతుల్ పోషణనివ్వు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #153'
  aMbuja:
  - text: |-
      వేదన కతంబునను ప్రాపిత దుగ్ధన్
      కాదను మనస్సు గల శోక వనమ్మై
      రాదను మహత్తులకు లాలస పోటున్
      మేదిని నివాస నిలు నెమ్మిగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #124'
  aMgana:
  - text: |-
      సంచిత కర్మము జాలమునొప్పుచు సాధన యంత్రమ్మున్
      కంచెగ తిర్మల గారడి చూపుచు కారణ తీర్ధమ్మున్
      మించుక పుణ్యము మెల్లగ నీయర మెప్పుల దైవమ్మై
      చంచల లోకపు చందన మూర్తిగ సాధ్యమువౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #622'
  aMtarvikaasa-vaasaka@h:
  - text: |-
      ఐరావతమ్మునై గజేంద్ర మోక్షమున్
      జీరాడు దేహ జీవయంత్ర వారధిన్
      వారాణసీ శుభాంగ శైవ గీతికన్
      ధారాళ పద్య తత్వమైతి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #259'
  aSOkakusuma-maMjari:
  - text: |-
      సమూల విశ్వ మేలు వేంకటేశ !సర్వ లోక జీవరాశినాత్మవై
      సమాన రీతులన్ దయాసముద్ర !చంచలమ్ములౌ హృదిన్ విరాజమై
      సమిష్టి మాయ త్రెంచు వేంకటాద్రి సద్మముల్ విశేష విష్ణు వాసమై
      సమగ్ర కల్పనావికల్ప క్షేత్ర సారమై విరాజితుండ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #396'
  aSOkalOka@h:
  - text: |-
      ఉత్పాతమ్ముల్ కల్లోలమ్మౌ కాలమ్ముల్ నిల్పున్ యుక్తి నీయరా భూధారీ
      సత్పూజల్ సంస్కారమ్ముల్ సందేహమ్మౌ రీతిన్ సాధ్యమై ఫలమ్మౌ చక్రీ
      తత్పూర్వమ్ముల్ శూన్యమ్మౌ జీవమ్మున్ వాసమ్మున్ తారకమ్మువై సంరక్షౌ
      తత్పాదమ్ముల్ సీమన్ పుష్పమ్మై సంజాతమ్మున్ దాల్చు పుణ్యమీయన్  శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #653'
  aSOkapushpakaM:
  - text: |-
      కుసుమ భరితుడా! కుబేర మిత్రుడా !
      వసుధ మదనుడా !వరమ్మునింద్రుడా !
      భసిత శమనుడా !పరమ్మునీశుడా !
      పసిడి శిఖరమున్ ! పరేశ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #91'
  aaMdOLika:
  - text: |-
      గోవింద నామా! కుశాగ్ర ధర్మా
      గోవర్ధనాత్మా !కుచేలునాత్మా
      దేవేంద్రధీమా !దిగంత శ్యామా !
      భావమ్ములాత్మా !వియోగ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #45'
    notes: yati/prasa relaxed, score=100%
  aadhidaivee:
  - text: |-
      అసాధ్యమ్మున్ పెన్మాయవౌ శ్రీనివాసా !
      సుసాధ్యమ్మున్ రామాస్త్రమై రావణారీ !
      రసమ్మై జీవమ్మై రసోత్పాత వేదీ !
      ప్రసాదాత్మా సాకారమౌ దివ్య శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #386'
    notes: yati/prasa relaxed, score=100%
  aanaMda:
  - text: |-
      హరినామమ్మున్ నిలు జీవమ్మై హరిహర కవల లహరుల స్వరానన్
      ధరణిన్ వైకుంఠ విలాసమ్మై తళుకుల గిరుల సతత సుమదీప్తిన్
      మరలోకమ్ముల్ పలుశోకమ్ముల్ మరగునవడు చిరు మరపు విరక్తిన్
      వరముల్ నందించర విశ్వాత్మా భవన భువనముల వరదుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #400'
  aanaMdaSabda:
  - text: |-
      గోమేధికమ్ముల్ కులికెడు నూపురమ్మున్
      చామంతులై వజ్ర ఖచితమౌచు నొప్పన్
      ధీమంత దీప్తిన్ తిరుమల వేంకటేశా !
      రా !మంగళాకార !వెతను దీర్చ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #420'
  aanaddhaM:
  - text: |-
      ఏడుకొండల తిరుమలేశా !హీరలౌచున్ బో
      రాడు విశ్వ దినకర దీప్తీ !రక్షనిమ్మా !  మా
      గోడు దీర్పగ కలిమి నీయన్ కూర్మి నీవై రా ! 
      వేడుకన్ నిలిచి వరదాయీ !విడ్పువౌ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #545'
  aananamoolaM:
  - text: |-
      జాలము నీదే భువియందున్ జరధారన్
      నేలను జీవాత్మల కోటిన్ నిలువన్ గో
      పాలుడ వేదాద్రి నివాసా పరమాత్మా ! 
      లాలసకీవే వరమున్ మూలము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #125'
  aanataa:
  - text: |-
      సత్యాసత్యములతీత సాధ్యమ్ము విశ్వా
      దిత్యజ్వాల వెలుగై సుదీప్తుల్ జగమ్మున్
      నిత్యానిత్య తరళమ్ము నీ చెంత దక్కున్
      గత్యాగత్య శరణార్తి కారుణ్య శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #441'
  aarabhaTee:
  - text: |-
      అన్నిట నీవట హృదయ విహారి జగన్నాధా
      కన్నుల కాంతుల చెలగెడు కారణ భూతాత్మా
      వెన్నెల హాసుడ మముగను వేంకట నాధా !భూ
      తిన్నెల వాసుడ తిరుమల దీపమువౌ !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #5'
  abhidaatree:
  - text: |-
      జనలౌకిక జీవన వాస్తవాత్మ !  శ్రీనివాసా ! 
       పెనుసాయమువై సుమశోభితుండవై ప్రకాశిం
      చు నిధాన విధాత హరీ! సుఖావహమ్ముదీప్తిన్ 
      వినతుల్ గొనరా గిరులన్ విరాజితాంశ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #577'
  abhiraamaa:
  - text: |-
      కైలాస నటేశ గిరీశా
      ధీలోక విరించి విధాతా
      పైలోకములేలు విజేతా
      మా లోక నివాసుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #38'
  abhraka:
  - text: |-
      వేదాద్రి కొండన ప్రభావిత మూర్తివై
      వేదాంత భేరి విరిశోభిత దీపమై
      వేదామృతమ్ము హరిదీపిక స్థూపమై
      వేదోవిహార కినుకున్ విడు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #94'
  achalapaMkti@h:
  - text: |-
      ఏది గొప్పదను కనువిప్పున్
      నాది నీదను చెనటి వాదాల్ 
      మేదినిన్ కలియుగపు జీవిన్ 
      వేదివై దరిగొనర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #278'
    notes: yati/prasa relaxed, score=100%
  adanijaa:
  - text: |-
      సురోత్తమ !  వేంకటేశ్వరా !
      నరోత్తమ !  లోక నాయకా !
      పరాత్పర !  విశ్వ భూషణా !
      చరాచర కర్త !  శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #227'
  adheerakareeraM:
  - text: |-
      హేరంబాయన గణపతి హీరక నగవున్ మెరయు హితైషివి శ్రీశా
      సారంగమ్ముగ యదుకుల శ్యాముని తళుకై వెలయు జగమ్మువి గంగా
      తారంగమ్ములు శిరమున ధారగ కొలువౌ విలసిత రుద్రుడవై సిం
      గారమ్మున్ తిరుమల గిరి కారణహరివై పొలుచు గభస్తివి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #90'
  aelaa:
  - text: |-
      సహధర్మచారిణిగ సుచరితగ జన్మన్
      విహరించె మాధురి ఘన విజయరథమ్మై
      మొహరించె జీవనవనముల సిరియై నీ
      మహిమన్ వరించి నిలిచె మహితగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #intro-8'
  - text: |-
      కమలాక్షుడా !తిరుమల కనుమల సూరీ
      కమనీయ రాగముల నికర పద గోవిం
      ద మహమ్ములన్ సుగుణ శతములిడు దాసున్
      దమనా వియోగమునిడు తళుకుల శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #691'
  aelaa-2:
  - text: |-
      హరి రూపమున్ మెరయుచు నిలుచు హసిత విలాసా ! 
      పరమార్ధమై తిరుమల గిరుల పరమ నివాసా !
      నర జీవితమ్మును గత వెతలన వగచు జీవిన్
      కరుణాలవాల !గనుమ తరళ గతినిడి శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #453'
  ahi:
  - text: |-
      మానస మందిర గోకుల నందన మాధవ రూపములన్ నీవై
      మౌన ముభావ విలాస నియోగిత మాన్యత శిల్పములన్ నీవై
      మానిని రూపున వేల్పుల బువ్వకు మంథన క్రీడ విమోహమ్మై
      మానన లోకము జేర్చర భక్తి విమానమునుంచి హరీ !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #650'
  ajapaa:
  - text: |-
      ఇలాతలమ్ము రాజిల్ల మహితాత్మగ తిరుమల కొండన్
      తలాతలమ్ము దాటించు హితసారధిగ యదుకులాత్మా
      బలాబలమ్ము నీవై నిలు వరాంగుడ ధరుడ  కృపాపూ
      ర్ణ లాలసల్ నివారించు గుణ ధన్యతల నొసగి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #457'
  ajita-satpriya:
  - text: |-
      పుడమినలరు పుణ్య ఫలదాయకా
      గడుసు నరుల ఘాతముల పాలకా
      సడినెరుగని జాల లత మాలివై
      నడత నొసగు నాధుడవు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #296'
  akhaMDamaMDanaM:
  - text: |-
      గుణాంతరంగ సూరీ కుశాగ్ర బుద్ధులన్
      రుణా ఘనుప్పెనౌ భూ రుతమ్ము రుగ్మతన్
      రణమ్ము తప్పనింటన్ లభించు పాతమున్
      పణమ్ము భక్తియన్ భావనివ్వు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #80'
  aksharaavalee:
  - text: |-
      వేదముల్ నిలువెల్ల మ్రోగు సం
      వేదమై వృషభాద్రి కొండ స
      ప్తాది నిర్ఝరి భక్తి ద్వారమై
      మోదమున్నిడు ముక్తి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #42'
    notes: yati/prasa relaxed, score=100%
  alasagati:
  - text: |-
      ప్రభల గతులన్ మెరయు పాతక జనుండన్
      విభవ తదియల్ మరచు వీసర నరుండన్
      నిభముల లయన్ బ్రతుకు నెట్టు వస పిట్టన్
      శుభద !  వరదా !గనర శోభనిడి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #193'
  anaMgalaekhaa:
  - text: |-
      నిదుర నయినన్ జీవన్ముక్తిన్ ధ్యానించు కర్మానుచిత్తున్
      బెదురు నడతన్ పుణ్యార్ధమ్మున్ శోభించు పాపాంకుశమ్మున్
      కుదురు తలపున్ వేదాద్రీశా నీకొల్వు దాసుండనై కో
      విదుల పథమున్ సాధ్యాసాధ్యమ్మున్ వెల్గు భక్తుండ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #620'
  anilOhaa:
  - text: |-
      ధరణీ ధారుడ !  వైకుంఠ దయాశీలుడ జీవ
      న్మరణార్ధమ్ముల సౌరీ !  విమలాక్షా !విధితాతా! 
      పరమార్ధమ్ముల నీయంగ పరంధాముడవై !రా
      చెరసాలన్ విడు వ్రేపల్లె  చిదానందుడ!  శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #573'
  anuraaga-2:
  - text: |-
      పరమాన్నమై శరమ్మై పరోక్ష మోక్షాధ్వమ్మై  నీ
      చిరు నామమంత్రముల్ రంజితమ్ములై నిల్చ భూమిన్
      నరలోక జీవకోటిన్ నటార్ధ నాట్యమ్ములై సా
      దర ముక్తి సీమ జేర్చున్ తలమ్ము దాటించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #571'
    notes: yati/prasa relaxed, score=96%
  anusaariNi:
  - text: |-
      కలకాలమను పెనాశల్ కలుగ మిగులు నరజన్మల్
      కలికాలమున ధనాశన్ కలిగి చెదిరి చెడిపోవున్ 
      కల గాలమున నరాశల్ కరగక చిరు నివురై యా 
      కలి జాలమున దురాశల్ కలగను నను గను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #257'
  apayOdhaa:
  - text: |-
      కదనంబీ భువిన్ కర్మిష్టుండన్
      చదరంగాన నిశ్శక్తుండన్ ష 
      ట్పదినై పాడ పాటల్ నే నేర్వన్ 
      పదముల్ మ్రొక్కెదన్ భక్తిన్ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #208'
    notes: yati/prasa relaxed, score=95%
  arasaata:
  - text: |-
      కొండలరాయుడ !  కోర్కెలు దీర్చెడి కుందన రాముడ !  భూవన విష్ణువై
      దండల మాటున దాగిన శ్యాముడ తాడన లోక విమోచన సూరివై
      మెండుగ మ్రొక్కుల గైకొను శ్రీశుడ మేలు జగమ్ముల తీర్ధ పరేశమై
      నిండుగ దర్శన మీయర కన్నుల నిత్య చిరాగ్నిగ వెల్గెడు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #411'
  araviMda:
  - text: |-
      కులుకుల రాయుడ వెండి కొండల వేల్పువై
      మెలికల లోకమునిండి మెండుగ దీవనల్
      విలువగు మొక్కులకందు విందుగ భక్తులన్
      కొలుచు విధమ్ముల నిల్చు కూర్మివి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #23'
  araviMda-2:
  - text: |-
      తలపున్ తపనన్ తమసాంతములన్ తపసాంత కడార్ధమువై తరళార్ధమై
      గెలుపున్ గుడులన్ గమనాంతములన్ గిరులన్ గరళమ్ముల వైద్యుడవై గతిన్
      కలుపున్ కధలన్ కధనాంతరమున్ కలిమిన్ కమనీయ కథాచన శ్రీహరీ
      పిలుపున్ పలుకున్ పదమున్ పదునున్ పెదవిన్ పరమాత్మ సరూపుడ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #101'
    notes: yati/prasa relaxed, score=90%
  arbhakamaalaa:
  - text: |-
      అర్భక దేహిన్ పుడమిన జీవించు హరిత దాసుండన్ సుమధారీ
      నిర్భయ భక్తిన్ హరిపథ మాశించు నికర వైరాగ్యమ్ముల గీతిన్
      దర్భగ యాగమ్ములన నివేదించు తళుకు ద్రవ్యమ్మున్ సమిధన్ సం
      దర్భములన్ నెంచని హరి సంగీత తమక వాద్యమ్మున్ గను శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #664'
  arditaM:
  - text: |-
      నేరములెంచక మోక్షము నీయర వేంకట నాధుడ నికర విరక్తిన్
      ఘోర తరమ్మగు కర్మము కూర్పుల భూమిని వ్యాకుల కొలిములనార్పన్  
      పోరుల హోరున భగ్గున పొంగెడు పాప విలాస విపుల చెర వీడన్ 
      చేరగ నిన్ను హరీ !నను చెంతకుతోడ్కొను దేవర సిరి దొర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #530'
  arditapaadaM:
  - text: |-
      పంచభూతముల వసించు వరాత్మా
      కాంచనాద్రి నిలయ మిత్ర ఘనాత్మా
      సంచితమ్మగు గతకర్మ శరాళిన్ 
      త్రెంచునిన్ కొలిచెద దేవర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #212'
    notes: yati/prasa relaxed, score=100%
  arkamareechi:
  - text: |-
      వివశుడనై జనార్ధనుడౌ సిరి పెన్నిధి వెన్నుని విశాల కీర్తి వై
      భవ నృపుడౌ మనోహర రూప శుభాంగ త్రిధాముని ప్రలోభ దాసుడన్
      నవతర కూర్పు నోర్పుల తానున నైక నరాంచల నరార్ధ బిందువున్
      పవన మృదంగమై హరి నీడన బంగరు చేర్పును! భవేశ !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #214'
  arpitamadanaa:
  - text: |-
      అల్లరి శివుడై హరి తిరుకోనల్
      నల్లని శిల వైన మెరుపులన్ రా
      జిల్లుచు వర శేషిగ నిలు నంద
      మ్మల్లెడు ప్రభలన్ మసలును శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #376'
  aruNaSree:
  - text: |-
      బ్రహ్మోత్సవ విహారమ్ము రథముల సందోహమున్ 
      బ్రహ్మాండమున పొంగారు లయ నవ విన్యాసమున్ 
      బ్రహ్మాదుల ముదమ్మై వర తిరుమలన్ వేడుకై
      బ్రహ్మాక్షర నినాదమ్ము రసమయమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #161'
  asaMbaMdhaa:
  - text: |-
      జీవన్ముక్తిన్ వాసిత రుణములు దీర్పున్ 
      జీవాత్మన్ దేహిన్ చిరుత మనుజులార్తిన్
      దేవాంతర్భూతిన్ తిరుమల హరి రూపున్
      నీవై సంధాతా !నిలు కలిమివి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #459'
  ashTamoorti:
  - text: |-
      మెట్టుల్ లెక్కన శతమ్మై మెరయు శేషాచలమ్మున్ మిడుకు వేంకటనాథా
      నెట్టుల్ చక్రమున జీవాన్ని పుడమిన్ జన్మధారన్ నిలుపు బ్రహ్మ విధాతా
      పట్టుల్ గిట్టని యుగమ్మున్ వసుధ లాలింపులన్ పాపరతులౌ నరజన్మల్
      కట్టుల్ త్రెంచ నిలు శ్రీశా !కరుణ సంద్రమ్మువై లౌక్యముల నీయర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #470'
  asitadhaaraa:
  - text: |-
      సవితన్ మరచు సరళమ్మున్
      నవతన్ పరచు నవతంత్రిన్
      భవితన్ మెరయు పరమాత్మన్
      పవితన్ నడపు వర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #27'
  asitadhaaraa-2:
  - text: |-
      అడుగుల వడి యమరొప్పున్
      తడబడు నడతల కొప్పున్
      విడువను హరి పెను గీతిన్
      కడపటి పథి గను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #54'
  asudhaaraa:
  - text: |-
      తొలిభ్రమన్ విడన్ దొరా !వేంకటేశా!
      విలంబితమ్ములౌ వికర్మల్ ప్రయాసల్
      పలాయనమ్ములౌ భవత్సాగరానన్
      జలార్ధ్ర విష్ణుఁడా! జగద్దీప !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #352'
  atilaekha:
  - text: |-
      స్తుతియింతు భాసురతేజ పదముల తల్లిన్
      గతి నిల్పు చక్కని పద్యమునొసగు మాతన్
      శతకమ్మునన్ సరళమ్మునిడు జననిన్ శో
      భిత కావ్యానన్ విధి కాంచన ఖనిని శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #intro-2'
    notes: yati/prasa relaxed, score=96%
  - text: |-
      వరదోభవా !వనవాసముల సుమధారీ
      తిరువీధులన్ దివిసీమలుగ మెరిపించన్
      నరుదెంచి కానని కాంతులనడరు భూమా !
      నరసింహుడా !నరలోక హితమిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #690'
  atiraMha:
  - text: |-
      ప్రలోభములన్ రగిలించు జన్మధారన్
      బలాబల జీవన శాంతి నేలు ఘోషన్
      పలాయనమౌ భవతాపముల్ జగమ్మున్
      కలౌ శరణాగతి నీయరార శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #395'
  aviraLaratikaa:
  - text: |-
      వేద తిరుమలన విశ్వ కంథరా
      నాద గరిమలన నైక భాస్కరా
      మేదిని మసలు సుమేధ సుందరా
      పాద శరణమిడు భవ్య శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #274'
  ayamaanaM:
  - text: |-
      శత జన్మల ధారణ నిల్పుల సారధివై తిరువేంకటనాథా
      వెతలన్ సుడులన్ బలమై నిలు విశ్వ విహారుడ సంకటనాశా
      మితులన్ మితమున్ శరణాగతి మెప్పు నయమ్ముగ దివ్య వరమ్మౌ
      గతులన్ గతమున్ కథ నిల్పుగ కాల మహత్తును చూపర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #680'
  ayanapataaka:
  - text: |-
      పూతాత్మా భువన సర్వాత్మా
      భూతాత్మా నిలయ జీవాత్మా
      ఘాతమ్మౌ పుడమి జీవుండన్
      ధాతా !కావుమ హరీ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #113'
  bOdhaataaraa:
  - text: |-
      యదార్ధమ్మున్ యాత్రా విశేషమ్మై
      పదార్ధమ్మున్ పాత్రావిలాసమ్మై
      సదానందా !సాక్షీ విరాజమ్మున్
      చిదానందా !జీవాత్మవౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #64'
  baMdhaka:
  - text: |-
      మ్రొక్కులు కొలుచు రుక్కుల్ క్రాంతిన్ 
      చిక్కుల దునుము జీవన్ముక్తిన్ 
      దిక్కులకు ఘన తీర్ధమ్మున్ మా
      హక్కుల గను విహారీ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #34'
    notes: yati/prasa relaxed, score=100%
  baalaa:
  - text: |-
      ఆనందలయుడు యాత్రికుడై మానవుడౌ భంగిన్
      సానందుడు రవిశంకరు సంభూత సజాతుండై
      భూనందమలరు పుణ్య మహర్షిన్ తలతున్ ప్రీతిన్
      ధ్యానింతునిపుడు యజ్ఞ శివాంకంపు రవిన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #intro-7'
  - text: |-
      తేజోమయ తిరు తీర్ధపు విశ్వేశ పరంధామా
      రాజీలెరుగని రాజ్యము నందించ వరమ్మై రా
      నైజమ్ము నిలిపి నందము గూర్చన్ పరమోద్దీపా
      వైజాత్యము నిలుపై గనరా! పుష్పధరా శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #694'
  badhiraa-2:
  - text: |-
      భవితవ్యమ్మిక భావయోగమున్ స
      త్య విధానమ్ముల తత్వ సాధనమ్మున్
      నవజీవత్వపు నాణ్యతన్ విరాజి
      ల్లు వరమీయవె లోభనాశ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #219'
    notes: yati/prasa relaxed, score=95%
  bahuLaabhraM:
  - text: |-
      మది కిష్కింధ వనముగా మారగ శ్రీరామా !
      కుదరన్ శ్రద్ధయు హరియౌ గోపాలబాలా!  నా
      రద గానామృత లహరిన్ రంజిలు గోవిందా !
      సదయా ! కొల్చెడు జనవిశ్వాసనిధీ ! శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #553'
    notes: yati/prasa relaxed, score=96%
  balOrjitaa:
  - text: |-
      యుగముల సంహతిన్ హుళక్కి కర్మల్
      సగమగు దేహముల్ చలించు జీవుల్
      ఖగమున నేగు శేఖరా !విముక్తిన్
      సుగమము చేయరా శుభాంగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #342'
  bhOgaavaLee:
  - text: |-
      శ్రీరాగమౌ హరి పద్య మాలికలన్ రుచిర ఘనత రచించితిన్
      నారాయణా !గను కావ్య భావములన్ నదురు కుదురు నిగారమున్
      సారమ్మువై నిలు వేంకటేశ్వరుడా !సతత పథముల విష్ణువై
      నేరమ్ములెంచక కావ్య సంపదలన్ నిలు కృప ప్రభగ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #intro-1'
    notes: yati/prasa relaxed, score=100%
  bhOgaavaLi@h:
  - text: |-
      ఆదిత్యుని తనయుడను లయారంభుని చేతన్
      వేదాంతమునడరు పరమ వేదాంతుని పుత్రున్
      మోదాన నమరు జననికి ముగ్ధత్వ సుతుండన్
      వైదేహ పితృయుగము మది భావింతును శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #intro-4'
  - text: |-
      పద్యమ్ముల వెలుగు కలిమివై భావ చిదాత్మా
      గద్యమ్ముల నిలుచు పద నిగారమ్ముల ధాతా
      విద్యాధరుల గుణముల వివేకమ్ముల నేతా
      సద్యాకృత ఫలములనిడు సత్యాచల శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #693'
  bhOgavilasitamu:
  - text: |-
      కర్మల గిరి వేంకటాద్రియే
      నిర్మల వనమై నిధానమై
      ధర్మ శిఖరమై తపో స్థలౌ
      ధార్మికపుర నేత శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #47'
    notes: yati/prasa relaxed, score=95%
  bhOginee:
  - text: |-
      మనసు గొలుసువై హరీ సమాధానమీవై
      కనుల మెరుపువై సదా ప్రకాశమ్మువై భూ
      కనుమల సిరివై వసించు గారమ్మువై వే
      దనల రయములన్ హరించు ధర్మాత్మ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #88'
  bhaMgi:
  - text: |-
      అల్పుడనై జననమ్ములనస్తమయములను జీవిన్
      నిల్పుల నిప్పుల కొప్పున నల్గెడు నిలయ నరుండన్
      కల్ప వికల్ప విధాతగ వెల్గెడు గరుడ విహారీ
      శిల్పమువై గిరులన్ కొలువై గను సిరిధర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #621'
  bhaajanaSeelaa:
  - text: |-
      కైవల్యపు చింతన్ కాంతివై గానరావా!
      దైవమ్ముగ జీవాధార !శేషాచలేశా !
      నాదమ్ముగ గుండెన్ నందమై నారసింహా
      వేదాంత విలాసీ !భాస్కరోద్దీప శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #424'
    notes: yati/prasa relaxed, score=100%
  bhaasamaana-biMbaM:
  - text: |-
      ఉట్టి కట్టులౌ వియోగ రహిత జన్మ వీడు యోచనలిడరా విహారీ
      గట్టి పట్టునిల్పి గావర హరిదాసుడన్ వికారిత గతులన్ బలమ్మై
      జట్టు గట్టి త్రెంచు సంచిత గత పాపమున్ నిశాచర గమనమ్ములన్ జో
      కొట్టి నెట్టు కర్మ కూర్పుల వరదల్ శమించు కూర్మినిడి విధాత శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #706'
  bhaaskara-vilasitamu:
  - text: |-
      అంబరముల తెరలావల కర్మాహారణల సిరిపతి వెలుగు సీమన్
      కంబముగ నిలిచి ధన్యత పొంగున్ గాంచి మురిసెడు హరిజనుడనైతిన్
      ధంబరముగ ధనుజారి పదమ్ముల్ తాకు ధవళ కడలి కెరట జల్లున్
      సంబరముగ పరమాత్ముని చెంతన్ శాశ్వత గరిమన నిలుపుమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #340'
  bhadrikaa:
  - text: |-
      పంచ భూతముల నాయకా
      మంచు మాయల విధాయకా
      పంచు పుణ్య గుణమున్ ఫల
      మ్మించు దాస్యపథి శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #236'
  bhasalamadaM:
  - text: |-
      అన్యమునెరుగన్ యతోధికానంద సా
      మాన్య మనుజుడన్ మనోవికాసుండనై
      వన్య భసితుడన్ పరాన్నభృక్కున్ భువిన్
      ధన్యుడ హరి పాద దాసునై శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #98'
  bhasalavinOditaa:
  - text: |-
      ఉపద్రవమ్ము నులిమెడి శస్త్రమై
      తపోజగమ్ము దరిగొను మంత్రమై
      జపమ్మునేలు చలపతి నామముల్
      సుపాన రాగ సురటిగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #253'
  bhastraanistaraNaM:
  - text: |-
      ఈశ్వర్మాయగ లోకమ్ము వెలుగు వరదాయి వేంకటేశ్వర పుత్రున్
      విశ్వమ్మౌ హరి నారాయణుని పదములన్ వియోగమందు సుమమ్మున్
      నిశ్వాసమ్మున శేషాచల విభుని ప్రభల్ నివేదనార్తి ప్రదీప్తిన్ 
      విశ్వాధారుని లోకోత్తర కనుమల శోభితాత్మ ధూళిని శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #673'
  bhayaMkara:
  - text: |-
      భవ్యతల నారాయణగిరి శుభమ్మునింపెడు తీరమై
      శ్రావ్యమగు గోవింద ఝరుల సరాగ మేఘ విహంగమై
      నవ్యత గుభాళించు శిఖరి సనాతనమ్ముల తీర్థమై
      దివ్యత ప్రకాశించు హరిమయ దీప్తి పృథ్విని శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #199'
  bheekara:
  - text: |-
      కల్పతరువై జీవకోటుల గమ్య స్థావరమై యశో
      కల్పముగ శేషాద్రి భూమిన కర్మ గోపుర దీపమై
      కల్ప జగమత్తున్ నిశీధి వికల్ప కారణ ధామమై
      కల్పిత విఘాతమ్ము తేర్చు సకాల సద్మము శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #350'
  bheemaabhOga@h:
  - text: |-
      గోదానమ్ముల్ పుణ్యమున్ మించు పుణ్యమ్మున్ గోవిందార్తిన్ నివేదించు భక్తిన్
      భూదానమ్ముల్ సంపదన్ మించు సంప్రాప్తిన్ భూపాలున్ కొల్చు సంకీర్తనార్తిన్
      మైదానమ్మౌ జీవసాహిత్యమున్ సారమ్మై జన్మన్ సాధ్యమౌ ముక్తి యుక్తిన్ 
      నీ దాస్యమ్మౌ సత్య మార్గమ్ము శ్రీనాథా !నిత్యానిత్యమ్ములన్ మించి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #668'
  bheemaavarta@h:
  - text: |-
      పేరాశాలాలసల గలుగు విలయ ఫలమ్ముల్ 
      ఘోరామ్ముల్ పెక్కులు గలుగును కొలువుల మాయన్
      నైరాశ్యమ్ముల్ కలగలుపుల నటనల గీతాల్
      పైరుల్ వెల్గున్ బలముగ హరి వరదుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #583'
  bhinnapadaM:
  - text: |-
      రాముని నామ రసరమ్యతన్
      సోముని దివ్య సమ గీతలన్
      భీముని పట్టు విడు గుట్టులన్
      గోముగ లీల గొను శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #241'
    notes: yati/prasa relaxed, score=100%
  bhoodhara:
  - text: |-
      భాషోద్వేగమ్మున్ కొర్వడుచు జగతి నొవ్వని ప్రశాంతిన్ సురక్తిన్
      రోషమ్మున్ తాపమ్మున్ రుధిర నిలయమౌ రుషితమౌ మంత్రశక్తిన్
      పాషాణమ్మౌ జన్మల్ పరితపముల భావనల దీప్తిన్ విముక్తిన్
      శేషాద్రీశా !రక్షౌ !చెలగు శమనమై జితమువై గాచు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #652'
  bhootilakamu:
  - text: |-
      భూవర వేంకట నారసింహమ పుణ్య ఘోషణ మేఘమై
      శ్రీవర సంకట హారకా నవచేతనాత్మ సరాగమై
      ధీవర సంచిత పాపహారణ దివ్యధారణ కూర్పువై
      గావర జీవన గమ్యమున్ కడ గట్టు మెట్టున శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #360'
  bhujaMga-prayaatamu:
  - text: |-
      గభస్తీ !యజమ్మున్ జగమ్మున్ జ్వలింపన్
      ప్రభాతమ్మువై కర్మ పాపంపు ముంపున్
      శుభమ్మీవు !రక్షించు శోకార్ధ సీమన్ 
      ప్రభో !శ్రీనివాసుండ బంగారు శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #387'
  bhujaMga@h:
  - text: |-
      శివాత్మా సురాత్మా విశేషాత్మ భూతాత్మ పూతాత్మ సంచార నిశ్శేష రూపా
      నవాత్మా జనాత్మా వినాశాత్మ జీవాత్మ దేహాత్మ దివ్యాత్మవై నారసింహా
      ధనాత్మా గుణాత్మా విధాతాత్మ నాదాత్మ వేదాత్మ మోదాత్మ సంతాన సూరీ
      ఘనాత్మా యుగాత్మా ప్రకాశాత్మ రక్షించు సంక్షోభ హారమ్మువై గాచు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #460'
    notes: yati/prasa relaxed, score=100%
  bhujaMgaSiSubhRtaa:
  - text: |-
      వితరణ నెరుగన్ జీవో
      న్నతి నెరుగను దేవేశా 
      నుతుల వినుము భక్తుండన్
      గతులనిడు హరీ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #275'
  bhujaMgaSiSurutamu:
  - text: |-
      అఖిలతలముల వాసా
      నిఖిలజగముల శ్వాసా
      సుఖదము నరహరా నీ
      సఖిత త్రిభువన శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #11'
  biMba-vaMchitaM:
  - text: |-
      శ్రీకారమ్మున్ వెల్గు చలపతి సదా జీవాత్మలాస్యమ్ము వై
      కీకారణ్యమ్మౌ కలియుగ వసతిన్ కేదార రుద్రాత్మవై
      లోకాంతాద్యమ్మున్ పరమహితుడవై లోకేశ్వరా శ్రీధరా!
      సాకారమ్మై వేంకటగిరుల విభన్ సత్యాత్మవౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #361'
  brahmaanaMda:
  - text: |-
      లోపమ్ముల్ నేరమ్ముల్ నిందల్ లోకమ్మౌ భూజాలమ్మున్ లోకాంతర్దానమ్మున్
      శాపమ్ముల్ శోకమ్ముల్ దీవిన్ సారమ్మౌ సంసారమ్మున్ సంస్కారమ్మౌ జన్మన్
      పాపమ్ముల్ పాశమ్ముల్ పెంపున్ భారమ్మౌ జీవార్ధమ్మున్ భాగ్యార్ధమ్మౌ నిల్పున్
      తాపమ్ముల్ తోషమ్ముల్ నీవై దాస్యమ్మున్ లాస్యమ్మున్ వేదాంతమ్మీవౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #656'
  budbhuda-budbuda:
  - text: |-
      నగవుల్ విభూషణములౌ నరోత్తమా !వేంకటేశ్వరా !
      సొగసున్ శతాధిక రవుల్ సుమమ్ములౌ భాస్కరేశ్వరా !
      నిగమాగమమ్ముల సదా నివేద్య నారాయణా !  గిరిన్
      యుగ దైవమై కలిమివై యుగార్ధ సంధాత శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #349'
  budbhudaka:
  - text: |-
      వరదోభవుడ !పరలోకార్తిన్ !వసుం
      ధర కర్మఫల తరుణోపాయమ్ములన్
      చెర కూర్పులన చిరుసాయమ్మై మరో
      జర మిథ్య విడు సరళమ్మౌ  శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #305'
  chaMDee:
  - text: |-
      ఆత్రమ్ములడరు లయమౌ వసుధన్ తో
      డై త్రాడ్వడనిల కడగండ్లు విషమ్మై
      యాత్రాసరితల నియతిన్ గను జీవ
      మ్మై త్రాత !తిరుమల మహేశుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #421'
    notes: yati/prasa relaxed, score=100%
  chaMDee-2:
  - text: |-
      పగటికి సుపరిచయమ్మువు సూరీ
      తెగువల గతినిడు దాతవు శూలీ
      నెగడుల గణితమువై సమవర్తీ
      వగలు విడు వరమువై తిరు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #449'
  chaMchareekaavaLi-chaMchareekaatati:
  - text: |-
      దివ్వెన్ నీ పాదమ్మున్ దీపమై వేంకటేశా
      జువ్వన్ తారాసీమన్ సూక్షమౌ భక్తి రేణున్
      గువ్వన్ వైకుంఠమ్మున్ కోరు మిన్నేటి హంసన్ 
      మువ్వన్ భూ మంజీరమ్మున్ విరిన్ గాచు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #445'
  chaMdrOdyOta:
  - text: |-
      మునుల పరమ ముక్తిన్ భుక్తిన్ ప్రసాదించు భూ
      వన తిరుమల భక్తిన్ శక్తిన్ నివేదించు సా
      ధన పథమున ధారాళమ్మౌ విరక్తిన్ విధిన్
      మనసు నదుము మంత్రమ్మున్ ధన్యుడన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #137'
  chaMdraSaala:
  - text: |-
      విషయ శూన్యతల్ లోపించు మాలిన్య దీనార్ద్రతన్
      విష విహార మాలన్ బేలనై శోష హారమ్ములన్
      మిషలెరుంగ కర్మల్ మేళతాళమ్ములాక్రోశమున్
      కషణ జాతకమ్ముల్ గంగపాలౌ నరున్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #165'
  chaMdraSaekhara:
  - text: |-
      నటనల లోక సారధీ !నివేష్ట నందినీ
      ఘటనల వైద్య వారధీ !సజీవకారిణీ
      పటిమగ సాధ్య మీయవే !వివేక భారతీ!
      చిటికెన నీదు చెంత నిల్పు గెల్పు శ్రీపతీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #8'
    notes: yati/prasa relaxed, score=96%
  chaMdraSree:
  - text: |-
      తపోశక్తిన్ దేదీప్యమగు వరదా సాధికారీ ! 
      జపమ్మున్ సర్వమ్మై వెలిగెడు విశాలాక్ష సౌంద
      ర్య పాదమ్ముల్ సాన్నిధ్యమునిడు లయారంభ సూరీ
      నిపాతమ్మౌ జన్మన్ వెతలు గని నిర్జించు  శౌరీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #587'
  chaMdraa-peeDaM:
  - text: |-
      సందేహమ్ముల్ సంభూతమ్ముల్ సంసారాంతస్సంతాపమ్ముల్
      పందేరమ్ముల్ పంచాంగమ్ముల్ సంప్రాప్తమ్ముల్ సంతోషమ్ముల్
      నిందాస్తోత్రమ్ముల్ సత్పూజల్ పన్నీరుల్ కన్నీళ్ళున్ పొంగున్
      సౌందర్యాహార్యా ! సర్వస్వమ్మై శోభన్ నాకిమ్మో !  శౌరీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #585'
    notes: yati/prasa relaxed, score=100%
  chaMdrabhaanu:
  - text: |-
      చలన చిత్రమౌ మురారి జాలమున్ నివాసినై
      కలత నేస్తమౌ విరించి కావ్యమున్ పదమ్మునై
      తలపు కెంపులౌ విహారి ధ్యానమున్ సుమమ్మునై
      కలిమి తీరమీవనెంచు కారణాత్ము  శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #164'
    notes: yati/prasa relaxed, score=96%
  chaMdrahaasakaraa-raagiNee:
  - text: |-
      కాలచక్ర వలన్ కథన్ చరమాంకమున్
      జాల మంచుతెరన్ శతాబ్దుల చట్రమున్
      గాలమున్ తరముల్ గడించు యుగమ్ములన్
      పాలసంద్ర సుదీప ప్రాపుమ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #124'
  chaMdrakaLa:
  - text: |-
      పాలసంద్రమువీడి భువిన్ సౌభాగ్య విధాయక శౌరివై
      కాల మాయను దాటు గిరుల్ సాకార నివాసుడవై మరో
      జాలమెంచక బ్రోచు విధాతా !సంపదలన్ వరదాయివై
      మేలు గూర్చు పరాత్పరుడా !మమ్మేలు దయామయ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #372'
  chaMdrakaaMta-3:
  - text: |-
      నుగ్గగున్ దేహముల్ నూత్నోత్సాహ నరోత్పథమ్మున్
      సిగ్గు లోపమ్ములన్ సచ్ఛీలమ్ము గడించు రంథిన్
      తగ్గు జీవిన్ రుణమ్ముల్ దాహార్తిని నామ గీతిన్
      నెగ్గు భూలోకమున్ సాన్నిధ్యమ్మును జేరి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #602'
  chaMdrakaaMtaa-1:
  - text: |-
      ఫాలభాగమ్ము సొంపాఱున్ తిరునామమ్ము నిగ్గున్
      మేలు వజ్రమ్ములన్ మింరంగ కిరీటమ్ము వెల్గున్
      కాలచక్రమ్ములన్ ఖండించెడు చక్రాయుధమ్మున్
      దేల ! రక్షించు భూదేవిన్ పరిపాలించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #547'
  chaMdrakaaMtaa-2:
  - text: |-
      దుర్గుణమ్ముల్ సుడిన్ దోగాడున్ జనుల్ భూతలమ్మున్
      వర్గ కల్లోలముల్ వాడిన్ ప్రజ్వరిల్లున్ సగమ్మై
      దుర్గమౌ దేహముల్ దూరమ్మౌ సభక్తిన్ విరక్తిన్
      నిర్గుణా !గమ్యముల్ నీవై కావరా !  శూర !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #548'
  chaMdramaala:
  - text: |-
      నగవుల సిరివై పుష్పాద్రీశా దీనపాలా !వృషాద్రీ
      శ గరుడ గమనా !సంసారమ్మున్ పాశమౌ శ్రీనివాసా!
      వగల సెగల నిల్పున్ తోడౌ లక్ష్మీ వరా !గావుమా !భూ
      మి గణముల గుణమ్ముల్ గండమ్ముల్ నెమ్మికన్ కొల్వు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #428'
  chaMdraraekha:
  - text: |-
      వేంకటాచల గిరిపైన వేద గోపురమ్ము నే
      వేంకటేశ్వర పద చేర్పు ప్రీతి కోరు కొల్వులన్
      వేంకటాద్రి పుర హరిన్ సుభిక్ష రక్ష కోరెదన్
      వేంకటేశ !ధరణి వాస !వేగరమ్ము శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #330'
  chaMdraraekha-2:
  - text: |-
      ఘర్మాంతమ్మున్ తపమ్మున్ కాలమ్మువై కాంచనమ్మై
      కర్మాచారాది  సత్సంస్కారమ్మువై విశ్వకర్మా !
      ధర్మాధర్మమ్ములన్ సాధ్యాసాధ్యమై శ్రీనివాసా!
      శర్మమ్మున్ భూమి నేలున్ సాంతమ్మునున్ గాచు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #541'
  chaMdraraekhaa:
  - text: |-
      తమకముల భూతమ్మునై పాపలోయన్
      గమనమున భూకంపముల్ గండముల్ దా
      ట మలగెడు చోటన్ నివాసమ్ములన్ క్షే
      మమునొసగు రామా !జగన్నాధ !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #123'
  chaMdrikaa:
  - text: |-
      అణువణువున సోహమ్మువై యశోధా
      రణగ నిలుచు నారాయణా !పరమ్మై
      గుణ గుణకములన్ కూర్చి జీవులన్ భీ
      షణ రుణముల లాసమ్ము నిల్పు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #433'
  chaMpakalee:
  - text: |-
      నిధాన విహార నిరామయడా శతా
      వధాన వికల్ప పరాత్పరుడా గతా
      విధాన సుకర్మ వికర్మ లయన్ విశే
      ష ధారణలన్ రసమీవుగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #77'
  chaMpakamaala:
  - text: |-
      కనుమల దివ్వెవై భువి నిగారమువై నిలు శ్రీనివాసుడా
      ఘనమగు వేంకటాద్రి గిరి గారమువౌ సిరి చిద్విలాసుడా
      జనగణ వేల్పువై జగతి సారమువౌ మురిపాల రాయుడా
      మనుగడ నీడవై నిలిచి మారని గీతను మార్చు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #10'
  chaMpakamaali:
  - text: |-
      లంగరు నౌకల్ భారపు జన్మల్
      భంగురమౌ దీనత్వపు గాడ్పున్
      బంగరు చేర్పౌ నీ పరమార్తిన్
      రంగజమౌ జీవార్ధము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #185'
  chaMpakamaalikaa:
  - text: |-
      కనగ పద్మావతి ప్రియుండు వెల్గు కదంబ పురాణ ప్రేమ పా
      వన ప్రియత్వమ్ము విభలన్ చెలంగు పరాంగవ లీల ఘట్టముల్
      ఘన వివాహమ్ముగ ప్రసిద్ధమై సుఖమై కమనీయ వేడుకై
      కనులకింపౌ మనువు జన్మసార్ధకతన్నిడు సత్య శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #383'
  chaarvaTakaM:
  - text: |-
      ఏమివ్వన్! నిర్గుణ హేతువువై,  సాంతమ్మున్ నీవై
      స్వామీ పొంగారగ !సారధివై లోకారాధ్యా !  స
      న్నామమ్మె దక్కెడు నందముగా నిండగా కృష్ణా  !
      మీమాంసన్ దేల్చితి మెప్పుగ వైరాగ్యమ్మున్ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #537'
    notes: yati/prasa relaxed, score=92%
  chalaa:
  - text: |-
      సిద్ధిన్ సాకారముగ వెలసి పుణ్య సాధన శక్తివై
      వృద్ధిన్ శ్రీకారముగ నిలు కృపన్ ప్రభాకర మీవు సం
      మృద్ధిన్ వడ్డించు ఫలమున కృతార్థ దివ్య ప్రమోదమౌ
      బుద్ధిన్ వ్యాపించు హరి వర పురాణ మూర్తివి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #344'
  chamareecharaM:
  - text: |-
      కలత లతల కంచెవై సకల సంకట
      మ్ముల నలతల హారణన్ సుముఖ చక్రివై
      వలుకు వెతల సంహరించు వరధోభవా
      కలిమి నొసగు రక్షవై శిఖర శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #139'
  chitraa-2:
  - text: |-
      ఆపద్ధర్మమ్ముల్ నీ పాటల్ హారమై వేంకటేశా !
      పాపోద్దీపమ్ముల్ బాపన్ లోభార్తి పాశాంకుశమ్మై
      శాపాళిన్ దప్పించంగా సంసార శైలిన్ కరమ్ముల్ 
      తాపాంతమ్మై జీవార్ధమ్మౌ దాస్య సారమ్ము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #540'
  chitralaekhaa-2:
  - text: |-
      శ్రావ్యమ్మౌ కృతుల మెరిసి సాకార నీ నామ సంగీత
      మ్మవ్యాజమ్ముగ హరి పథమై ధీమసమ్మై విరాజిల్లున్
      కావ్యమ్ముల్ కవనముల ప్రశస్తిన్ కథార్ధమ్ములౌ కూర్పున్
      సవ్యేష్ణుండ !కలిమిగ బలమ్మై !  సమస్తమ్మువౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #627'
  chittachiMtaamaNi@h:
  - text: |-
      పంచ భూతమ్ములన్ దివ్వెవై వరుణ గభస్తి నూర్ద్వ్హమ్ము ధాత్రిన్ పరంజ్యోతివై
      పంచ కావ్యమ్ములన్ వేదమై పలుకు పరాత్పరాత్మన్ పరమ్మున్ పయోజమ్మువై
      పంచ క్లేశమ్ములన్ తీగవై పదునుగ జేరు రాగానురక్తిన్ పయోదమ్మువై
      పంచు పుణ్యార్ధ సాఫ్యల్యమున్ వరముగ బ్రోవ మమ్మేలు పుష్పాంబరా !  శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #414'
    notes: yati/prasa relaxed, score=100%
  chootakaMja:
  - text: |-
      జలతారుల్ పుష్పమ్ముల్ తెరన్ సిరివై చందన మూర్తివై చక్రధారీ
      నెలవై వేదాద్రిన్ వేంకటేశ్వరుడా నీరవ చిత్తమున్ నిశ్చలాత్మా
      కొలువై శేషాద్రిన్ వేల్పువై వరముల్ కోర్కెల కల్పనల్ గూర్చు వేదా
      చల మాహేశా !ధారాళమౌ కరుణన్ జన్మల నించు విశ్వాత్మ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #679'
  dOrleelaa:
  - text: |-
      చవిచూచితి నిశ్చలాత్మన్ విశ్వాత్మన్ 
      భవితవ్యము వైభవమ్మున్ భూసూరిన్ 
      నవనాణ్యతలన్ నటార్ధమ్మౌ మాయన్ 
      నవ లోక హరిన్ నరార్ధమ్మున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #393'
  dRDhapaTa:
  - text: |-
      అభినవ మార్గధ్యేయమై భవసాగర మీదన్ 
      ప్రభవలె హోమాంతర్నివేదనలిచ్చెడి జీవుల్
      విభవము ప్రాప్తమ్మై విరాజిల మ్రొక్కుల దీర్చన్ 
      శుభద విముక్తిన్ విష్ణు పాదము జూపుము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #568'
    notes: yati/prasa relaxed, score=100%
  daLa:
  - text: |-
      నిర్ధయ కలిన్ కనికరమ్మునీవై
      మర్ధనలుజేయు మరుజన్మ కర్మన్
      వర్ధనమునిల్పి వరమీయరా మా
      దుర్ధశల మ్రోత తొలగించి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #366'
  daMDikaa:
  - text: |-
      నరేశా నటేశా నరోద్ధార ధారీ నమో వేంకటేశా పురాధీశా
      సురేశా సిరీశా గణేశా గుణేశా శుభాంగా తరంగా సురాధీశా
      పరేశా గిరీశా విరీశా మహేశా పరంధామ నారాయణాద్రీశా
      హరీశా కులాసాల నీయంగ రా సాయమందించ గోపాలువై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #674'
  daMtaalikaa:
  - text: |-
      బీజాక్షరమ్ముల్ విశ్వార్ధముల్ వేదాంతమ్ములేకమ్మై
      పూజాఫలమ్మౌ సప్తాక్షరిన్ పుణ్యాధ్వమ్ముగా జూపన్
      రాజాస్య రాజీవాక్షా సుమంత్రాధీనా దయాసాంద్రా ! 
      రాజిల్లు నీ చింతల్ !  మోక్షమార్గమ్మే చూపుమా !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #556'
  darpamaalaa:
  - text: |-
      ఉదారమ్ములౌ ప్రాయోజితమ్ముల్ సభక్తిన్
      పదార్ధమ్మునై సంప్రాప్తముల్ సన్నగిల్లెన్
      పదాక్షింతలన్ భావాంతరార్ధమ్మువై భూ
      నిదానా !చిదాత్మా !నిల్పువౌ సత్య శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #97'
  deepaarchi:
  - text: |-
      కృష్ణాయన్ పలుకున్ వశించు పరమౌ కృతిన్ తిరుమలేశ నామమై
      తృష్ణాలంకృత దేహ మాలికల భూ కృతమ్ములన జన్మ తీగవై
      విష్ణుర్మోహమనంత విశ్వ రవమై విరాగముల ముక్తి మంత్రమౌ
      జిష్ణుర్నామ సహస్ర మంత్రముగ భాసిలున్ హరి విభమ్ము శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #401'
  deepakaM:
  - text: |-
      నాద నినాదమ్ముల ఘన రాగమ్ముల నేర్పున్
      వేద విధానమ్ముల సవితారంజిత వెల్గున్
      మోద వినోదాత్మల సముచిత్తమ్మగు కూర్పున్
      నీ దయ సంప్రాప్తముగ నిజమ్మై నిలు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #194'
  deepakamaalaa:
  - text: |-
      సాధన సత్యమ్మౌ సనాతనా
      సాధిత నిత్యమ్మున్ జనార్ధనా
      శోధిత మన్నింటన్ సురాగ్నివై
      మేధిర భూతిన్ పెమ్మి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #185'
  dhRshTapadaM:
  - text: |-
      లక్షణ జాలముల లక్షిత నల్వై
      దక్షత జూదముల కల్పన నేర్పున్
      శిక్షిత రాశిఫల జాతక కూర్పున్
      రక్షక సారముగ గావర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #369'
  dhRtahaalaa:
  - text: |-
      జీవాధారా !జగమందారా !
      దేవేంద్రా !వైష్ణవ సింధూరా !
      రావా !నారాయణ భూరూపా !
      దేవా !రక్షించు హరీ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #231'
  dharaNee:
  - text: |-
      చెట్టున్ పరాజితమ్ముల లోయన్
      బెట్టున్ స్వలాభమాలన లోభిన్ 
      పట్టున్ ప్రకో పమున్ నరుడన్ నీ
      జట్టున్ విడన్ సనాతన శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #4'
    notes: yati/prasa relaxed, score=100%
  dharaNeedharagati:
  - text: |-
      సుమధర సిరిధర సుగుణములనిడుమ శుభకర తిరుమల రామా 
      కమలనయనుడ సకల గమనముల నికర పథముగ నిలు శర్వా
      తమక యమకముల తరుణముల నిలు సతత రుణముల విడుపై సా
      రమిక హరి పదముల కుసుమమునగు వరమునిడి దరిగొను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #410'
    notes: yati/prasa relaxed, score=90%
  dharitree:
  - text: |-
      చిరాయువున్ భువిన్ శిలాజమౌ జనుండన్
      పరాన్నభుక్త పాప భూతమున్ నరుండన్
      పరోక్ష శక్తివై పరోపకార ! ప్రాపౌ
      సురక్ష దీపమా !శుభమ్ములీను శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #399'
  dhauraeya:
  - text: |-
      ఒంటరిగా బ్రతికెడు దారుల నాయువు నిలుపు చిర యశో గోపాలా!
      తుంటరి కోర్కెల సుడులన్ వెడలన్ దొలకరి కెరటమ బ్రహ్మోద్దీపా !
      కంటక మార్గమున సుగమ్యము దక్కగ తిరుమల హరివై రుద్రాత్మా !
      వెంట జరించగ గనరా బలమౌ విధి పథమున సుమధారీ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #570'
  dhauraeyaM:
  - text: |-
      అచ్చపు చీకటి బ్రతుకున్ యమజాలముల భూయంత్రమ్మగు జన్మార్ధమ్ముల్
      గిచ్చెడు కర్మల వరదన్ కిటుకుల్ పొలుచు భక్తిన్ జీవన సాఫల్యమ్మౌ
      చెచ్చెర పుట్టెడు గతులన్ జిలుగుల్ నొసగు సచ్ఛీలా ఫలసాయమ్మై దా
      రిచ్చెడు పుణ్యగతుల మేలిమి మార్గమిడు సూరీ !సంకటహారీ !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #490'
  dhavaLakaree:
  - text: |-
      కదలికల నిగారమవై జీవ
      న్మదన దురిత మానవ రీతిన్ నీ
      రదముగ రఘురాముడ !జీవాత్మన్
      కదులు జ్వలిత కాంతుడవై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #346'
  dhavaLakusuma:
  - text: |-
      రవి కిరణమునైక సారముగ వెలయు రూపమున్
      భువి నిలిచిన పైడియై భువన వలస చక్రమున్
      దివుల కెగయు తొందరన్ తెగబడిన నటేశుడన్
      కవిగ తలతు సోదరున్ కలత గడిన శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #intro-7'
  - text: |-
      గడుసు యుగవిలాసమున్ ఘడియల ఘన సవ్వడిన్
      వడిదుడుకుల వాసమున్ పరుగుల గడి నొల్లకన్
      దుడుకు వెతల సంద్రమున్ తొలకరి సుగుణమ్మునై
      విడువక నిజపాదముల్ వెలుగు యతిని శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #163'
  dhoomraalee:
  - text: |-
      హరిద్వారమున్ జేర్చన్ రా వేద
      మ్ము రాజిల్లు వేదాద్రిన్ దీపమ్మై  
      పరా ఘోర శోకమ్ముల్ దూరమ్మౌ
      పరాధీనతన్నీ రక్షన్  శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #276'
    notes: yati/prasa relaxed, score=100%
  dooraavalOka@h:
  - text: |-
      సంగీతమ్మున్ నిగారమ్ముగ సరిగమలన్ సంవేద గోవిందమై
      రంగాజీవమ్ములన్ లోక నికర లయమున్ రాజిల్లు సూరీడువై
      చెంగావిన్ పోలు సౌందర్య తిలక మెరుపుల్ సింధూర శ్రీకాంతులన్
      గంగాంబుల్ పాద్యమౌ వేద నిలయ వసతిన్ కారుణ్యుడా శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #390'
  drutalaMbinee:
  - text: |-
      రుణమున్ కరుణన్ రుచారుచ తేజమై 
      రణమౌ పుడమిన్ లభించు పరాత్పరా
      గుణమున్ నెలవై గుభిల్లను గుండె ధా
      రణలన్ సడివౌ లయాత్మగ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #150'
  drutamukhaM:
  - text: |-
      కలగ కరుగు కలియుగ భువి కారుణ్యమ్మౌ సత్యానివౌ విశ్వా
      నల నిలయ దినకర హరుడ నాదానందమ్ము నేలు గోవిందా !
      కలతల నెలవున తరగని కర్మల్ వారించ రా !పరంధామా !
      బలితల నదిమిన ఘన నిజపాదమ్మున్ జేర్చరా హరీ !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #663'
    notes: yati/prasa relaxed, score=97%
  drutapada-1:
  - text: |-
      ఇనకులోత్తమ జనహిత రామా
      ఘనుడవౌ హరుడ తగరమా ధీ
      వనము నేలెడు మధువన ధామా
      గనుమ వేంకటగిరి ఘనశౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #132'
  drutapadaM:
  - text: |-
      తిరిగిరాని తలకున్ దిశ నిర్ధే
      శ రుణమై నిలు మహేశ గిరీశా !
      తరళ మార్గమున వైదిక మూర్తిన్
      మెరయు దైవముగ నెమ్మిగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #131'
    notes: yati/prasa relaxed, score=100%
  drutavilaMbitamu:
  - text: |-
      కుసుమ ధారల కోమల హారముల్
      పసుపు కుంకుమ పావన ధూపముల్
      ముసురు సేవల ముట్టడి ముంపులన్
      వెసులు బాటు గుభిల్లుగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #15'
  dvaaravahaa:
  - text: |-
      పద్య పద్యాంతార్ధ పరోక్షమ్మై
      గద్య గద్యాంతార్ధ గవాక్షమ్మై
      విద్య వైవిద్యార్ధ విధానమ్మై
      సేద్యమౌ జన్మన్  వశమౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #65'
    notes: yati/prasa relaxed, score=100%
  dyuvaaNinee:
  - text: |-
      విపుల దృశానుడు పద్య విశారదుండు కొల్లా
      రపు రవి నామ విభాకర తేజుడై ప్రవృత్తిన్
      నిపుణుల నిల్పెడు పద్య నివేదనా బుధున్ నే
      జపమున నిల్పెద భక్తి సమృద్ధి తోడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #intro-5'
  - text: |-
      తొలగని కర్మ నియోగ దురాగ్రహమ్ములౌ వై
      దొలగని జన్మ విశోక తులాధరుల్ నరుల్ చం
      చల మతులై నిను జేరు సనాతనాత్మ !నీలా
      చల విభుడా !గనుమా !కుశలమ్ము నిల్పి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #696'
  gaMgOdakaM:
  - text: |-
      ఓర్పు నిట్టూర్పులన్ కర్మ సాఫల్యమున్ యుద్ధమౌ జన్మ గమ్యార్ధ పుణ్యార్ధముల్
      నేర్పు కట్టున్ మనోధర్మ సాహిత్యమున్ నీరసమ్మౌ నరాంతర్య జంజాటమున్
      మార్పు నెట్టున్ పరంధామమౌ తిర్మలన్ మానవాతీత మాహత్యమున్ శౌరివై
      కూర్పు చేర్పున్ పరాధీన రాహిత్యమున్ కోర్కెలన్ దీర్చు విశ్వంభరా! శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #413'
  gaMgaa:
  - text: |-
      క్షేత్రమ్ముల్ జీవుల్ క్షితి దేహమ్ములన్ సు
      క్షత్రీయుల్ కర్మన్ కలి యుద్ధమ్ములన్ గా
      యత్రీ మంత్రమ్మున్ హరి భక్తిన్ ధరించున్
      పాత్రౌచిత్యమ్మున్ వశులై నిల్చు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #411'
  gaNadaehaa-kamalaa.:
  - text: |-
      గణదేహమ్మున్ శ్రీకర సూరీ
      ఋణభారమ్మున్ తీర్చి మురారీ
      ప్రణతుల్ కఃఏకొమ్మా భవహారీ
      మణివై జీవాత్మన్ మను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #207'
    notes: yati/prasa relaxed, score=90%
  gaNanaatha:
  - text: |-
      గోపతి తలమ్ముల్ గోకుల స్వరమ్ముల్
      స్థాపిత వరమ్ముల్ తాపస పథమ్ముల్
      ధీపుర తలంపున్ తిర్మల రవమ్ముల్
      దీపమగు నీదౌ తీర్ధమిది శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #375'
  gaganamaNi:
  - text: |-
      సంపద మాధ్యమ్మున్ నిధివై గోచర శ్రీశువై
      పంపక వాణిజ్యమ్ముల రీతిన్ వరవేల్పువై 
      ముంపగు జాఢ్యాజాఢ్య విభూతిన్ మురిపెమ్మువౌ 
      కెంపుల కీరీటమ్ముల శోభన్ గిరి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #148'
  gajaraaja:
  - text: |-
      నటనల లోక నాయక భూనర సింగమా
      పటిమల శక్తి కారక భూవర సూర్యమా
      కిటుకుల చాటు మాయగ భూగిరి చంద్రమా
      వటువుగ గాచు వామన ధీవర శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #133'
    notes: yati/prasa relaxed, score=100%
  galitanaalaa:
  - text: |-
      విముక్తి శోభితుడవై శౌరీ దయా
      సముద్రమా !చతుర సాక్షీభూతమై
      విమోచనావిధి విధానమ్మున్ విరిం
      చి మూర్తి వై చెలగు భూతిన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #254'
  garuDarutaM:
  - text: |-
      గరుడ విహారుడా !గిరుల కాంచనాద్రిన్ హరీ !
      నరులకుదారుడా !విరుల నారసింగమ్మువై
      ధరణి కుబేరుడా !వర విధాత నారాయణా !
      పరమ విశేషుడా !శిఖర వాసుడా !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #162'
  gataviSOka:
  - text: |-
      ధనముల వలన్ తనరు నరుల్ సా
      ధన విడివడున్ తరుగు శుభమ్ముల్
      మనములన నీ మననము చాలున్
      ఘనమగు భువిన్ గమనము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #362'
  gau:
  - text: |-
      అడుగులపడు కొండలు యాగ రధమ్ములై
      తడబడు పద కీర్తన ధర్మ నియంత్రణౌ
      దుడుకునెగయు గుండెన దుందుభి నాదమై
      బడలిక విడు నిశ్చల భక్తిన శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #136'
  gauree-3:
  - text: |-
      గతములడరు కలతన్ బాటసారిన్
      మతములమరు మరపున్ మాటకారిన్
      వెతల విసురు విరుపున్ విశ్వ ధూళిన్
      మతిని ధరుని మధువున్ నిల్పు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #448'
  gauri-2:
  - text: |-
      పరి పరివిథముపరితల భక్తిన్
      కరి మకరి కధ కలిమి నియుక్తిన్
      విరి తెరల పెనువిరిగ విహారీ
      గరిమల నిజ సుగతి నిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #435'
  geetakaa:
  - text: |-
      కలియుగ కల్లోల్లమ్ములన్ తీగలౌ జన్మ పాశముల్ ముంపున్
      మలి జననమ్ముల్ భీతులన్ సామదానమ్ములన్ విభేదాత్మున్
      నెలకొను భూమిన్ భక్తి రక్తిన్ నిరాటంకమౌ కపోతమ్మున్
      కలవరమాయెన్ రక్షవై రా !కలౌ వేంకటేశ్వరా శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #631'
  giribaala:
  - text: |-
      జగదానందద !వ్రజమిత్రా ! కావర జగమ్మున్
      నిగమానంద !   భువినివాసా వేంకట గిరీంద్రా
      యుగధర్మమ్ము  వెలయు రీతిన్ ధర్మ పథమున్ జూ
      పగ నీవే భయ భవనాశా !  సప్తగిరి శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #574'
  guchchaka:
  - text: |-
      తిరుమల పరాత్పరా తెఱకువగ పుణ్యముల్
      గురుతర శుభమ్ములన్ కుదురు నిలవాసముల్
      దొరికెడు నగమ్ములన్ తొలకరుల వేల్పువై
      వరమిడు నరోత్తమా!  పరిణితిగ, శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #329'
  haMsee:
  - text: |-
      ఉత్తేజమ్మౌ నీ నామమ్ముల్ తిరుమల యుగపురుషుడ శుభదాయీ
      మత్తేభమ్మౌ కర్మల్ వారించ నిలు మమత కనుమల వరదాయీ
      చిత్తమ్మున్ సంజాతమ్మౌ భావపు విలసిత దినకరుడ చిదాత్మా
      క్రొత్తాశల్ గుత్తమ్మౌ జన్మన్ కలయుగ కువల నయన గను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #670'
  haasaasya:
  - text: |-
      అకాల కాల నీహార నిగారమున్
      వికాల కల్ప నిర్వేద సకాలమున్
      సుకీర్తి గీతివౌ సుందర వెన్నుడా
      ముకుందుడా !హరీ !మ్రొక్కెద శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #256'
  hallakamaalika:
  - text: |-
      కలతల లతల చుట్టు కనికట్టు విఘాత భువిన్ పవిత్రమై
      కల వలల తలకెత్తు నరబెట్టు వికార విముక్తి సాధనై  
      కలిత జగతిన వెల్గెడి నిరామయ కాంతుల విష్ణు వాసమై
      కలిన తిరుమల పుణ్య వనమౌ లయకారి తటమ్ము శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #398'
    notes: yati/prasa relaxed, score=100%
  haranartanamu-1:
  - text: |-
      బింకమెంచని శోకమున్ విలయమ్మున్ విశ్వ నిగారమున్
      సంకటమ్మున రక్షవై జనకొల్వున్ చల్లని వేల్పువై
      వేంకటాద్రి నివాసివై విరిదండల్ పెన్ సుమ మాలలన్
      పంకజాక్షుడవౌ గిరిన్ వరదాయీ ! వైద్యుడ !శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #60'
    notes: yati/prasa relaxed, score=100%
  hariNeepada:
  - text: |-
      ఉరగశయనా !విశ్వాత్మన్ మాయోజ్వలమ్ముల శ్రీహరీ
      గరుడగమనా !వేదాద్రిన్ పొంగారు శిల్పమ శ్రీనిధీ
      గిరుల రమణా !శేషాద్రిన్ సాకేతరాముడ శ్రీధరా
      కరుణ వరుణా !సర్వత్రా సాకారమౌ హరి శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #194'
  hariharapriya:
  - text: |-
      వైకుంఠ వాసమున్ వైభవమ్మున్ రమన్
      సాకార రూపమున్ సైకతమ్ముల్ తటిన్
      గోకర్ణ పాన్పులన్ కోరి వర్జించి భూ
      వీకాశ శ్రీగిరిన్ వేల్పువౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #261'
  harileelaa-2:
  - text: |-
      అలవాటుగ భూమిన్ యాత్రల మాయల్
      తెలవారని కర్మల్ తేలని లెక్కల్
      కలికాల యుగమ్మున్ కర్కశ జన్మల్
      కలిమై నిలు విశ్వాకారుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #391'
  hayaleelaaMgee:
  - text: |-
      నిరతము నీ నివేదన ఝరిన్ నివాళిని ప్రభన్ నిలు భక్తుండన్
      భరణిని లాభమున్ విడిచి నిర్భయమ్ముగ ప్రలోభ విరాగుండన్
      చరణములన్ జపించు నరుడన్ సనాతన చరాచర కణ్వమ్మున్
      వర సులభా !భవాండనిలయా !పరాకు విడరా !పరమౌ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #430'
  heeNahaiyaMgaveenaM:
  - text: |-
      దూరమై దీవనల్ దీపముల్ దాస్యముల్ దుర్గముల్ దేవతారాధనల్ దివ్యశక్తుల్
      భారమై బంధముల్ భోజ్యముల్ భూషణల్ భాషణల్ భస్మసంభూతమౌ బాధలన్ సిం
      గారమై గారముల్ గానముల్ గోళమున్ గండముల్ గంధముల్ గండపెండేరముల్ ని
      స్సారమై సారముల్ శాకముల్ శోకముల్ శాంతిరాహిత్యమున్ నిల్చితిన్ బ్రోచు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #370'
  heeyahaasa@h:
  - text: |-
      శ్రీనివాసా హరీ చిద్విలాసా !
      భూనివాసా !సదా మోదమిమ్మా
      దీన రక్షా యశోదీప్త మూర్తీ
      మౌనమున్ వీడు ధీమంత శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #108'
  iMdra:
  - text: |-
      అనాధల దాహ విదేహమ్మున్
      వినాశకమై వెతలాంతమ్మున్
      సనాతనుడా శమనమ్మీవౌ
      మనోహర ధామమ భూ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #31'
  iMdravaMSa-1:
  - text: |-
      వైకుంఠ లోకమ్మున వైభవమ్ములన్
      రాకేందు బింబాధరి లక్ష్మి సన్నిధిన్
      శ్రీకాంతులాసాంతపు చేర్పు వీడి ను
      ర్వీ కాంత సంసారమె వింత శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #6'
  jagachchakshu:
  - text: |-
      భువిని డస్సితిన్ దపించి పూర్వ వేదనల్ ముంచన్
      రవిని మించితిన్ ప్రకోప రాశి బుద్ధి కుచించన్  
      దివిని మీరితిన్ విహార తీరమౌ విలాసమ్మున్
      చివురు ముక్తి నీదు నామచింతనందగన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #569'
    notes: yati/prasa relaxed, score=96%
  jagaddhita:
  - text: |-
      ఒగ్గున్ పరమ హరుడినై యుగమున్ గత విషము మ్రోయు మానవమాత్రున్
      తగ్గున్ నిజపదముల పూతగ నిల్చు హరి జన జాతకుండను దాసున్
      మొగ్గున్ సదన చకితుడన్ మురిపెమ్ముగ భజనలన్ ముగించు నరుండన్
      నిగ్గున్ తిరుమలగిరులన్ నెలవౌ మురహరి సుతున్ నియోగిని శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #500'
  jaladharamaala:
  - text: |-
      అస్థానమ్మీ తలమున హవ్యమై భూ 
      సుస్థానమ్మౌ తిరుమలజొచ్చెన్ !ధర్మా
      వస్థన్మించే ధరుని తపమ్మున్ నిత్యా
      వస్థన్ నిల్పంగ కలిమివై రా! శౌరీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #389'
    notes: yati/prasa relaxed, score=95%
  jalajalOchana:
  - text: |-
      తిరుమల రామా !తిరుమలేశ్వరా !తెరతీయర విశ్వాత్మవై
      నర కుల ధీమా !నరగుణోత్తమా !నడమంత్ర వియోగమ్మువై
      వరముల ధామా !వరగిరోత్తమా !వరధోభవ సాయమ్మువై
      పరమము నీవై !పరమతీరమై !పరమేశ్వరుడౌ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #384'
  jananeemuda:
  - text: |-
      తలతు ఘనతన్ దాతల్ తలిదండ్రులన్ భువిదైవమున్
      మలచిన విధమ్మున్ శ్యామలరూపు నేలుబడిన్ చిదా
      త్మల భరిణయౌ మూర్తిన్ మధురాత్ముడౌ ధర సూర్యుడన్
      నిలుచు శివగౌరుల్ పూనికలన్ పరమ్ముగ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #intro-4'
  jaraa-ushitaa:
  - text: |-
      అనాది విహార సులోచనా
      సనాద విచార విలోచనా 
      సనాతన సత్య జనార్ధనా
      వినూత్న కవీశ్వర శ్రీపతీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #57'
  jayaSree:
  - text: |-
      అద్దమై జన సదన యదు యశోదాత్మజున్
      నిద్దురల్ ముసురు భువి నిఖిల ప్రాకారమున్
      సద్దుసేయు ఘడియల చలన గమ్యమ్ములన్
      పొద్దు వాలెడసువుల పొలుపువౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #156'
  jhilleeleelaa:
  - text: |-
      కలతల భూనైరాశ్యమ్మున్ చింతన్ కాలమాయలన్ నల్లంగన్ 
      నలతల సంధ్యా తర్షమ్మున్ భీతిన్ నారసింహుడా ! మున్గంగన్  
      మెలికల జాన్మాహంకారమ్ముల్ మమ్మేలుచుండగా ! పోద్రోలన్ 
      మెలుకువ దీప్తిన్ మాకీయంగన్ మమ్మేలు వేల్పువై రా! శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #139'
  jhoolana:
  - text: |-
      అజరామర మానస కల్పనలన్ హరివై సుమభూషిత !  శ్రీనివాసా
      విజయోత్సవ సంతస భావనలన్ విరిమబ్బులలో కొలువైన చక్రీ!
      నిజపాదములన్ దలనిల్ప యశోనిధివై కలహారివి !  వేంకటేశా
      గజమోక్షమునిచ్చిన భక్తహితా !గరుడాద్రి విహార !  రమేశ !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #590'
  jhoolanaa:
  - text: |-
      మకరంద కందములన్ నిరామయ పద్య కల్పనలన్ భా
      విక ఛంద బంధములన్ యధావిధినొప్పు భావములన్ భూ
      మికలన్ వివేకి నుదాత్తునిన్ మిళితమ్ములౌ పదమాలన్
      ముకుళించు చేతుల గమ్యమై మొహరించు శ్రీహరి !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #255'
  j~naana:
  - text: |-
      నేనో వరమును నూత్న మనోహర హరిపుత్రున్
      కోనేటి తటిన రాయుని కోమల పదరేణున్
      పానమ్మున రుచిరమ్మగు భాగ్యమలరు గీతిన్ 
      మౌనమ్ము కొఱలు తిర్మల మందరధర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #555'
    notes: yati/prasa relaxed, score=100%
  kOduMbha:
  - text: |-
      తారాంగమ్ముల్ చేతనగ బాల్యమ్మునందున్
      వీరంగమ్మౌ లోభిత కదమ్మున్ ప్రయాసన్
      సారంగమ్మై పోషక పదార్ధమ్ములన్ సం
      చారమ్మున్ దీపించ దిగిరా బ్రహ్మ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #472'
  kOla-1:
  - text: |-
      కబంద వడినిన్ కరుణాలవాలా
      ముభావ గతులన్ మురిపెమ్మువౌ వి
      శ్వ బంధనమువై వర వేంకటేశా
      నిబద్ధత సిరుల్ నిడు దేవ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #354'
  kOmalalataa:
  - text: |-
      వైకుంఠమ్మున్ శ్రీకరమువై వైవిధ్య నారాయణా !
      భూకైలాసమ్మున్ శివుడవై పూజార్చనల్ రుద్రమా  !
      ప్రాకారమ్మున్ వేదసిరివై బంగారు విష్ణాత్మవై
      సాకారమ్మౌ కర్మ వరదన్ చైతన్యమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #169'
  kOmalamu:
  - text: |-
      చంచల తోడుత సాకారా !నీ
      లాంచల కొండను లోకమ్ముల్ పా
      లించు మురారి !పరీక్షిత్తున్ !లా
      లించు సుభక్తిని లిప్తన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #184'
    notes: yati/prasa relaxed, score=100%
  kaLaadhaama:
  - text: |-
      దాటని కర్మల సుతార బంధమ్మున్ తా
      రాటల భూతల విలాస వైవిధ్యమ్మున్
      నాటని పుణ్యపు గుణైక లోపమ్మున్ స
      య్యాటల నిల్పు దరహాస చంద్రా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #127'
    notes: yati/prasa relaxed, score=100%
  kaLaavatee:
  - text: |-
      అలుపుల కందన్ హరి చెంత చేర్పులన్
      తలపున గోవిందను నామ కీర్తనల్
      మలుపుల కొండన్ మధువొల్కు నాదమై
      కొలిచెడి శక్తిన్ కొలువౌచు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #298'
  kaLika:
  - text: |-
      శ్రీధరా !శేషాద్రిన్ శివరూపా
      భూధరా !లక్ష్మీశా !భువనేశా
      మాధవా !సర్వేశా !మము గావన్
      సాధనమ్మై రక్షించర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #26'
  kaMThabhooshaNa:
  - text: |-
      పుట్టంబుట్ట నిల్పౌ భువిన్ మార్గదర్శీ
      చుట్టమ్ముల్ వెతల్ ముంచు సర్పమ్ములై జో
      కొట్టున్ పుణ్య కర్మల్ కుదింపన్ సుఖమ్ముల్
      నట్టేటన్ బడన్ కానరావేమి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #385'
  kaMdarpha:
  - text: |-
      కందర్ప దర్ప వాసుడ కారుణ్య శ్రీనివాసా !
      సందర్భ దర్భ ప్రాయపు సంచార కర్మరీతిన్
      డెందమ్ము నేలు మానస ఢీకోలు వాద్యమీవై
      నందమ్ము గూర్చుమా హరి నారాయణుండ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #84'
  kaMduka:
  - text: |-
      కృపాపూర్ణ తేజుండ కృష్ణాత్మవై రామా!
      జపమ్మున్ జగమ్మై వశమ్మౌ యశోమూర్తీ !
      తపమ్మున్ తలంపున్ జితమ్మౌ చిదానందా!
      నెపమ్ముల్ వినాశమ్మునీయంగ రా !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #96'
  kaMjaavalee:
  - text: |-
      చందన సుమ నవ చర్చిత నిత్య సేవలన్
      వందన జనవన వాసిత జీవకోటులన్
      నందుడ తిరుమల నాయక నీదు భోగముల్
      చిందు భువి హిత విశేష ఫలమ్ము శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #323'
  kaMkaNa-kvaaNavaaNee:
  - text: |-
      ఊహాలోకమ్ములన్ భావమై యుక్తివై సాయమై సాయుధమ్మౌ విరించీ
      మోహోత్తేజమ్ములన్ తీరమై మోక్ష తీర్ధమ్మువౌ రాముడా !వేంకటేశా !
      దాహమ్ముల్ శోకముల్ లోకమౌ ధాత్రి భూషించు వేదాంత రూపా మురారీ
      సోహమ్మున్ నీదు రూపమ్ము సంశోభితమ్మై వృషాద్రీశుడా బ్రోచు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #672'
  kaMkaNakvaaNa@h:
  - text: |-
      అంబరమ్మున్ విహారీ హరీ యాతనాయాతనల్ ఛాయలన్ సంహరించన్
      ధంబరమ్మున్ గిరీశుండవై తారకమ్మై విహారార్ధ వేదాద్రి సీమన్
      సంబరమ్ముల్ విహారమ్ములన్ స్వామివై వేంకటాద్రీశ విశ్వాత్మ వై రా
      శంబరమ్మై మహా మాయలౌ జాలమున్ నిత్య సంకోచముల్ దీర్చ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #676'
  kaThinee:
  - text: |-
      అభయహస్తమున్ యశస్సు ధీరత్వమున్
      శుభద సంపదల్ సురాజగమ్ముల్ ప్రమో
      ద భరితమ్ములౌ దశల్ దిశాబంధముల్
      విభవమై హరీ !విభూషణా శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #299'
  kaaMchee:
  - text: |-
      అంతర్వేదమ్మువై ప్రాణ మితిలన్ యాత్రావిశిష్టాత్ముడా ! 
      చింతాక్రాంతమ్ములౌ దీన గతులన్ జీవన్మదోన్మత్తులన్ 
      భ్రాంతిర్మోహమ్ములన్ మున్గు నరులన్ రక్షింప యోగమ్మువౌ 
      అంతర్యామీ !ముకుందాత్మ !నిలు సాయమ్మై హరీ!  శ్రీపతీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #340'
  kaaMseekamu:
  - text: |-
      కొండల్లో మెరయుచు వేల్పౌ
      దండల్లో కుసుమ వనమ్మై
      నిండారన్ వెలుగుదువే బ్ర
      హ్మాండమ్మౌ తిరుమల శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #114'
  kaaMtOtpeeDaa:
  - text: |-
      విష్ణు పురాణానన్ విరులౌ పుణ్యమ్ముల్
      కృష్ణుని గీతన్ భూకృత సంప్రాప్తమ్ముల్
      తృష్ణల వీకన్ సంకృతియౌ మోక్షమ్మున్
      జిష్ణు ప్రసాదమ్మే సిరినాథా! శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #373'
  kaamaa:
  - text: |-
      ఆరాధనల నిలు రుద్రా
      పారంగతుల శుభముద్రా
      వైరాగ్యమునభయముద్రా
      నారాయణ హరివి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #42'
  kaamaanaMda:
  - text: |-
      గోవిందానందా !శేషాద్రీశా !జన్మల్ సంకోచమ్మౌ దీనావస్థన్ మ్రొక్కుల్ బాటన్ భారమ్మై
      భూవాసమ్మున్ చింతాక్రాంతిన్ నిల్చెన్ !రా !సంభూతమ్మౌ సంతాపమ్ముల్ వైభోగమ్మున్ చెండాడన్
      సావాసమ్మున్ తోడై వేంకట్రాయుండా !సంసారమ్మై సంపూర్ణమ్మై నైజమ్మౌ మాయన్ త్రెంచన్
      శ్రీవాసమ్మున్ దీపమ్మై సౌందర్యామ్మౌ శిల్పమ్మున్ సూరీ !మమ్మేలన్ సౌశీల్యమ్మై రా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #100'
    notes: yati/prasa relaxed, score=90%
  - text: |-
      ఆహార్యమ్ముల్ భూషల్ మైపూతల్ నిద్రల్  భూయానమ్మున్ తోడై నిత్యాభ్రాంతిన్ జీవుల్ మున్గన్ 
      దేహమ్ముల్ నౌకల్ సౌకర్యార్ధమ్మై శోభన్ దీపించున్ కట్టున్ బంధించున్ పాశాలన్ దీనున్ 
      దాహమ్ముల్ ధారాపాతమ్మౌ కోర్కెల్ ముంచన్ తాదాత్మ్యమ్మౌ భక్తిన్ దైవమ్మై వేదాద్రీశా
      దేహీయంచున్ కోరన్ నీవిమ్మా నిత్యంబౌ దివ్యాత్మా సన్ముక్తిన్ దీనాధారుండా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #240'
  kaamanaa:
  - text: |-
      హనుమకారాధ్య దీపమా
      వినుతినాసాంత రామమా
      మనుగడన్ జన్మ సారమా
      ఘనమువౌ పూజ్య శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #223'
  kaaminee-bhaavinee:
  - text: |-
      ఆంజనేయ మూర్తి దాసుడై
      సంజయుండు తీర్ధ కావలిన్
      భంజనమ్ము భీతి శాపముల్
      రంజనమ్ము లీల శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #281'
  kaasaarakaaMtaa:
  - text: |-
      వ్యక్తావ్యక్తమ్మౌ నర వాస్తవ రక్తా
      సక్తమ్మౌ కాలాంతక సాదర మాయన్
      శక్తమ్మౌ మంత్రమ్ముగ స్వామి జపమ్మే
      ముక్తాగారమ్మై నిలు ముక్తిగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #378'
  kaeLeeravaM:
  - text: |-
      పలు పాపముల్ శాపములౌ ధరిత్రిన్ 
      మలిజన్మ తెచ్చున్  మరికొంత భార  
      మ్ముల చేయ పుణ్యమ్ముల నీదు నామ
      మ్ములె తేర్చు పాపాంబుధినుండి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #221'
    notes: yati/prasa relaxed, score=95%
  kaesara-:
  - text: |-
      అంతర్మాలీ !కలి జనిత విషమ్మున్ యంత్రమై రుద్రమై క్షే
      మాంతర్మర్మమ్మునిడి గనుమ దీనున్ !మంత్రమై శస్త్రమై వా
      సంతమ్ముల్ పూచెడు తిరుమల ధర్మాచార వైకుంఠ సీమన్
      శాంతాకారుండ !కలియుగ విరక్తిన్ !జన్మ దాటించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #635'
  kaesara-kaeSara:
  - text: |-
      కారాగారమ్మగు జన గతులన్ కైవల్య సంప్రాప్తమౌ
      ధారాపాతమ్ముగ శుభకర సంధానమ్ము వర్ధిల్లగన్ 
      భారాక్రాంతిన్ కరుగు నరుల భూపాలీయ సంకీర్తనల్ 
      పూరించన్ విష్ణు పద తపన సంభూతమ్ములై శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #342'
  kaetana:
  - text: |-
      అన్యము నశించున్ హరి నీ పథి హారతిన్ నే
      శూన్యము వసించున్ చిరు నామ రసమ్ములన్ నే
      మన్యముల వెల్గున్ మధుసూధన శోధనమ్మున్
      ధన్యపు సిరీ రా తరళమ్మునిడంగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #195'
    notes: yati/prasa relaxed, score=100%
  kalaapaaMtaritaa:
  - text: |-
      మనోవాక్కుల నామసుప్రీతిన్
      ధనావాసములన్ దయా ముద్రన్
      సనాధుండవు శ్రీశ !సర్వేశా !
      జనాక్రోశ వినాశమౌ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #13'
  kalaapadeepakaM:
  - text: |-
      అంజనాద్రి రాముడా !అనాధ జీవ సాయమౌ జనార్ధనా !
      కుంజరమ్ము మోక్ష గోకులమ్ము జేర్చు భర్గుణాత్మ !శ్యాముడా !
      మంజరీ పదాంభుజా !మధూక పద్మ సోమమౌ నిరంజనా !
      భంజకమ్ము సేయు సావధానమౌ నిభల్ మురారి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #368'
    notes: yati/prasa relaxed, score=100%
  kalahaMsOtsaahamu:
  - text: |-
      కవన గీతుల మెరయు నికరార్ధులార్తి జల్లులన్
      నవ పునీత పదముల ఘన మాయనల్లు వెల్లువై
      భవిత సంజయము నెనరు పరోపకార శస్త్రమౌ
      ధవళ తార !తిరుమల సదనమ్మునీశ !శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #339'
  kalahamu:
  - text: |-
      ప్రణవమ్మై నిలుచున్ నారా
      యణ మంత్రమ్ము సరాగమ్మై
      గుణకమ్మై ఫలముల్ నింపున్
      రుణ పాశమ్మెయగున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #117'
  kalamatallikaa:
  - text: |-
      పసిడి వర్ణమున్ కుసుమ ధారుడా !బలిమి నీవు లక్ష్మీధరా !
      మిసిమి శోభలన్ మధురసాత్ముడా !మిళిత ద్వైత విశ్వంభరా !
      వసిత శృంగమున్ తిరుమలేశుడా !వర విధాన విశ్వేశ్వరా !
      మసలు జీవులన్ వెలుగు రాముడా !మనుగడీశ్వరా! శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #385'
  kalavallee-vihaMga@h:
  - text: |-
      మహీధరమ్ముల్ మహితాత్మల్ నియోగుల్
      విహార వాసావిరులై తిర్మలన్ స
      ద్విహార దీప్తిన్ విబుధాత్మల్ మణుల్ వి
      ష్ణు హారమై బ్రోచు సిరుల్ జేరి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #322'
  kalhaaramu-(kahlaaramu:
  - text: |-
      బెదిరెడు తుట్టెల్ పెళుసు జనమ్ముల్ బెరుకుగణమ్ముల్ విధి వరదాయీ
      కదిలెడు బొమ్మల్ గడుసు రుణమ్ముల్ కరుకు పణమ్ముల్ కలి సుమధారీ
      కదుములు కట్టెన్ కరచరణమ్ముల్ కరుణ శరమ్మున్ కనికరమీవై
      పదముల గీతిన్ భజనల రీతిన్ వరముల ప్రీతిన్ ఫలదుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #450'
  kalpadhaari:
  - text: |-
      ఆపదల్ కాపురమ్మౌ విశోక యాగమంటలన్
      కోప శాపమ్ములన్ తాళజాల ఘోర ఘాతముల్
      తాప ధూపమ్ములన్ ధూళి సోకు ధాత్రియందు నీ
      రూప లాస్యమ్ములోదార్పు శాంతిరూప శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #157'
  kalpalataapataakinee:
  - text: |-
      వ్యత్యాసమ్ముల యుగమున యమ యాతననొందు జన్మలన్
      సత్యాంతర్యములెరుగని నర సాధనలేలు జీవ సా
      పత్యమ్ముల్ కనుమరగవని నిశాచర గమ్య చేర్పులన్
      నిత్యాత్మా చెరవిడు దయనిడు నిత్య నివాస శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #362'
    notes: yati/prasa relaxed, score=100%
  kamalaakara:
  - text: |-
      ప్రకృతుల్ విరియు సమాసవరంజిత శోభన్
      వికృతుల్ సమయు గతార్ధ నివేదన గూర్పన్
      సుకృతమ్ములలరు జీవుల సువ్రత సిద్ధిన్ 
      వికచాంబురుహ రవీందు సువీక్షణ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #552'
  kamalabaMdha:
  - text: |-
      ఔదార్యమ్ముల సీమన్ హరుడౌ వేదాద్రినివాసా
      హ్లాదమ్మౌ కలిలో మాయ లయించన్ నిల్చిన శ్రీశా
      తాదాత్మ్యమ్ముల జన్మన్ తరళమ్మీవౌ సుమసారా! 
      పాదాలే కొలువుల్  పావన సాన్నిధ్యమ్మిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #586'
    notes: yati/prasa relaxed, score=100%
  kamaladaLamu:
  - text: |-
      కమలనయన! కరుణ గనన్ ఘనుడవీవే 
      విమల మతుల వెతలవి తీరు నిను గొల్వన్  
      ప్రమథ గణముల కధిప శంకర !  గిరీశా
      డమరుక హృదిని విభుడవై కావుమ!  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #559'
    notes: yati/prasa relaxed, score=96%
  kanaka-gauree:
  - text: |-
      అడగని వరముల్ నీయ యదువంశీ
      విడువక నెలవై భావిత కుభృత్తున్ 
      గడుసుగ శిల నిల్పున్ ఘనుడ శ్రీశా
      కడపటి సిరివౌ భాగ్యముగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #434'
  kanakamaalikaa:
  - text: |-
      ఏడుకొండలన శ్రీనివాస భువినేలు విశ్వపురి తేజమై
      గోడుదీర్చు నిలవేల్పువై పసిడి గోపురమ్ముల నివాసమున్
      నీడవై గమన దీప్తివై జతగ నిత్య సాక్షిగ సమస్తమై
      తోడువై నిలుమ !వేంకటారమణ! తోయజాక్ష !సిరి శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #391'
  karNapaalikaa:
  - text: |-
      యాగ భూమి నారాయణాద్రి వై
      రాగ యోగ తత్వారవిందమై
      జాగునుంచు నుర్వీ జపమ్ములన్
      సాగు నూర్చి సర్వేశ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #48'
  karaSayaa-kiSOrama:
  - text: |-
      ఉభయ తత్వములేకమౌ
      రభస భావమనంతమై
      ప్రభగ మ్రొక్కుల వేల్పువై
      శుభ విభాకర శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #233'
  karamaalaa:
  - text: |-
      గజరాజాభయ దాతా గరుడాద్రీ
      శ జనాభీష్టద నన్నీ శరణార్ధిన్ 
      నిజపాదాంబుజ సత్సన్నిధి నిల్పం
      డజరాజధ్వజ నీయండను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #218'
  karapallavOdrataa:
  - text: |-
      ప్రయోగమ్ముకై భూవన శైలమెంచి వా
      సయోగ్యమ్ములౌ వాసక వేంకటాద్రి పై   
      వియోగమ్ములంచున్ పెనవేయు జన్మలన్
      నియోగించు భక్తిన్ నెలవుండు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #100'
  karibRMhitamu:
  - text: |-
      నారద గళమునేలు విచలిత నాదముగ ఘన గీతమున్
      నీరద కుసుమ జల్లులుగమరి నెల్లెడ కురియు మంత్రమున్
      శారద వర పదామృత భరిత సంహిత రసవిశేషమున్
      కారణముగద నీ పద మిళిత కాంచన మహిమ శ్రీపతీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #5'
  karmagati:
  - text: |-
      కావ్యముల్ కీర్తించు నిధివై కారుణ్య సంద్రమై
      నవ్యతల్ భూషించు సిరివై నారాయణాత్మవై
      దివ్యతన్ పోషించు హరివై తీర్ధమ్ము నాధుడై 
      సవ్యతన్ దీవించు జగతిన్ శాసించు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #155'
  karmishThaa:
  - text: |-
      తామస క్షితిపై జీవుండన్
      కామిత జగతిన్ దీనుండన్
      సామజ గమనా శ్రీనాథా !
      పామరుడను రక్షీ !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #111'
  kathaagati:
  - text: |-
      ఆకాశ గంగ పాతమ్మున తడిసి విమోహమౌ నరజన్మలన్
      సాకార కర్మ రాహిత్యములమరు నివాస తీర్ధ విలాసమున్
      వైకుంఠ మూర్తివై భూ తిరుమల హరివై పరాత్పర శక్తివై
      లోకమ్ము నేలు విశ్వాత్మ చరణముల చేర్పునివ్వుమ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #382'
    notes: yati/prasa relaxed, score=100%
  kavikaMThabhooshaNamu:
  - text: |-
      కనకాంబరాది సుమగంధ విభూషిత మాలలన్ మనో
      ధన వస్తు భాగ్యమిడి దర్శన భాగ్యమొసంగు నైక భూ
      వన కాంచనాద్రి గిరివాసుడ శ్రీకర వేంకటేశ్వరా !
      మనవిన్ !మదాత్యమగు మానవజన్మను బ్రోచు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #373'
  kavikaaMta:
  - text: |-
      భావము నెంచని భూతమౌ వెతల భారమ్మై నరజీవితమ్ములన్
      దైవము గాంచిని రోతలౌ గతుల దాష్టీకమ్మున దారుణమ్ములన్
      పావన కూర్పగు నామముల్ వెలసె వైద్యమ్మై తపయోగ సూత్రమై
      సేవల బంధనమై ప్రమోదమిడు చేతన్ సాధ్యమునిమ్ము శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #217'
  keeralaekhaa:
  - text: |-
      తపన నిల్పు జాతక విలాసమాలన్
      జపములేలు శ్వాస గణ డోలికాళిన్ 
      చపలతత్వ దోషయుత లోకమున్ గె
      ల్చు పథమీయవే సుగుణ తేజ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #122'
  keertee:
  - text: |-
      పరమార్ధమువై పరమాత్మా
      నరులెల్ల కనన్ ఘనముక్తిన్ 
      వరదోభవ పావన భక్తిన్
      వరమిమ్ము శుభంకర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #209'
  khaeTakamu:
  - text: |-
      పాపముల సావధానమ్ములన్
      శాపములశేష దాహమ్ములన్
      తాపశిలలౌ తరోన్మత్తులన్
      చూపు కరుణన్ సరిన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #280'
    notes: yati/prasa relaxed, score=100%
  khaelaadhyaM:
  - text: |-
      అర్ధానర్ధములన్ దీనుండన్
      వ్యర్ధాసక్తము నైరాశ్యుండన్  
      నిర్ధారించని దాసుండన్ నే
      నర్ధమ్మున్ గను దేవా! శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #234'
  kiMSukaastaraNaM:
  - text: |-
      సిద్ధుడన్ భవ వంచితుండన్ దీనుండన్ 
      బుద్ధుడన్ నరుడన్ బుధాసక్తుండన్ సం
      సిద్ధుడన్ ధర చేసితిన్ పాపాల్ మాయా 
      బద్ధుడన్ నను కావవే దేవా!  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #214'
  kiraata@h:
  - text: |-
      వరములనీయరా !సావధానమ్ముగన్
      గరిమల చేర్చరా !రాగయోగమ్మువై !
      పరిమళ పుష్ప సంశోభితమ్మున్ విశే
      ష రయమునేగి సంరక్షకా !శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #292'
    notes: yati/prasa relaxed, score=100%
  krODakreeDaM:
  - text: |-
      చిక్కుల్ పీడించు దినచర నరుల జీవనాద్యంతమున్
      నిక్కుల్ తాడించు మిణుకులుగ కలి నీరసారణ్యమున్
      మ్రొక్కుల్ పూయించు సుగుణ విరులగు మోక్ష మార్గమ్ములన్
      రుక్కుల్ పొంగించు గతి నిలుపు హరి లోకమున్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #343'
  krauMchapadamu-:
  - text: |-
      అబ్బురమౌ నీ దర్శన లీలల్ హరిత కనుమల విహరణల సీమన్
      బెబ్బులివై నారాయణ దీప్తిన్ విరిసి మురియ పుడమి విరుల మాటున్
      నిబ్బరముల్ ధైర్యమ్ముల నించన్ నియతి వినతి పదనిసలకు సాక్షీ
      పబ్బములౌ మ్రొక్కుల్ ఫలముల్ భూవన సిరులనొసగు వరదుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #440'
    notes: yati/prasa relaxed, score=100%
  kreeDaachaMdraM:
  - text: |-
      మనోల్లాస డోలాయమానమ్ము క్రీడల్ మనోజ్ఞమ్ము శ్రీశా
      ధనోల్లాస ధర్మాధికారమ్ము ధాత్రిన్ ధనుర్ధారి వై పా
      వనోల్లాస పూజ్యాధికారమ్ము జూపన్ భవత్సార భూమిన్
      ఘనోల్లాస గంగాతరంగమ్ము వైభోగ మంత్రమ్ము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #451'
  kreeDitakaTakaa:
  - text: |-
      ఒద్దిక బలమై నిలు యుద్ధానన్ జన్మార్ధమ్మై 
      మద్దెల దరువై కలి మత్తేభమ్మై లాస్యమ్మై 
      నిద్దుర కరువౌ భువి నిస్తేజానన్ తేజానన్
      ముద్దుగ నెలవై నిజ మోక్షంబిమ్మా !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #197'
    notes: yati/prasa relaxed, score=96%
  kshama:
  - text: |-
      అతులిత బలసాయమ్మువై ధీరమున్
      చతుర పద పయోజమ్మువై శ్లోకమున్
      వితరణలిడు వైవిధ్య వేదాంతమున్
      సతత వెలుగువౌ సత్యమై శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #295'
  kshamaa-2:
  - text: |-
      అడుగులు దుడుకు యాగ గుండమ్ములై
      తడబడు నడక దాస్య నందమ్ములై
      వడి జనుల గతి వాస్తు ఘన్ పోలికన్
      మిడుకు తిరుమల మెట్లు భూ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #294'
  kshmaa:
  - text: |-
      జనముల తలమున్ చైతన్యమ్మువై జీ
      వన వనముల సంప్రాప్తమ్మౌ ఫలమ్మున్
      తను మన ధనముల్ ధారాపాతమౌ దీ
      వనల నిడుమ !భూ వైకుంఠాత్మ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #437'
  kshmaahaaramu:
  - text: |-
      సాక్షీభూతముగ భువిన్ జన్మోద్ధార !సతత వేదాద్రిన్
      దాక్షిణ్యమ్మిడ నిలు సంతాపమ్ముల్ పతనములౌ లీలన్
      సాక్షాత్కారమునిడు శేషాద్రీశుండ చరణ దాసుండన్
      సాక్షీ !రక్షణడరు విశ్వాకారమ్ము జతనమున్ !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #628'
  kuMbhOghnee:
  - text: |-
      ధర్మాధర్మమ్ము దరిజేరు దివమ్మై
      కర్మాకర్మమ్ము కరిగించు తలమ్మై
      మర్మమ్ముల్ దాటి మరపించు పురమ్మై
      వర్మమ్మౌ నీ శుభద పాదము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #414'
  kuMja:
  - text: |-
      ఆధారము నీవు నిత్యహారతులన్ వెన్నుడా
      మేధోరణ జన్మ జాఢ్య మేదుర పాతమ్ములన్
      సాధారణ జీవ కోటి సాధ్యములన్ రక్షవౌ
      క్రోధాంధ సజీవ శిల్ప రుగ్మతలన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #131'
  kuTajagati:
  - text: |-
      అలిపిరి కొండమల్పున్ యాగమ్మౌ గిరిన్
      కలియుగ బ్రహ్మయై సాకారమ్మై గళ
      మ్ము లయగ రామ గీతిన్ మోహమ్మేలగన్
      బల భజరంగి వెల్గున్ భక్తిన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #87'
  kuTilaM:
  - text: |-
      నవీన యోగపు నరగుణ తీర్ధమ్మై
      దివంపు సౌరుల తిరుమల కొండల్ లా
      ఘవమ్ము నించు సుగమ హరి భక్తిన్ స
      త్తు వీడకన్ సుగతుల సిరులౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #396'
  kuTilagati@h:
  - text: |-
      జటిలము నిండు జన్మమ్ము మేలెంచన్ మా
      కుటిలత త్రెంచు గోపాలుడా !భారమ్మౌ
      గుటకల లెక్క గుత్తంగ నిర్జించన్ సం
      కట హరణా! వికాసమ్మువై రా !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #425'
  kubaerakaTikaa:
  - text: |-
      కవనమ్ములనేక మాత్ర పదగీతిన్
      పవనమ్ముల సావధానమగు శ్వాసన్
      జవసత్వములన్ జనాంతర విరక్తిన్
      నవనాడుల జ్ఞానమై పొలుకు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #228'
  kumaaraleelaa:
  - text: |-
      అర్ధిన్ భూనిలయ నరుడనౌ హలాహలమ్మున్
      వృద్ధిన్ గానని కలియుగ ప్రాకృతంపుఁ బూతన్
      సిద్ధిన్ దోచని గుణ మరుపున్ చిరాగ్ని దూతన్
      బుద్ధిన్ కాన్కగ నొసగమ నిల్పుజూపి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #199'
    notes: yati/prasa relaxed, score=100%
  kumuda:
  - text: |-
      వేంకటేశ్వరా !శోభిత హరితేజా
      సంకటమ్ములో నాసలు నశియించన్ 
      ఘీంకరించు దంతిన్ క్షితి వడి గాచెన్  
      శంకరార్చిత రక్ష నొసగు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #213'
    notes: yati/prasa relaxed, score=95%
  kumudamaalaa:
  - text: |-
      సుచరితా !హాసుడవు భూదాస్యముల భక్తిన్ సువన శోభన్ మెరయు శూరా !
      సుచకితా !దాసుల యశో భాసురమ !జిజ్ఞాసులకు బ్రహ్మమ్మువు కిశోరా !
      విచల సంసేవిత వరా భూషితుడవై భూవిరుల మూర్తిన్ నిలు నివాసా !
      సచివుడా !శ్రీశ !గనుమా !రాజస విధాతా !సతత ముక్తిన్ నడపు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #70'
    notes: yati/prasa relaxed, score=100%
  kumudanibhaa:
  - text: |-
      అవనితలానన్ హాయి గూర్చు మంత్ర
      మ్ము వసుధ జీవుల్ మోక్షమందగోరన్ 
      రవి కిరణమ్మై రామ నామ పాన
      మ్ము వరమగున్ పెన్ ముక్తినిచ్చు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #135'
  kumudineevikaaSa@h:
  - text: |-
      అవే కనుల్ చిన్మయ విహంగమై భూ
      మి వాసికిన్ దివ్య మెరుపై శమమ్మై 
      నివేదనానంద నిలుపై ఫలమ్మై
      ప్రవాసి నీదౌ శరణమౌను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #323'
  kuraMgikaa:
  - text: |-
      గానమ్ముల్ గోవిందయను హరినామ ఘంటల రావమున్
      తానమ్మౌ గంగోత్రి తరగల భవ్య తారక జల్లులన్
      పానమ్మై రాగమ్ముల సరళి తేర్చు భక్తి నినాదమౌ
      వైనమ్ముల్ నిత్యమ్ము తిరుమల కొండ వాలున శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #341'
  kusuma-2:
  - text: |-
      అడరు ఏడుకొండల్ భువిన్
      దుడుకు జీవరాశుల్ గతిన్
      తొడరు భక్తి యోగమ్ములన్
      పుడుకు తేజమై శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #219'
  kusumavichitra:
  - text: |-
      ఎసరు కొసరు హిరణ్యమ్ములై పు
      ణ్యసిరులు భువి నరార్ధార్ధ సొమ్ముల్
      విసుగుల గత విరక్తిన్ విశోకం
      పు సడిన పరమువై జేరు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #357'
  kusumavichitramu:
  - text: |-
      కలియుగ మాయన్ కనికరమంచున్
      మలియుగ జన్మన్ మనుగడలోయన్
      తొలకరి దీప్తిన్ దొరకును ముక్తిన్
      తెలచు జగమ్మౌ తిరుమల శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #134'
  kusumita:
  - text: |-
      గోళమ్మౌ పృథ్విన్ జన సదన సంకోచ సంసార భ్రాంతిన్
      మేళమ్మౌ జీవన్మరణ లయలన్ మెప్పునాశించు వింతన్
      తాళమ్మౌ శ్వాసల్ సరిగమ జతిన్ తత్వ రాహిత్యమున్ పా
      తాళమ్మౌ పుణ్యార్జనల వెలితిన్ ధర్మమై గాచు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #624'
  lOdhraSikhaa-2:
  - text: |-
      ఏకాకిన్ పుడమిన్ హితుడై దిగిరా భూ
      లోకమ్మున్ బలమై రుణ వారధివై రా
      శోకమ్మున్ దునుమన్ సులువై పరమాత్మా
      సంకోచమ్ముల రోషము త్రెంచర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #447'
    notes: yati/prasa relaxed, score=100%
  lOla:
  - text: |-
      అక్కరల్ సంపదాళుల్ సునాయాసమౌ జాలమై నిల్చు శర్వా !
      దిక్కువై జన్మలన్ తోడువై దివ్య శేషాచలాద్రీశువై భూ
      రిక్కు నాధుండవై చక్రధారీ ! అనిత్యమ్ములో నిత్యమౌచున్  
      చుక్కవై మ్రొక్కులన్ తీర్చుచున్ జ్యోతివై జేతవై బ్రోచు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #254'
  laaTeeviTamu:
  - text: |-
      అవరోధములన్ బలమౌ నిధివై హారమ్మౌ శేషాచలవాసా
      నవరాగములన్ స్వరమై ఘనమై నాదాత్మౌ నాట్యాలయ రుద్రా
      పవనాత్మజ ఱేడ !విలాస హరీ !పాశమ్ముల్ త్రెంచన్ తెగువై రా
      భవసాగర పీడనలన్ దునుమన్ భావోత్తేజమ్మై నిలు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #660'
  laalasaa:
  - text: |-
      సంతల్ వెతల పయోనిధిన్  చంచలమ్మౌ జగన్మోహమున్
      చింతల్ తురిమెడు శోచనన్ శీతలమ్మౌ మదోన్మత్తులన్
      వింతల్ విరియు జగత్తునన్ విభ్రమమ్మౌ విధమ్మౌ హరీ
      గంతల్ తొడగని నేత్రమై కాంచు సాక్షాత్కృతిన్ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #188'
  laasyakaaree:
  - text: |-
      అప్పులన్ నృత్యరీతుల్ కళాహారతుల్ నాట్యమున్
      తిప్పలౌ జన్మ గీతమ్ములన్ దీన సంకీర్తనై  
      ముప్పులన్ నిప్పులన్ చిక్కుచున్ ముగ్ధతల్ నాశమౌ
      తప్పులన్ రక్షవై గావుమా! దాస్యుడన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #158'
  lakshmi-4:
  - text: |-
      శ్రీనివాసా శ్రీధరా!  జీవుని ధామమ్మౌ కొండన్
      మౌని సంప్రాప్తమ్ములన్ భవ్య వరమ్ముల్ భోగమ్ముల్
      ధేనువై శోకమ్ములన్ దీర్చు గిరీశా నిర్వేద
      మ్మౌ నిజాత్మా కావరా మమ్ము  ! జగన్నాథా!  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #544'
    notes: yati/prasa relaxed, score=100%
  lalita:
  - text: |-
      హరి తిరుమల సాన్నిధ్యానన్ ఛాయనేలు మరీచినై
      పరిచయ హరితాత్మున్ నీడన్   ధూప దీప వనమ్మునై
      గిరి గరిమల శేషాద్రీశున్ చేకితానుని తేజమున్
      మురిసెద నిజపాదంపున్ బుష్పమ్మునై సిరి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #187'
  lalita-2:
  - text: |-
      భూనంద గోపుర సుహృత్ పురిన్ విలా
      సానంద మూర్తిగ సదా సనాధ రా
      గానంద నూపురములన్ కదంబ సీ
      మానంద మేలు చిరునామ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #258'
    notes: yati/prasa relaxed, score=95%
  lalitaM:
  - text: |-
      వసుధ వధువు వైవాహమ్ముల్ గిరిన్
      పసిడి నిలుచు సంప్రాప్తమ్మున్ హ్రణీ
      య సహజ మెరుపున్ హారమ్మై జతౌ
      ముసురు నగవులన్ మోమున్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #267'
  lalitalataa:
  - text: |-
      తిరుమల గిరి మూర్తిగ ఘనహరివై దినకర విభవములన్ మా
      దరినల కొలువై తరళమునిడు భూతి నొసగు పుడమిసితారా
      తరముల గత పాతకములుడుగు జాతకముల వరదుడవై భూ
      నర చెరవిడు విన్నపము గను హరీ !నటనలు నిలుపర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #704'
    notes: yati/prasa relaxed, score=100%
  lalitavikrama:
  - text: |-
      అచ్చపు చీకటుల్ ముసురు ప్రాయముల్ మిళిత జీవమున్ తోడువై
      నచ్చని దేహమున్ నలుగు ప్రాణముల్ జ్వలిత దీనులన్ కాంతివై
      చెచ్చెర పుట్టు కోర్కెలన భూచెరల్ తగులు కర్మలన్ దన్నువై
      మెచ్చెడు విష్ణు లోకమున స్వామి చెంతనిడు వేల్పువౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #388'
  lataa-3:
  - text: |-
      విచలిత ఫలమౌ నిరాశల్ వెలయున్ నిజాపేక్షలై
      సుచరిత హరి పాదముల్ నోచు వియోగ సంప్రాప్తమున్
      వచనముడుగు విష్ణు దీప్తిన్ పరికించు దాసుండనై
      సచకితులను జేయు భూతిన్ జలపుష్పమున్ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #186'
  laya:
  - text: |-
      గరుడగమనా ఘనాఘనసుందరా
      నరులశమనా నరోత్తమ శేఖరా
      విరులరమణా విదేహ పరాత్పరా
      తిరుమల గిరిన్ దినేశుడ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #300'
  leeDhaarka@h:
  - text: |-
      గుత్తమ్మౌ జీవాత్మ కొలువుండు జన్మల్
      చిత్తమ్మున్ పొంగారు చిగురించునాశల్
      విత్తమ్మౌ నీనామ ప్రియ రాగమాలల్
      సొత్తై దాటించున్ వసుధ చింత శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #412'
  leelaa-chaMdra@h:
  - text: |-
      భోగమ్ముల్వాసమ్ముల్దీ సౌఖ్యమ్ముల్గూడన్  బేరాసల్ పై కమ్మన్ 
      రోగమ్ముల్ బంధించున్ తగ్గున్ దారుఢ్యమ్ముల్ వాతమ్ముల్ ఘోషించున్ 
      యోగమ్ముల్ గల్బన్ భూమిన్ సద్విద్యోగమ్ముల్ దూరమ్మౌ విశ్రాంతిన్
      రాగమ్మై సచ్చింతా సారమ్మున్ రాజిల్లన్ మోక్షమ్మిమ్మా !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #527'
  leelaalOla@h:
  - text: |-
      ఏ గీతమ్మున్ నుడివెద యజ్ఞమ్మౌ జన్మన్
      వాగర్ధమ్మున్ చెలగెద భావమ్మున్ నిల్తున్
      భూగర్భమ్మున్ నిలిచెద పుణ్యమ్మున్ శూన్య
      మ్మై గాలింతున్ నరహరి మంత్రమ్మున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #443'
    notes: yati/prasa relaxed, score=100%
  leelaaraekha@h:
  - text: |-
      రమ్యమ్మై నామమ్ముల్ రంజించున్ బ్రహ్మాండమ్మున్ భూమిన్
      సామ్యమ్మై తోషమ్మున్ సారమ్ముంబెంపొందించున్ భక్తిన్
      సౌమ్యమ్మై రాజుల్లున్ సంసారార్ధమ్మున్ సందీపించున్
      గమ్యమ్మున్ జేర్చున్ సంకాశమ్మౌ శేషాద్రీశున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #539'
  leelaaratnaM:
  - text: |-
      కన్నీటిన్ సద్యః కర్మము జన్మార్ధమ్మున్
      పన్నీటిన్ ధారాపాత్రల పుణ్యార్ధమ్మున్
      మున్నీటన్ ముంపున్ మోహ విలాసమ్మున్ జీ
      వన్నాట్యమ్మున్ సంభారమువై రా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #384'
  luMbaakshee:
  - text: |-
      చిరునవ్వుల రాజిలు విలాసమ్మున్
      దరహాసములన్ ధవళ సూరీ !భూ
      వరదాత !పరాత్పరుని తేజమ్మున్
      పరమార్ధమువై పరముడా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #392'
  mOda:
  - text: |-
      గుక్కల లెక్కల నిల్చెడు ప్రాణము కూర్పుల జాలమ్మున్ పరమేశా
      చిక్కుల కర్మల దీర్చెడు లీలన చిక్కెడు భారమ్మున్ వరదాయీ
      దిక్కుల దిక్కుగ చక్కగ దక్కుచు దీనుల సాయమ్మౌ జగపాలా
      మ్రొక్కుల మాయను దాగెడు నిశ్చల మోక్ష విధాతా !గావర శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #665'
  mOhapralaapa-1:
  - text: |-
      సామజమై చరితన్ నిల్చు మోక్ష గాధన్
      వామనుడై బలి దానమ్ము త్రెంచు రీతిన్
      శ్యామలుడై యదువంశమ్ము కీర్తి గీతన్
      రామ హరీ !రమణా !నీదు మాయ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #36'
  mRdaMgakaM:
  - text: |-
      సిద్ధిన్ విరాజిలు నియోగ చెరన్ విలాసివై
      బుద్ధిన్ విపంచికగ నిల్చు పురాణ పుణ్యమున్
      రాద్ధాంతమౌ నరుల జన్మ రహస్య భాష్యమున్
      సిద్ధాంతివౌ హరి విధాత చిదాత్మ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #132'
  mRdugati:
  - text: |-
      గగన కిరణ గమన ప్రకాశ
      మ్ముగ జగముల మురిపెమువౌ వి
      శ్వ గతుల సిరివరుడ నిరాకా
      ర గుణి గను నర చెరను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #345'
  mRshTapaadaa:
  - text: |-
      సుప్రభాతమ్మందు భా
      సుప్రకాశమ్మౌ శుచిర్
      సుప్రమోదమ్మై విభన్
      సుప్రసాదా !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #134'
  maMdaakinee:
  - text: |-
      మందాకినీ పాతమ్ములై మాన్యమ్ము గంగోద్భాసముల్
      పందేరమౌ వేదామృతావాహమ్ము పొంగారున్ విభల్
      నందమ్ములై వైకుంఠమానందార్ధ్రమౌ పీయూషముల్
      వందారు వేదాద్రుల్ భువిన్ పంచామృతమ్మౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #160'
  maMdaakshamaMdaaraM:
  - text: |-
      నిను మరువని ధ్యానమ్మున్  నీ నీడన్ వసించు భాగ్యమున్ సాధ్యమ్మై
      నిను విడువని ధ్యాసన్ భక్తిన్ నిర్వేద రాగమాలికన్ యోగమ్మై
      నిను తలపుల ధ్యానింతున్ పన్నీటిన్ జలాశయమ్ములన్ ధర్శింపం
      గ నెనరుల విరాడ్రూపమ్మై కావన్ ! సుదర్శనమ్మిడన్ రా !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #647'
  maMdaaramaala:
  - text: |-
      అనురాగమ్ముల్ జగతిని సహాయమ్ములై శ్రీనివాసా
      ఘనగీతమ్మై హరి పద విరుల్ కల్ప సంకల్ప భక్తిన్
      పెనుయోగమ్మున్ నిలుపు జనులన్ భీతి నిర్జించి గాచున్
      మను వేదమ్మై సుగతులు నిడున్ మాన్యతన్ గూర్చి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #454'
  maMdaaramaalaa:
  - text: |-
      ఆనందమానంద మాయల్ ప్రకోపించు యాతానుయాతా జనావాసమున్
      భూనంద సారంగ తారంగమాడించు భూతావిఘాతా వరేణ్యాలయన్
      ధీనందమై గంగ పాతమ్ములౌ నిల్చు ధారాళ భావంపు సయ్యాటలన్
      పానంగ శ్రీనాధు నామమ్ము ధ్యానించు పాశావికాశాత్ముడన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #397'
    notes: yati/prasa relaxed, score=100%
  maMgaLa:
  - text: |-
      కైలాస వాసుని సాకార సమీప్యత రూపున్
      పైలోక పాలక సంప్రాప్త సమాంతర కాంతిన్
      తారా సుతార ప్రభన్ దైవ విభాకర ధాతా
      భూలోక వాసుడవై పుణ్యమొసంగర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #81'
  maMgaLa-4:
  - text: |-
      పెను మత్తేభము విహార రథమ్ముగ మారె వే
      దన ఘట్టమ్ముల తలంపుగ మోక్ష కథార్థమున్
      తను సిద్ధమ్మను తరించెడి సూక్ష్మముదెల్పు భూ
      జన సాకార విజయార్థమునీయుచు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #178'
  maMjubhaashiNi:
  - text: |-
      కమలాక్ష !భూతల దిగంత విష్ణువై
      విమలాక్ష !కాంచన నివేద పూర్ణిమై
      శమనాక్ష !పర్వత ప్రశాంత సూరివై
      కమనీయ సాధనవు గావె శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #125'
  maMjumaalatee:
  - text: |-
      వేదభూమినింద్రుడ పెనాత్మ విశ్వుడా
      మేదినీ నివాసుడ మితంగమాన్యుడా
      నాదరూప రుద్రుడ నరోత్తమీశుడా
      ఖేదమార్చు వెన్నుడ గిరీశ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #122'
  maMjusha:
  - text: |-
      అంతరార్ధమ్మై విహారా !వేద శృంగిన్
      వింత జాలమ్మై వివేకార్ధమ్మునేర్పున్
      సుంత పుణ్యమ్మున్ యశోభాగ్యమ్ములీయన్
      సాంతమై దేవా! వశమ్మౌ దివ్య శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #211'
  maNibhooshaNamu:
  - text: |-
      పర్వతమ్ములన భూసుర భాస్కర తేజమై
      నిర్వికారచలనాచల నిశ్చల మూర్తివై
      చర్వితమ్ములగు జన్మల సాగున భేదివై
      సర్వమీవను తలంపున స్వామివి శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #16'
    notes: yati/prasa relaxed, score=96%
  maNideepti:
  - text: |-
      సూర్యాధార జగమ్ముల సూరీ !సుందర వేంకట నాథా !సౌం
      దర్యాధార సుదర్శన ధారీ !దైన్యము త్రెంచర లోకమ్మున్ !
      కార్యాకార్యములన్ నవ కర్మన్ !కాల వికాల సకాలమ్మున్
      శౌర్యాధారమువై నెలవై శేషాచల శ్రీ రమణా !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #638'
  maNihaMsaa:
  - text: |-
      అలిమేలు పెన్నిధివై విహార నివాసుడా!
      చలనాచలమ్ముల ధర్మ స్యందన చోదకా !
      కలినేలు సంకటహార కారణమూర్తివై
      తెలవార నీయర జన్మ తీర్ధుడ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #327'
  maNikalpalataa:
  - text: |-
      కలియుగ జీవకోటులన్ కాంతుల  చైతన్యమ్మై
      మలియుగ జన్మ చక్రమున్ మార్చెడు బ్రహ్మాస్త్రమ్మై
      కలిచెఱ ద్రెంచు వేల్పువై కాంచన లక్ష్మీశా !మా
      కలతల మాపు మాధవా !కల్కి సరూపా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #558'
  maNikuMDala:
  - text: |-
      సకలమ్ కళా కౌశలమ్ముగ కృష్ణువై
      నికరమ్ విలాసానివాస సరోజమై
      మకరీ గజేంద్రుల్ మదోన్వధ చక్రివై
      ప్రకటించు పెన్ సంప్రణీతమ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #149'
  maNimaMjaree:
  - text: |-
      జగన్నాధా !తిరుమల వన చక్రీ !చరాచరమేలుచున్  
      జగద్దీపా !శత దినకర తేజో సమాన దినేశ్వరా !
      జగద్ధారుండ !భువన ఘన ధాతా ! జగాంతర మౌనివై
      జగత్కళ్యాణ జనితము వరమ్మౌ సనాతన శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #365'
  maNimaala-3:
  - text: |-
      పుష్పమ్ముల నీడన్ పూర్ణోదయ రూపై
      నిష్పక్ష గతిన్ సాన్నిధ్యమ్ము నొసంగన్
      నిష్పందములౌ చాంద్రీ దాతవు చక్రీ
      విష్పందమునాపన్ వేంచేయుమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #165'
  maNiraMgamu-maNiraagaa:
  - text: |-
      శ్రీహరీ ! తపసీ! జగధీశా
      లాహిరీ సుమరాగ నరేశా
      మోహ మాయల మోక్ష విధాతా
      దేహచింతన దీర్చుమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #109'
  maaNavikaavikaaSa@h:
  - text: |-
      కన్నుల్ దివాకర కాంతుల వెల్గు జిల్గున్
      మిన్నుల్ విరాజిలి మేనుగ పొంగులీనన్
      వెన్నల్ ముకుందుడ వేడుకవై ధరమ్మున్
      తెన్నుల్ విధించుమ తేర్చు శివుండ !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #422'
  maadhaveelataa:
  - text: |-
      ఉయ్యాలల్ తూగు కోర్కెల్ యుగమున లోభ విదారకమ్ములై
      సయ్యాటల్ నాడు జన్మాల్ సరళతరమ్మగు నీదు సన్నిధిన్
      వయ్యారమ్ముల్ రయమ్మున్ వలపుల హోయల బంధనమ్ములన్
      పైయ్యాటన్ నిల్పు మాయన్ పశుపతివౌ హరితాత్మ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #200'
  maalaachitra:
  - text: |-
      ఆర్తిగ గోవింద నామమ్ము యాగమ్ముగ నరహరి లయజూపున్ హరించున్ శ్రమమ్ముల్
      కీర్తనగా నిల్చి ఘూర్ణిల్లు గీర్వాణి కదన కిరణములై యోరగితమ్మై భువిన్ జీ
      వార్తిగ జీవమ్ములన్ శ్వాస పాశమ్ముగ నిలు పవన విభూదిన్ వరమ్మై ఘనమ్మై
      మూర్తి నినాదమ్ములై జేరి మోక్షమ్ములనిడు మురిపెములై గోమునర్చించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #140'
    notes: yati/prasa relaxed, score=90%
  maalaachitraa:
  - text: |-
      అతుకుల తరముల భూయంత్రమై జీవితమ్ముల్
      గతిచెడు గతముల ఛీత్కారమౌ పాతకమ్ముల్
      మతి చెఱల చెలగు క్రొంగొత్త లోకాశయంబుల్
      చితిని నుసియగు గతుల్ చేవ నిర్జించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #563'
    notes: yati/prasa relaxed, score=100%
  maalatee:
  - text: |-
      మెలకువ నీయర మేఘ వర్ణుడా
      చులకన సేయక సూర్య కాంతుడా
      వెలుగుల లోక గభీర తత్వమున్
      తలపుగ జేరి నిధాన శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #262'
  maalini-2:
  - text: |-
      గత వితరణ మాత్రన్ ఘాత శాతమ్ములేలన్
      మిత చతురత తోడౌ మిధ్య వాసమ్ములందున్
      పతన జతన వృద్ధిన్ పాప సంజాత చేర్పున్
      సతత తపన నిల్పున్ సాధనై దివ్య శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #87'
  maalyOpasthaM:
  - text: |-
      మరులు గొలుపు గిరుల రమాకాంతా! శ్రీనాధా !
      విరుల కొలువు నలరెడు వేల్పున్ వేదార్ధమ్మై
      వరముల వరదనిడుచు పద్మాక్షీశా  !లోకో
      త్తర విభవమున వెలుగు తారా !రక్షౌ !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #562'
  maana:
  - text: |-
      అతి సనాతనా !గిరివాసా !ఆర్యాపతి శివాత్మా !స
      ద్గతుల విష్ణువై గనరా !సాకారమ్ముల ఫలమ్ముల్ మో
      ద తిరుసీమలన్ నెలవై నందమ్మున్ మెరయు శ్రీనాథా
      కృతుల సారమై హరిగీతిన్ పృథ్విన్ కలిమివౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #619'
  maanasabhaMjani:
  - text: |-
      కొండల రాయుడా !  మనోగోకుల వేంకటేశుడా!
      దండల మాటు చంద్రుడా ! తారక లోకపాలుడా !
      ఖండయఖండ ధర్ముడా ! కారణ కాంతిశీలుడా !
      చండ ప్రచండుడా ! సదాచార గిరీశ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #167'
  maaraabhisaraNaM:
  - text: |-
      విశ్వేశ్వరుడ! వృషాద్రీశా శోభిత సుమమేరువౌ శ్రీకా
      రా శ్వాసగ నిలు వేదాద్రీశా రమణుడ వేంకటేశా స్వే
      చ్ఛా శ్వాంతనలిడు సర్వేశా పాశములుగ పాద పద్మమ్ముల్
      విశ్వమ్మునకిడు దాస్యార్ధమ్మై విరుల విభూషితా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #138'
  maayaa:
  - text: |-
      నీ జాడను జూపు నివేదన పూజల్
      భూ జాలము నేలు పురాణ యశస్సుల్
      నైజమ్మును మార్చు నవోదయ మార్పుల్
      రాజిల్లగ కొల్తు రమా మణి !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #32'
  maayaasaaree:
  - text: |-
      గడువుల జన్మల్ జీవమ్ముల్
      ఘడియల లెక్కల్ లోకమ్ముల్
      వడిగొను కాలాతీతమ్ముల్
      ముడివడు నీ నీడన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #182'
  maayaavalayaM:
  - text: |-
      నాగాస్త్రమ్మై పద గతులన్ నాద ఝరుల బెంచున్ 
      భోగాస్త్రమ్మై విడు సుఖమున్  పుణ్యమలర శ్రద్ధన్ 
      యోగాస్త్రమ్మై వరతప సద్యోగముల సభక్తిన్
      రా గోవిందా !పదమున సారమ్ములలర శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #584'
  maayaavee:
  - text: |-
      ఓంకారమ్మున్ తేజమ్మై భువిన్ యుక్తానియుక్తమ్మై
      ఝంకారమ్మై లోకాద్యంత దాసోహమ్ముగన్ వేదా
      లంకారమ్మై గోవిందా స్తుతుల్ రాజిల్లు సారమ్మై
      శంకాతంకమ్మున్ సంకీర్తనై సంప్రాప్తమౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #30'
    notes: yati/prasa relaxed, score=100%
  maayaavinee:
  - text: |-
      సమయమ్మేదన్ జనుల్
      గమనమ్మేదన్ గడిన్
      దమనమ్మౌ హేలలన్
      శమనమ్మౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #325'
  madalalita:
  - text: |-
      తలుపులు చాలు తరళ పథమందున్
      కొలువులు నిల్పు కుదురు హరి భక్తిన్
      చెలువములై రజిత ఖచిత రూపున్
      కలిమి ప్రదాయక నను గను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #431'
  madanOddhuraa:
  - text: |-
      అందని లోకము వీడి గో
      విందుడవై భువికొండలన్
      చందన చర్చిత సేవలన్
      చందురుడైతివి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #235'
  madanadarpaNamu:
  - text: |-
      అర్భక నరుడన్ మురారి సాయమౌ వియోగమున్
      దుర్భర గతులన్ విహారివై తురంగ వేగమున్
      నిర్భయ మితులన్ విరాజమై నివేదనాంతమున్
      దుర్భిణి పొడిమిన్ సరూప సత్తువీవు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #168'
  madanamaalikaa:
  - text: |-
      అభయ హస్తమున్నడరు యంత్ర శిల్పమ్మువై
      విభవ పూల మాలలన వేద కల్పమ్మువై
      శుభద నాదమున్ కలిమి సుప్రభాతమ్ములన్
      ప్రభు నిరంజనాత్మగ సురాగమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #145'
  madanasaayaka:
  - text: |-
      మరణ వేదన వరించు వేళన మనోవ్యధల్ ముసురు కాలమున్
      తరుణమేదను మధించు ధ్యాసన తపోధనమ్ముడుగు శోకమున్
      తరుము కాలము వధించు జీవిత తరాంతరమ్ముల విలాపమున్
      కరుణ జూపు హరినామ పానము గళమ్మునింపు హరి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #400'
  madhumallee:
  - text: |-
      అలిమేలమ్మ విభుండవై
      తలపున్ మానససీమలన్
      నెలవౌ వేంకట నారసిం
      హ లయమ్మేలెడు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #239'
  madhyaadhaara@h:
  - text: |-
      ఆసాంతమ్మున్ నిలు యాగార్ధమ్మై
      కాసారమ్మౌ నర కర్మార్ధమ్మున్
      భూసారమ్మై నిలు పుణ్యాత్మా ధీ
      వాసా శేషాచలవాసా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #151'
  maedini:
  - text: |-
      తడి పొడి లోక కల్పనల తత్త్వ  శోధనమ్మున్
      సడి గొను చుండె ఘంటికల చైత్ర జీవతంత్రిన్
      ముడిసరుకున్ ధరాస్థలిని ముక్తి గోరు దీనున్
      విడువక నీ దరిన్ నిలుచు విద్యనీమ్ము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #557'
  maeghaalOka@h:
  - text: |-
      ధనార్ధుల్ జీవన్మృత్యున్మాదుల్
      ఘనార్తుల్ ద్వంద్వావస్థన్ మత్తుల్
      మనో దౌర్భల్యుల్ వీరిన్ రక్షిం 
      పనానందమ్మౌ సాక్షీ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #235'
  maeghaavaLi:
  - text: |-
      ఢమరుకమ్ములై తేట తేనీయులై
      కమలనాధు భక్తిన్ కవాటమ్ములై
      విమలశోభ ముక్తిన్ విహంగమ్ములై
      గమకమౌ హృదుల్ యోగమున్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #271'
  maeghamaala:
  - text: |-
      సుమధుర రసమై విశోకమ్ములన్ మంత్రమై చొప్పు నామమ్ము పీయూషమై
      సుమధర వనమై యశోమూర్తివై వేంకటేశుండవై రూప దివ్యాత్మవై
      సుమ కుసుమిత నిత్య శోభన్ ప్రకాశమ్మువై సుందరేశా నివాసాత్మవై
      సుమశర వరముల్ నిశోసర్గగీతమ్ములన్ సొత్తువై దాతవౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #408'
  mahOdaya:
  - text: |-
      వైష్ణవ గిరుల పాలకా !జగదీప !తారక శ్రీహరీ
      జిష్ణు పదముల జీవకోటి లయన్ చిరాగ్ని ప్రకాశమౌ
      కృష్ణ పథమున బృంద గానములన్ కృషీవల బంధమై
      తృష్ణ నిలిపెడు పృథ్వి శృంగములన్ కృపాళుడ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #359'
  mahaaSakti:
  - text: |-
      అనాలోచిత జీవమ్ము యమజాలములన్ జిక్కన్ 
      సునాయాసముగా వీడి బెదురున్ వసుధన్ నిల్వన్ 
      వినాశమ్మున శంకించు వెతలౌ తెగువే గెల్చున్ 
      ధనాధీశా !  ధరానాథ ! దయజూపుమయా !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #589'
    notes: yati/prasa relaxed, score=96%
  mahaamadanasaayakaM:
  - text: |-
      చతుర సాగర విరాజమై కలిత జన్మ చక్రమున ప్రాణ దీపమై
      జతగ లౌకిక విమోచనార్ధుల విచార జ్వాలన పరాత్పరుండవై
      పతన పాతకములన్ పరాజయములన్ ప్రభావ విజయార్ధ శక్తివై
      సతత ముక్తి పథమున్ జ్వలించు పరమార్ధ సంభవములీయు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #409'
  mahaasragdhara-2:
  - text: |-
      అనురాగ యోగముల్ సోహమను పథము రాయంచలౌ జీవ హేలన్
      ధన సాగరమ్ములన్ సాధ్యమును వెతుకు సంతానమౌ జన్మ ధారన్
      వనవాసమౌ ధరిత్రిన్ వసితముల గతిన్ వాస్తవమ్మౌ గతమ్ముల్
      జనలోక మాలివై సచ్చరితుడ బలమై శక్తి నందించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #677'
  mahaasragdhara-3:
  - text: |-
      పరమాత్మా వేంకటేశా వరముల నెలవున్ భావలోకమ్ములార్తిన్
      శరణాగత్యాంతరా భూషణముల హరివై శ్వాసవౌ జీవ ధారా !
      ధరణీ దేవా ద్విజాత్మా తరళమునిడరా ధర్ముడా ధర్మసౌరీ
      కరుణాద్రీశా !మురారీ !కలతల తలమున్ ఘాతముల్ మాన్పు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #678'
  makaraMda-1:
  - text: |-
      అశాశ్వత వాసములన్ దయనోచని జన్మ నిరాశ  యదార యత్నమ్మున్
      నిశాచరులై ధరణిన్ కనికారముగాంచని జాల నిశీధి నిశ్చేష్ఠన్
      యశోమయ ధీరములన్ భయమందని కాంతుల నిర్ధయ భూ విహారమ్మున్
      వశమ్మగు దాసుల దాస్య పథమ్ముకు పన్నగ శాయి పరేశుడై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #699'
  makaraMdikaa:
  - text: |-
      అయోధ్యన్ రామమ్మై !కలియుగ మనోహరుండగు స్వామివై
      సయోధ్యన్ కృష్ణమ్మై !తిరుమల నివాసమున్ జగధీశువై
      పయోజమ్ముల్ నేత్రమ్ములగు కరుణాపయోనిధి శ్రీశువౌ
      ప్రయాసాద్యంతమ్మున్ నిలుచు వరదోభవుండవు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #203'
  malayasurabhi@h:
  - text: |-
      ఇంద్రోపాధుల విరహిత మోక్షాగ్నిన్
      మంద్రమ్మౌ హరిపద మననమ్మున్ ధీ
      సంద్రమ్మున్ విరియు విషయ సంప్రాప్తిన్
      చంద్రాపీడ హితుడ సిరివౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #413'
    notes: yati/prasa relaxed, score=100%
  mallapalleeprakaaSaM:
  - text: |-
      గజమ్మున్ ఘనమ్మున్ గళమ్మున్ గతమ్మున్ ఘటమ్మున్ ఘనాంబున్ గరమ్మున్ గభీరమ్మువై
      రజమ్మున్ రవమ్మున్ రణమ్మున్ రుణమ్మున్ రపమ్మున్ రసమ్మున్ రథమ్మున్ రసోద్ధాతువై
      యజమ్మున్ యమమ్మున్ యుజుర్వేద యుక్తిన్ యశమ్మున్ యజస్సున్ యుగమ్మున్ యదార్ధమ్మువై
      నిజమ్మౌ నలమ్మున్ నరమ్మున్ నగమ్మున్ నభమ్మున్ నిశీధిన్ నిరాకారమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #218'
    notes: yati/prasa relaxed, score=90%
  manOgati:
  - text: |-
      తళుకున్ మెరుపున్ తరళమ్మున భూతల వేంకటాద్రి ధర్ముడా !
      కళలన్ సులువున్ కవితాశత సంకలనమ్ములేలు శర్వుడా !
      దళమున్ గణమున్ ధవళాంబరమున్ దరిజేరు చక్రధారుడా !
      గళమున్ పదమై ఘననామ కృతిన్ కలిమై వశించు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #394'
    notes: yati/prasa relaxed, score=100%
  manahaMsa:
  - text: |-
      గీతమ్మున భావమునేలు కేశవ పల్లవిన్
      భూతమ్ముల పంచ విరూప పూతగ మూర్తివై
      శాతమ్ముగ జీవులనిండు సాంతమనంతమై
      ఘాతామిళితమ్ముల జన్మ కారక శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #121'
  manaharaNa:
  - text: |-
      సతత పథమున్ సారమై జీవనాధారమై
      గత విలయమున్ కర్తవై కర్మ సాఫల్యమై
      వెతల గతులన్ పెన్నిధీ చిద్విలాసమ్మువై
      జతగ లయమున్ చైత్రమై సత్యమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #322'
  manaviSraama:
  - text: |-
      ఇవ్వని పున్నములెన్నుచు జీవన హేలనెరపు చిరు జీవిన్
      గువ్వగ రివ్వున వైష్ణవ తీరము కోరుచు నిలిచెడు భక్తిన్
      దివ్వెల రువ్వెడి వేంకట నాధుని దివ్య పథపు హరిదాసున్
      మువ్వగ శ్రీహరి పాదమునాడెడు మోక్షమిడు విరిని శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #649'
  marmasphuraM:
  - text: |-
      కర్మార్ధముల్ సహితమౌ కలాకల్పమున్
      చర్మార్ధముల్ తగరమౌ జరాశిల్పమున్
      ధర్మార్ధముల్ నికరమౌ తదాత్రమ్మునీ
      నైర్మల్య నామ జప పానమున్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #84'
  mata:
  - text: |-
      అగరు ధూపముల్ యతుల కీర్తనల్
      గగన హంగులౌ గరుడ పత్రముల్
      తెగని భోగముల్ తిరుమలందముల్
      నెగడు తీర్ధమై నిలుచు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #270'
  matta:
  - text: |-
      జాలమ్మున్ చిక్కున జనరేణున్
      గాలానన్ చిక్కిన ఘన ధేనున్
      కాలానన్ చెక్కిన కలి మాయన్
      ఫాలానన్ నీ తిరుపడి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #152'
  mattaalee:
  - text: |-
      తర్కనాన్ సంజాత నియోగమ్మున్ జీవిన్
      కర్కమ్మున్ పృధ్వీగణ జీవోన్మత్తుండన్
      సర్కానన్ శ్వాసన్ జనయంత్రానన్ దేహిన్
      మార్కండేయుండన్ మహిమార్దుండన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #379'
    notes: yati/prasa relaxed, score=95%
  mattabhRMgi:
  - text: |-
      ఫాలభాగమునేలు నామము పావన కలిమి లోకమున్
      శూలపాణి త్రినేత్రమొప్పుచు సూర్య ప్రభవ సుకాంతులన్
      మేలు గూర్చు సుగమ్య దీప్తిగ మీది పథమున నిల్పు పెన్
      జాల విష్ణు విలాసమై జన జాగృతి సిరిగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #371'
  mattabhadramu:
  - text: |-
      ఆదిశేషు పడగల నీడన హాయినొందు విశాంపతీ
      నాదమోదముల గనివై భువి నారసింహమ భూపతీ
      వేదవైద్యముల నిధివై జనవేద సీమల భూమ నీ
      పాద చేర్పు నొసగు వరంబుగ పావనంబుగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #369'
  mattaebha-2:
  - text: |-
      భూతమ్మున్ భూలోకాధ్యమ్మున్ బ్రహ్మాండమ్మున్ పుణ్యార్దిన్ సంభూత పురిన్ దేహాంతర్యామిన్
      ఘాతమ్మున్ ఘోరమ్మున్ ఘోరాఘోరాత్మన్ సాకారమ్మౌ వేదాద్రి కళాభృత్తున్ భక్తుండన్ 
      గీతమ్మున్ గానమ్మున్ గోవిందార్తిన్ శోభన్ గేయమ్మున్ సంగీత కిశోరమ్మున్ శ్లోకమ్మున్
      శాతమ్మున్ ముక్తిన్ దేహిన్ నీ దాసుండన్ శ్రీశా !విశ్వాధారా !వశమౌ !విశ్వాత్మా !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #350'
    notes: yati/prasa relaxed, score=100%
  mattahaMsini:
  - text: |-
      సుభాషితమ్మై రుచుల మేళవింపులన్
      విభూషితమ్మై తపిత తాళమేళమున్
      ప్రభావితమ్మై శుభద సుప్రభాతమై
      ప్రభో వరమ్మై భువన మేలు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #78'
  mattakOkila:
  - text: |-
      మృగ్యమౌ పరలోక భావన పృథ్వి జీవిత గమ్యమున్
      భోగ్యమౌ వర సామజమ్ముల పుణ్య సాధన గెల్పులన్
      యోగ్యమౌ హరి నామధారణ యోగ్యతాందల మంత్రమై
      భాగ్యమౌ పరమాత్మ సన్నిధి పంకజమ్మగు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #19'
  mattavilaasinee:
  - text: |-
      పూచెడు పూలకు చిక్కిన చక్కని పుణ్యముదక్కెడు ధామమై
      వేచెడు వేడుక పూరిత జీవుల వేదన దీర్చెడి తీర్ధమై
      పాచిక పారని పాతక లెక్కల పాశము త్రెంచెడు తీరమై
      గాచు మురారి వశించు నివాస నిగారమె తిర్మల శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #387'
  mayoorasaariNee:
  - text: |-
      అప్పడా !వరాల వేంకటేశా !
      తిప్పలన్ శమించు దారి జూపన్
      ముప్పులన్ కుదించు నేర్పు నీయన్
      గొప్పగా నినున్ నుతింతు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #277'
    notes: yati/prasa relaxed, score=100%
  mayoori-2:
  - text: |-
      యోగ వియోగములాగమవందిత యోచన లోచన లోభిత లాలస జన్మల్
      రాగ విరాగ తరంగములాగని రాజ విలాస విరాజ జగమ్ముల లీలన్
      తీగగలాగెడు కర్మవికర్మల తేరుల భీతిని లోతుగ జారెడు ముంపున్
      వేగమెరార సుదర్శన ధారుడ పెన్నిధి నిశ్చల మోక్షము నీయర శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #300'
    notes: yati/prasa relaxed, score=90%
  mayoovadanaa:
  - text: |-
      చంచల జగత్తున భూ జడాజడ చేతలన్
      వంచనల మానవ పాప కర్మల కట్టులన్
      కాంచన గిరిన్ కొలువై కటాక్షణ వీక్షణల్
      పంచు జగదీశు తపో పథమ్మిడు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #138'
  mihiraa:
  - text: |-
      అలుపునెరుగన్ హరీ జీవితానన్
      నలుపెరుగ నో నరాత్మన్ పదాతిన్
      చలనమున శ్వాసనాపన్ వియోగాం
      చల పథమువౌ జగన్నాథ శౌరీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #364'
  mithunamaalee:
  - text: |-
      క్షణములమరు కాలమ్మున్ ప్రాణమ్మున్
      క్షణిక మితుల క్షాత్రమ్మున్ క్షంతన్ వీ
      క్షణల రహిత క్షామమ్మున్ విష్ణ్వర్ధిన్ 
      క్షణ ఫలముల కక్ష్యన్ జీవిన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #347'
  mlaechCha:
  - text: |-
      అర్ధమ్మున్ విడి వాహనమ్మునౌ విదేహిన్
      వ్యర్ధమ్మున్ జనజీవనమ్ములన్ విరాగిన్
      శుద్ధమ్మున్ సుమనస్సుదీప్త మోక్ష గ్రాహిన్
      సిద్ధమ్మైతిని శేషి !దారి జూపు శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #446'
    notes: yati/prasa relaxed, score=100%
  mukuLita:
  - text: |-
      కాలమాయలన సకల కర్మలన్
      వేల దారులన జపిత మర్మమున్
      నేల నింగి నమరు నివురౌ జగ
      న్మాల ధారుని పదమగు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #278'
  muraLi:
  - text: |-
      అడుగన్ సంచర జన్మ యాతానుయాతమ్ములన్
      నడిమిన్ ముంపుగనిల్చు నారీవిలాసమ్ములన్
      పొడిమిన్ నింపెద నిత్య పూజార్చనానందముల్
      విడువన్ నీపద దివ్య వేదాంభుదిన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #22'
  muraelaa:
  - text: |-
      పద కవితన్ మెరయు పరిమళములన్ పా
      రదముగ భావ మధురసమడరు పొంగున్
      కదనము నేలు పద సముచిత నివాళిన్
      కదలెడు భక్తి వడి గను గిరుల శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #85'
    notes: yati/prasa relaxed, score=100%
  nRttalalita:
  - text: |-
      నీటి జలతారు తరగన్ గురుఫణిన్ పడకగా గొనిన కోమల వినీల శుభగాత్రా
      తోటి యదుబాలకుల గోగణముతో నెనరు చూపి దుడుకై వ్రజసతుల్ వలచు కృష్టా
      కోటి కిరణమ్ముల దివాకరుడ గోకుల నరేశ కురుసారధివి కూర్పు నిడు దేవా !
      నాటిన సజీవ జనుడన్ గనుము నాథ విధులన్ వినయశీలత ధనమ్మునిడి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #250'
  naMdanaM:
  - text: |-
      గరుడ విహారి !భూసిరి !విలోక వీక్షణల్ దాతవై
      నరుల నిహార సంకటములన్ నశించు యుక్తిన్ ధనే
      శ్వర !సమవర్తి !వేదగిరులన్ సనాతనాద్రీశ్వరా !
      వర గిరిధారి !వేంకటగిరుల్ ప్రకాశమా శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #347'
  naMdinee-3:
  - text: |-
      నడమంత్రమ్మౌ మాయానాటకములోనన్ 
      సుడిగుండమ్ముల్ వేముంచున్ కలిమియాసల్ 
      వడగాడ్పుల్ నిట్టూర్పుల్ వందలును వేలౌ
      నడతల్ మార్పున్ జేయన్ నాథుడవు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #226'
  naagaanaMda:
  - text: |-
      నిత్యానిత్యమ్మున్ నాదా నందమ్మై సాన్నిధ్యమ్మున్ భోగమ్ముల్ నించన్
      గత్యాగత్యమ్మున్ సాంగత్యమ్మున్ వైరాగ్యమ్మున్ నైరాశ్యమ్ముల్ నిల్పున్
      భత్యమ్మౌ నీ నామమ్ముల్ వేదాంతాత్మా భాగ్యమ్మౌ భావాంతర్యామీ
      సత్యమ్మై సత్యోద్దీపా !సంరక్షౌ శేషాద్రీశా !మాహేశా శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #637'
  naaraacha@h:
  - text: |-
      సనాతనా ! సులోచనా !  విశాంపతీ ! యశోమతీ ! 
      జనార్ధనా !  విమోచనా !  ప్రజాపతీ !  మనోరథీ ! 
      ధనార్ధ నాయకా !  నిజార్ధ ధారణార్ధ ధీమతీ ! 
      మనోధనా !  నిరంజనా !  యమార్చితాయ !  శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #328'
  naarada:
  - text: |-
      భయమున భీతిన్ పతన వనమ్మౌ పతిత యుగమ్మున్ ధైర్యమై
      నయముల ప్రీతిన్ నతుల విభక్తిన్ నరగుణ భుక్తిన్ శౌర్యమై
      రయముగ భక్తిన్ రజిత విరక్తిన్ రసమయ గోవిందమ్ముగా
      శయన ప్రశాంతిన్ సతత సురక్షన్ శమన పథమ్మీ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #215'
  nadinee:
  - text: |-
      బ్రతుకులతేర్చు విభవమ్ము ప్రసాదిం
      చు తిరుమలేశుని సుశీల పదమ్మున్
      సతత సుభక్తిని  సదా నిలు సాధ్య
      మ్ము తొలుకు శ్రీపతి ముదమ్ముగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #432'
  nala:
  - text: |-
      సజల నయన శోక సంసారమ్మున్ నిర్ఝరీ
      సుజల కుసుమ నేత్ర సొంపున్ బంధమ్మౌ హరీ
      విజయ జయుల ఱేడ వేదాద్రిన్ గోవిందుడా
      నిజ పదముల పుణ్య నీడన్ వీడన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #141'
  namaeraa@h:
  - text: |-
      బ్రహ్మోత్సవ సారమౌ విహారా
      బ్రహ్మాది సురల్ లయమ్మునీవై
      బ్రహ్మాండ వినీల వాసుదేవా
      బ్రహ్మాండపు తీరమీవు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #53'
  naraeMdra:
  - text: |-
      పంచమ వేదమున్ పరమ పథమును పంచిన కృష్ణ మురారీ
      పంచవటీ కుటీర నిలయ పతిత పావన సద్గుణ రామా !
      పంచ తపస్సులన్ దినకరుడ గను పాప విలాస విరాగిన్
      పంచన జేర్చుకోర తిరుమలగిరి వాసుడ మాన్యుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #651'
  naragaa:
  - text: |-
      నెపముల నేలన్ నిలుపై భూ
      కపటపు చివ్వన్ కలిమై పెన్
      రెపరెపలాటన్ లిఖితమ్మౌ
      తపనలు నీ తత్వము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #179'
  nayamaalinee:
  - text: |-
      అలసట చాటు సాయముగ నిల్చున్
      వలసల దేవుడై పరమ దేజో
      వలయ నివాసుడై వరదుడై దీ
      నుల వర కామధేనువుగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #341'
  neepavaneeyakaM:
  - text: |-
      కోపిత నిలుపుల పుడమిని గోవర్ధన గిరినెత్తుమ గోకుల కృష్ణ్టా !
      తాపస మధువుల హరిపద తాదాత్య్మమహిమ చూపుమ తారక రామా!
      నూపుర సొబగుల నగవులనోలాడి వసుధనేలు వినూత్న నృపాలా!
      పాపముల విలయముల విడుపై గావర జగతిన్ మెరుపై సుమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #330'
  neeraaMjali@h:
  - text: |-
      నీరాజనముల నిత్యార్చనల్
      పారాయణముల పద్యార్చనల్
      ధారాళ సిరుల దాస్యార్ధముల్
      పారీంద్రుని గిరిపై శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #33'
  neeraaMtikaM:
  - text: |-
      నమ్మించు భూనర వినాశ లయమ్మున్
      నీ మౌన తూనికగ లాభ పదమ్మై
      మమ్మేలు నామమున వేంకటనాధా
      సమ్మేళనౌ సరళి నాస్తిగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #59'
    notes: yati/prasa relaxed, score=100%
  niSa:
  - text: |-
      అతుకు బతుకులన్ దయాసాగరమ్మౌ నిరాకార భా
      రతరముల విధిన్ విలాసమ్ములన్ భావనాత్ముండ పా
      లిత భువనములన్ పరిక్రాంత తాపమ్మనంతమ్ములన్
      సతత కలిమివై నిజాంతర్యమై సాంతమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #71'
  niSipaalaM:
  - text: |-
      పాదములె చాలు నిజ భారముల స్వాంతనై
      వేదముల తీరముగ భీతులన ధీరమై
      భేదము హరించెడి విభేదముల శాంతమై
      వేదన నశించెడి వివేకమిడు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #140'
  nibhaalitaa:
  - text: |-
      గరుడాద్రిన్ లోకనాయకా
      నరులార్తిన్ నిత్యపాలకా
      పరమాత్మన్ దివ్యవీచికా
      కరుణాత్మౌ వెల్గు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #37'
  niraMtikaM:
  - text: |-
      విమాన నిలయ విరితేజా
      సమాంతర భువిచల దీపా
      తమస్సు నిలుపు తరళాత్మా
      నమో తిరుమల నగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #44'
  nirgaLitamaekhalaa:
  - text: |-
      అణువణువున ప్రాణమై నిలయ ప్రవాసమ్ములన్ హరీ
      గుణవితరణ దుర్గమై వెలుగు ప్రసాదమ్ములన్ తమో
      రుణ గతముల కర్మకై యమరు ప్రకోపమ్ములాస్యమున్
      తృణ ఫలముల నాటకమ్మున కృపవై చేరు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #196'
  nirjharadhvani:
  - text: |-
      సారంగపాణి హిత శోభాయమాన జగదానంద శ్రీశ !కలి రుద్రుండవై
      తారంగమాడు గత ఘాతావిశేష తరమూల్యమ్ములన్ తరగు నింద్రుండవై
      పారంగతమ్ముగు గుణమ్మేలు కర్మ ఫలమున్ భాగ్యమౌ వరదుడా దివ్వెవై
      భూరంగ కోవెల విరాట్టున్ విలాస పొడమిన్ నిల్చు భావుకమువౌ !శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #416'
  nirmaedhaa:
  - text: |-
      పిలిచినంతన్ కుబేరాత్మన్ తా
      నిలిచి వడ్డీల్ వినీలాత్మన్ వి
      శ్వలయ లీలా విభన్ పాపమ్ముల్
      నిలుపు చూడ్కిన్ !సునీతిన్ !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #177'
  nirviMdhyaa:
  - text: |-
      అలౌకిక జనావాసమ్మున్
      శిలన్ మురహరీ !దాస్యార్తిన్
      చెలంగు హరి పాదాల్ చేరన్ 
      కలే కద గిరీశా ! శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #273'
  nivaasa:
  - text: |-
      ఆగమ సశాస్త్రీయ దంతిన్
      నాగశయనా నారసింహా
      రాగమనురాగమ్మువై వై
      భోగమునిడున్ రార శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #46'
  noopura:
  - text: |-
      నూపుర కాంతిన్ వినూత్న వైభవ విశ్వాత్మవై
      చూపున కారుణ్య సూత్రమౌ కరుణాసంద్రమై
      దీపమువై దివ్య దీప్తివై శత జీవాత్మలన్
      బాపుమ శోకమ్ము పాపపంకిలమున్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #142'
  pRshadvatee:
  - text: |-
      ఆమోద యోగ్యమౌ హాయినివ్వు లోకమున్
      ధీమోత శాంతమౌ తీర్ధమివ్వు శోకమున్
      భూమాత సౌఖ్యమౌ పుణ్యమివ్వు ధర్మమై
      గోమాత సంతతిన్ కోటినివ్వు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #86'
  pRthveetilaka:
  - text: |-
      అనంతశయనా !వికల్పముల లహరివౌ మురారీ
      తనూలతికలన్ !నివాసుడ సతత మహీధరా !రా
      ఘనాఘన గిరీశ !విశ్వ శివుడ గరుడాద్రివాసా
      వినాశమొనరించు దీవనలిడి విబుధాత్మ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #615'
  paMchachaamara-2:
  - text: |-
      తృణీకరమ్మునోచు శృంఖలమ్ములై
      రుణారవింద కర్మ రుగ్మతన్ మనో
      రణమ్ములై భయాంతరార్దులౌ నరుల్
      గుణమ్మునెంచి పంచు కూర్మి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #255'
  paMchachaamaraM-1:
  - text: |-
      చరాచరమ్ముల సమైక్య కూటమిన్
      ధరాతలమ్మున తరార్ధ చక్రమున్
      జరామయమ్ముల సమాంతరమ్ములన్
      నరాశ్రితుండ ఘనసీమ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #252'
  paMkaja-muktaa:
  - text: |-
      అతకని కతకని దేహములన్ యాతన్ భువిజీవుల్
      ముతక ముడతల జరామయమున్ మోడౌ జనకోటుల్
      గత మరుపునడరుచున్ కొలువౌ ఘాతావిలయమ్మున్
      మతి చెదురు మనుజులన్ గనరా !మందారుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #429'
  paMktiratha.:
  - text: |-
      ఋగ్వేదమువై ఋత సారమ్మై
      దిగ్వాసుని వైదిక రూపమ్మై
      దిగ్వాసములన్ తిరు విశ్వేశా
      ఖగ్వేద విరాగ ఝరీ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #175'
  paNaava@h:
  - text: |-
      మ్రొక్కుల్ వేదికన మురారి పెన్
      దృక్కుల్ వీచికల కృపా విభన్
      చిక్కుల్ త్రెంచు హరి చిదాత్మవై
      రుక్కుల్ నేలుమ తిరు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #49'
    notes: yati/prasa relaxed, score=100%
  paaNee:
  - text: |-
      మృగమయమ్మయెన్ భూతలి కృపాళులంతరించన్
      దిగువ లోకముల్ తీరుగ తెగింపు సొక్కి జారెన్
      సుగమమేది జాతిన్ నవ శుభోదయమ్ము లీలౌ   
      నిగమమీయవే !శ్రీహరి !నివృత్తి కూర్చి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #41'
  paaTeera:
  - text: |-
      సురపూజితుడ సొబగులయనంతా
      వరదాయి నరవర మనువు లీలన్
      తరుణీమణుల తపనగ విరాజి
      ల్లు రమాపతి నిలుపు దయను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #224'
  paaraavata@h:
  - text: |-
      సాకార రూపా సదా చిద్విలాసా కృపా
      ప్రాకార దంతిన్ వరారాధ్యమై దైవమై
      లోకాల దీపా రుణమ్ముల్ నివారించు భూ
      శోకాల దుగ్ధన్ సుషేణుండవై శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #82'
  paarshatasaraNaM:
  - text: |-
      అప్పడుగ తిరుమలన్ లక్ష్మీనాథా !హరిత పథముల వరములీయన్
      తిప్పలుబడ కనువిప్పుల్ గల్గించన్ తిమిరపథముల వెలుగునింపన్ 
      నొప్పుల జగములగుందన్  శౌర్యమ్మున్బొదగగ నిలిచిన వరదాయీ ! 
      గొప్పలనిడు గతి జేర్చన్ దీరమ్మౌ కొలనున తళుకు జిలుకు శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #520'
  paarthivaM:
  - text: |-
      ప్రభో తిరుమలేశ భూతల విహార పరమేశ్వరా !
      విభో వరవిలాస శేషగిరి దీవిన సికందరా !
      ప్రభాకర శుభోదయమ్ముల సహార ధరణీశ్వరా !
      శుభంకర !ప్రబంధ కారకుడ ! భాసురమ !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #348'
  padmaavarta@h:
  - text: |-
      గోపాలా !లోకానన్ కోపాగ్నిన్ సం
      తాపాగ్నిన్ శోకాగ్నిన్ తగ్గించన్ సం
      దీపా పూర్ణానందా దివ్యాత్మా ధీ
      రా పాపమ్ముల్ త్రెంచన్ రారా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #153'
  padmasadma:
  - text: |-
      పద్మ పత్ర విశాల నయన తాపసుల తపోధన శక్తివై
      పద్మ సంభవునాత్మనడరు భావ పటిమలన్ పరమాత్మవై
      పద్మవాసిని మానస మణివై వరముల కౌస్తుభ ధారివై
      పద్మ బాంధవ తేజమలరు పావన హరి ! తిర్మల శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #392'
  padminee:
  - text: |-
      రాజ్యముల్ నిల్చున్ రాజసమ్మున్ పై
      రాజ్యముల్ కొల్చున్ లాలసమ్మున్ ధీ
      రాజ్యమున్ సాకారాత్మ నీ భక్తిన్
      భోజ్యమౌ కర్మల్ పుణ్యమై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #55'
  pallavari:
  - text: |-
      నల్లని మేఘ వనమ్ముల వర్ణవిభూషణా
      చల్లని కన్నుల జల్లు సుభిక్షణ వీక్షణా
      తెల్లని సూర్యుల దివ్వెగ వెల్గుల పోషణా
      కల్లగు కాల వికాల సురక్షవు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #146'
  paraamOda@h:
  - text: |-
      అయోధ్యాపురి రాముడవై అనాధ జనుల శ్రీనాధా !
      నియోగమ్ముల నీయర సన్నిధానమునిడి శ్రీవాసా !
      వియోగమ్ముల భాస్కరుడా !విధాన నిధిగ వేదాద్రిన్
      ప్రయోగించు విలక్షణ సారభూత మహిమలన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #452'
  paribRDhaM:
  - text: |-
      అణుకువల్ చాలవింకన్ యమోత్పాతలన్
      బెణుకులౌ జీవులందున్ విచారమ్ములన్
      మిణుగురుల్ పోలు కష్ణమ్మిడున్ ఘాతమౌ
      గుణములన్ త్రెంచు శోభాంకురా శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #293'
  parikhaayatanaM:
  - text: |-
      శివకేశవ సారమువై చేతనలిడు సంక
      ల్ప విధిన్ దొరవై కొలువై పావన గిరులన్ నీ
      దు వశమ్మున వెల్గు జగద్ధూపముల స్థితిన్ గాం
      చు వలాహక సారథివే చూడు దయను !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #578'
  parilaekha@h:
  - text: |-
      నిరాయుధుడన్ పుడమిన్ నివురున్ జ
      న్మ రాగమునింపు హరీ !మరుజన్మ
      మ్ము రాని పధమ్మున సొమ్ముగ దీవిం
      చ రా !కను వేంకట రాజమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #321'
  parimaLaM:
  - text: |-
      హరి నిజపాదమ్మున విహరించు సుమార్తిన్
      చిరు హనుమద్భక్తిన వశితమ్ముగు తీగన్
      మెరిసిన ప్రహ్లాద కలిమి పాలక శక్తిన్
      తరళ వియోగమ్ముల పదతంత్రిని శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #191'
  parimitavijayaa:
  - text: |-
      ఎరుక మెరుపువై హితమ్మువై భూ
      పరిమిత వనిలో భవాంతరా వా
      సర తిరుమల దర్శనమ్ము లీలన్
      నిరతము నిలు శ్రీనివాస శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #358'
  parimiti:
  - text: |-
      కటకట జన్మ వికారము గాంచర కాల వాహిని ప్రవాహజలమ్మున్
      కిటుకును జూపర కేశవ మాధవ కేరడమ్ము విడి వేంకట రామా !
      నటనల లోక వినాయక సత్య సనాతనా !తిరుమలేశ !వరమ్మౌ
      పటిమల నించర పాప వినాశక భక్తి మార్గమున నిల్పర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #702'
  paripuMkhitaa:
  - text: |-
      క్షీర సాగర చిద్విలాస విష్ణుమూ
      ర్తీ రమాపతి తీర్ధ శ్రీనివాసుడా !
      ధీర మాధవ దివ్య చింతదీర్చు శ్రీ
      శా రమేశ నిజాంతరంగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #283'
  paritOshaa:
  - text: |-
      రమణీయ రవిసుధాకర నేత్రా  
      రమనాదరమున దాల్చెడు స్వామీ  
      కమనీయకర ధృతాంబుజ చక్రీ
      శమతోడ జడిన నిల్చితి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #216'
  pathikaaMtaa:
  - text: |-
      శ్రీహరి పదపు సిరుల్ నిలుపున్ సం
      దేహముల నిరతి కల్గు విముక్తిన్
      దాహములు విగతమౌ హరి చెంతన్
      స్నేహభరిత గణితమ్ముగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #368'
  phalasadanamu:
  - text: |-
      లఘువుల గురువుల వరదల చిరు పద్య
      మ్ము ఘనతలనడరు సముచిత హరి భక్తిన్
      రఘుకుల తిలకుడు చలపతియను జీవిన్ 
      మఘవుని ప్రభవగు రమణుడ గను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #561'
  pikaalikaa:
  - text: |-
      భావముల భావన వైభవమ్మువై
      దేవతల భూతిగ దేవదేవుడా !
      కోవెలని గోకుల కృష్ణ మూర్తివై
      దీవెనల రీతినిదేలు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #273'
  pipileeka:
  - text: |-
      మత్తేభమ్మున్ సంరక్షింపన్ మనోహరుండవై మహత్తు మహీధ్రమై
      విత్తమ్మున్ వాసమ్మున్ సేనల్ విరాగ మార్గమున్ విహార విలాసివై !
      చిత్తమ్మున్ భూతమ్మౌ కోర్కెల్ చెలంగు భారమున్ చిరాగ్ని విధాతవై !
      సత్తెమ్మున్ సాంతమ్మై శ్రీశా !శరణ్యమీవె పుష్కరాక్షుడ !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #389'
  plavaMgama@h:
  - text: |-
      అత్తరు నిండిన దేహిన్ హరించెడి పుణ్యమున్
      గుత్తపు జన్మన చిత్తౌ కుశాగ్ర వియోగమున్
      మెత్తని కోర్కెల చిక్కున్ చిదంబర గుహ్యమున్
      చిత్తము నేలెడి దిక్కౌ శివాత్మవు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #144'
    notes: yati/prasa relaxed, score=100%
  poorNaa:
  - text: |-
      అత్యాశల కర్మలన్
      ముత్యమ్మగు పుణ్యమున్
      సత్యాచరణమ్మువౌ
      నిత్యాశ్రిత శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #238'
  prabhaakalita-1:
  - text: |-
      సలలిత రాగ సుధారసామృత సారమై ప్రకాశమై
      విలసిత సప్త మహీద్రముల్ పదవెల్లువల్ ప్రసిద్ధమై
      నిలయ నినాద సనాద వేద పునీతమై ప్రమోదమై
      కలిమి నొసంగు విహారి నామ ప్రగాఢ హేల శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #354'
  prabhaata:
  - text: |-
      ఉదయకిరణ మయుడివై ప్రభన్
      హృదయ తిరుమల కృపవై జగ
      ద్విదులు గనని భవిక లోకమున్
      కదులు వరమిడి గను శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #265'
  prabhaavatee-1:
  - text: |-
      ఆలాపనాలనల యశోహవిస్సులన్
      సాలోచనాలయ గుణ సంచయమ్ములన్
      భూలోక వాసిత పడిగాపులన్ చెరన్
      మేలెంచు దీవనలిడు స్వామి శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #291'
    notes: yati/prasa relaxed, score=100%
  prabhaavati:
  - text: |-
      నాదమ్మువై నందముగ యక్ష గానమై
      ఖేదమ్ములన్ గీతముగ రక్ష మంత్రమై
      వేదమ్మువై వేంకటసనాధ పూజ్యమౌ
      పాదమ్ములన్ పాద్యముగ జేయు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #83'
  prabhaavati-2:
  - text: |-
      నవ్యేశ్వరా !నరలోక శ్రీనివాసమున్
      సవ్యేశ్వరా !శరణాగతార్ధ విష్ణువై
      హవ్యేశ్వరా !హరితాద్రి సుందరేశువౌ
      దివ్యేశ్వరా !తెరచాటులేల ! శ్రీపతీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #290'
  praguNeekRtaa:
  - text: |-
      సమయ రీతుల గీతిన జాజర మ్రోతలన్
      దమన నీతుల బాటన తారక పుట్టుకన్
      విమల పూతల నేతగ వేంకట రాయుడా
      శమన మీయవె విష్ణు విశాంపతి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #143'
  prahaeyamu:
  - text: |-
      మెరిసెడు శుభ పూ మేరున్ విహారీ
      విరుల తెరల సంవేదమ్మువై పా
      మరులు బుధులకున్ మాహేశ ! ప్రాపౌ
      తిరుమల గిరి సందీప్తమ్మ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #348'
  praharshiNi:
  - text: |-
      అందీయందని నిలయమ్ములన్ సమస్తా
      నందమ్ముల్ నిలుప సనాతనాత్మవై గో
      విందా !భక్తి సులభ !విశ్వ భూతనాథా !
      సందోహమ్ముల గిరి చక్రధారి  !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #473'
  prahlaada:
  - text: |-
      భవబంధమ్ముల భయహేలల్ వినబడు నేలన్ నరమాత్ర తున్కన్
      భవశాపమ్ముల భగవన్నామపు పరమార్ధమ్మున పుణ్య రేణున్
      భవతర్షాన నభయహస్తుండ నిభములన్ గావుమ శ్రీనివాసా !
      భవధీయమ్మగు భవసారమ్ములపర రూపమ్ములనేలు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #360'
  praj~naa:
  - text: |-
      అమలిన పృథ్వీభృత్తున్ నీడన్ యాత్రార్ధమ్ము నివాసుండై
      మమతల మేల్కొల్పుల్ సత్సేవన్ మంత్రోద్ధారణ నీశుండై
      కమతము దీర్చున్ మాహేశుండై కైవల్యమ్మిడు సూర్యుండై
      తిమిర జగత్తున్ దేదీప్యమ్మై దీపించున్ నెలవై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #617'
  praj~naamoolam^:
  - text: |-
      అంతర్ధానమ్మగు విలయ నివాసమ్ముల్
      చింతాక్రాంతమ్ములడరు చిరు జీవార్దుల్
      చింతాబ్రాంతమ్ముల వగచెడు దీనాత్ముల్
      సాంతామ్మీవై మెరయు విజయుమౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #442'
  pramadvara:
  - text: |-
      గీర్వాణి పుత్రుడన్ కేదార నాధుడై
      సర్వాంతరార్ధమౌ వేదాద్రి శంకరున్
      నిర్వేద రూపమున్ నిండార కొల్చు భూ
      పర్వమ్ము కోవెలన్ భక్తుండ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #260'
    notes: yati/prasa relaxed, score=100%
  pramitaa-2:
  - text: |-
      అనురక్తి భక్తి పదమాలన్
      ఘనశక్తి యుక్తి జగదార్తిన్
      పెనముక్తి నిచ్చు హరిబాటన్
      పెనవేయు దాస్యమిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #279'
    notes: yati/prasa relaxed, score=100%
  pramuditavadanaa:
  - text: |-
      అభయమిడు ప్రవాహ కల్పమ్ములన్
      నిభముల సడిలేని లోకమ్ములన్
      శుభమునిడు పరేశు పాదమ్ములన్
      విభన నిలుపు తావిగన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #13'
  prapaMcha-chaamaraM:
  - text: |-
      అణువణువున సత్య రూపమున్ హరీ !సజీవ చేతనై
      క్షణ మడుగుల జన్మ లాస్యమున్ గమించునాదమై శృతిన్
      గుణములనిడు దాతవై పరాకునేలు జన్మ కారకా
      రుణముల ధరణిన్ వియోగమేలు సాక్షివౌచు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #357'
  prasRmaraamaraalikaa:
  - text: |-
      మనసుగొలుసున్ మనోహరాత్మ భూ
      వన శిఖరమున్ పరాత్పరా !ప్రభో !
      కనుల వెలుగౌ కదంబ శిల్పమున్
      వినతుల నతుల్ విహార శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #272'
  prasaraa:
  - text: |-
      చామంతీ వలతిన్ చతురాత్మా
      సామంతమ్ముగ శేషవిలాసా
      ధీమంతమ్మగు వైదిక మూర్తిన్
      సోమాత్మా నతులచ్యుత శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #154'
  prateepavallee:
  - text: |-
      అనురాగనిధానా!  మణిహార శోభితాకారా! 
      కనుసన్నల లోకమ్ముల గాచు సత్య సంధాతా
      మనువిన్ విను శేషాచల మాధవా! వరా! విశ్వా
      త్మ నృకేసరి రక్షింపుము తత్త్వసారమౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #576'
  pratibha:
  - text: |-
      చందనమ్ముల్ సింధూరములు శయమందు తెచ్చి సేవకై !భూ
      నందనమ్మౌ సప్తాచలమున నిడన్ వెలింగె ! వేంకటేశా ! 
      సుందరాకారా !శ్రీకర వసుధ నాయకా !యశోవిహారా !
      వందనమ్ముల్ కైమోడ్పుల సపరిచర్యలన్ లభించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #253'
  pratibhaa:
  - text: |-
      వైభోగ కళ్యాణ వైనముల్ పుణ్యమౌ
      సౌభాగ్య శేషాద్రి చందమౌ వేదికన్
      శోభాయమానమ్ము సుందరాకారమై
      రాభస్యమౌ నీదు రాసముల్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #257'
  pravaahikaa:
  - text: |-
      విలేపనమ్ముల్ ఫలమ్ముల్ నివేదించు సే
      వలందు నారాయణాత్మన్ శుభమ్మై హరీ
      సులోచనమ్మున్ దయార్ద్రుండ శోభాయమా
      న లాస్యమున్నేలి రక్షించు నన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #76'
  pravahlikaa:
  - text: |-
      రావణుని లంకయౌ నరుల్  
      జీవనములెంచ భారముల్
      భూవర విరాజితుండ నీ
      దీవెన విముక్తి శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #234'
  pravaravilasitamu:
  - text: |-
      వసంతోత్సాహానన్ భువన తిరుమలన్ వేల్పువై
      రసేంద్రమ్మౌ నిద్రాణ రణ సుగుణమై భక్తి పా
      ల సంద్రానన్ భావమ్ముల తరళ విలాపమ్ము లో
      క సంతాపమ్మున్ త్రెంచు కలిమి కొలువౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #170'
  priyaMvada:
  - text: |-
      ఇహము నీవను సహేతుకమ్ములన్
      సహజ సిద్ధమగు చంచలత్వమున్
      దహనమవ్వని ఉదార జన్మలన్
      సహనమివ్వు విరి శౌరి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #18'
  priyakaaMta:
  - text: |-
      అడగని కోర్కెల్ సఫలములందన్ మది పొంగున్
      మడుగుల కర్మన్ నిలిపెడు మా దైవమ చక్రీ !  
      కడపటి వేళన్ తలపున గానమ్మును నీవై
      దుడుకు తనమ్ముల్ నిలుపర తుంగమ్ముల శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #565'
    notes: yati/prasa relaxed, score=100%
  priyavachanamu:
  - text: |-
      రుణముల నీడేరున్ ఘాతమ్ముల్
      గుణముల కొండెక్కున్ పాపమ్ముల్
      వ్రణమగుచున్ భారమ్మై నిల్చెన్
      గణపతివై సాకారా ! శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #47'
  puMDareeka:
  - text: |-
      ఎన్నాళ్ళీ జన్మల హేల శ్రీనివాసా!
      కన్నీరుల్ పొంగెడు కర్మ సాగరమ్ముల్
      నన్నేలన్ రార సనాతనాత్మవౌచున్
      వెన్నుండౌ తిర్మల వేదసీమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #416'
  puraTi:
  - text: |-
      కలవర పాటులన్
      వలసల జన్మలన్
      గొలుసుల బంధమున్
      బలమువు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #120'
  pushpaa:
  - text: |-
      రాగంపు వేగాలన్  రసాధారలలోన్
      వేగమ్ము పోనివ్వన్ విరాగమ్ము నొగ్గన్
      సౌగంధ పద్యాలన్ సరాగమ్మునాపన్
      చేగూర్చు భావమ్మున్ జిదానంద శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #164'
    notes: yati/prasa relaxed, score=95%
  pushpadaama:
  - text: |-
      శ్రీదేవిన్ భూదేవి జతగ మనువున్ చేతనాచేత లీలన్
      చేదండల్ శోభిల్లు నవ వరుడవై శ్రీకరా వేంకటాద్రిన్
      తాదాత్య్యమ్మౌ దివ్య దిన విహరణన్ తారకమ్మై విహారీ
      వేదీ నిత్యానందమున నిలు హరీ విశ్వ సంధాత శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #633'
  pushpamaalaa:
  - text: |-
      కుదురునెరుగనైతి కోపమ్ము తోడై
      నదురు పొగరు జన్మ నాశమ్ము నింపన్
      బెదురు నొసగు దేవ !వేదాద్రి సూరీ
      మదుపు పథము నీదు మంత్రమ్ము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #439'
  raMbhaa:
  - text: |-
      ఏతెంచగ హరి సప్తాద్రుల్
      పూతమ్ముగ జగదానంద
      మ్మై తారగ సిరి దీపమ్మై
      ఖ్యాతింగనె వసుధన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #274'
  raMjanaa:
  - text: |-
      కలవరముల గభస్తి రూపమై
      కలకలముల కడాస్తి దీపమై
      కల కుదురుల కధాచనా పరా
      కుల కలతను కుదించు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #264'
  raNaSoora:
  - text: |-
      అజ్ఞానిన్ పరమార్ధ గతిన్ సాయమర్ధించు జీవాంశన్ చి
      ద్యజ్ఞాశ్వమ్మును బట్టగ నాపన్ యధేచ్చన్ సుసాధ్యంబౌగా  
      జిజ్ఞాసన్ హరి గొల్చెడి యోగిన్ చిరాగ్న్యధ్వ సత్సంధాయిన్  
      విజ్ఞానమ్మడుగన్ గలుగున్ దద్విధిన్ మమ్ము గావన్ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #529'
  raaNeehaasa:
  - text: |-
      తిరుమల మెట్లన్ దాస్యోద్దీపమ్మున్ నిర్మల భక్తిన్
      వరముల గట్లన్ విష్ణ్వా వాసమ్మున్ సాధన శక్తిన్
      గరిమలపైనన్ విశ్వాగారమ్మౌ తిర్మల దారిన్ 
      పరమున కాప్తిం జేరన్ భాగ్యమ్మందీయర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #567'
  raadhaa:
  - text: |-
      అక్షయమ్మౌ కల్పముల్ !శయ్యా ప్రభన్ సంసా
      రాక్షయమ్మున్ విశ్వధాతా రామ  శ్రీ ధారీ !
      దక్షతన్ సౌశీల్యమున్ సంధాన భూ నీవౌ
      రక్షకా !లోకమ్ము ముక్తిన్ రాసమౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #98'
  raadhikaa:
  - text: |-
      మురళీ కృష్ణుడ !ముగ్ధమనోహరా !
      సరళమ్మీవుగ !చందన శ్రీకరా !
      గరళమ్మీ భువి !గావుమ శ్రీధరా !
      తరళమ్మీయర !ధర్ముడ !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #287'
  raaga-1:
  - text: |-
      భోగులన్ కదుల్చు పోషకార్ధ పుష్యమై
      యోగులన్ రగుల్చు యోగ్యతార్ధ పుష్పమై
      బీగమై వశించు భేద మోద పుణ్యమై
      సాగులన్ ఫలించు సారమీవు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #303'
  raajabaalaa:
  - text: |-
      వికార దేహముల్ వెరుపున్ భీతి గీతన్
      నికార చేష్టలన్ నిలుపున్ ధాత్రి నిల్పున్
      వికాశ దీపమై వెలుగౌ ప్రాణదాతా !
      ప్రకాశమై పరాక్రమమై గాచు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #417'
  raajalakshmi:
  - text: |-
      సత్యాసత్యమ్ములన్ గోచార జాడ్యమ్ములన్
      నిత్యానందమ్ములన్ కన్నీటి రాగాంబుధిన్
      జాత్యాహంకారమున్ పెన్ జాల సంసార రా
      హిత్యాతత్వమ్ములన్ మాహేశమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #99'
  raamaa:
  - text: |-
      సంతోష హేలవౌ శ్రీరామా
      సంతాప గాలమున్ శ్రీధామా
      సంతుష్ట కారకా శ్రీశ్యామా
      సంతాన లోక ధాతా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #43'
  raamaanaMda:
  - text: |-
      ఇంద్రాస్త్రమ్ముల్ రుద్రాస్త్రమ్ముల్ బ్రహ్మాస్త్రమ్ముల్ హేలన్ సంశోభిల్లున్ విశ్వేశున్ శౌర్యమ్మై
      చంద్రాదిత్యుల్ తారాలోకమ్ముల్ దీపించున్ సప్తావస్థల్ శ్రీకాంతున్ వెల్గుల్ బింబమ్మై
      సంద్రమ్మౌ పాపోద్దీప్తిన్ చింతాక్రాంతమ్మౌ జన్మల్ ధర్మార్ధమ్మున్ నిల్చున్ శ్రీశున్ చింతన్
      మంద్రమ్మై గోవిందమ్ముల్ శేషాద్రీశున్ భూ మంత్రమ్ముల్ సంసారమ్మున్ మోక్షమ్మై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #705'
  rachanaa-1:
  - text: |-
      గళమున నీదు నామ సిరి గీతుల్ ఘనమై నినాదమై
      కళలన పైకళల్ మిళిత భక్తిన్ కదిలించు శస్త్రమై
      నళిన దళేక్షణా! శుచిర కీర్తిన్ నవనీత ధారలై
      జళుకు వశించు భీతి నిలు భూతిన్ సవరించు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #356'
  rachanaa-2:
  - text: |-
      సురుచిర సుందరేశ వసుధన్ లాలించెడి విలాసమున్
      గురుతర ధారణమ్ముగ కుబేరాత్మా విదిత మ్రొక్కులన్
      విరుల సముద్రమై నిలు విరించిన్ శంకర త్రిమూర్తులన్ 
      మరులను గొల్పు శ్రీహరి మనోజ్ఞంబౌ సిరుల శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #355'
  ramaNee-1:
  - text: |-
      విల్లును వీడిన బాణము భంగిన్ వేదన లల్లుకు పోవు జగమ్మున్
      నల్లని శిల్పమునెల్లెడ నీవై నాట్యములాడ మహేశ మురారీ
      చల్లగ శీతల గోత్రల లక్ష్మీశా వరముల్ ఫలముల్ కొలువున్ రా
      జిల్లుచు గావర సుందర మౌనీ !జీవన సారధివై నిలు శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #666'
  ramaa-raksha:
  - text: |-
      నటనల జీవనమున మూల్యమౌ వికర్మల్
      ఘటనల నిత్య గరళముల్ లిఖించు కర్మల్
      కటకములౌ నికర నియోగ పాతకమ్ముల్
      తృటిన శమించు కృపగ నిన్ను దల్ప శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #86'
  ramyaakRti:
  - text: |-
      రమ్యాకృతి సాకార రవమ్ముల్
      సౌమ్యగ్రహమావాస విలాసా
      కామ్యాధృవ వైరాగ్యమ శ్రీశా
      సమ్యాయమువౌ కాంచన శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #176'
  rasOdata:
  - text: |-
      అల్లాడెడు పద్య యాగమునీశుండు ఛంద భా
      వోల్లాస విజేత పుణ్య సుశీలుండు దక్షుడౌ
      కొల్లారపు వంశ కుందన ప్రాకాశ తేజమున్
      చల్లంగ తలంతు సాదరమున్ గూడి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #intro-5'
  rasaali:
  - text: |-
      శేష శైల హరి జీవధారా
      భూషణాత్మ ఘన పుష్పధారా
      దోషమెంచకు సుదూర తారా
      పోషకా !గనుమ పూజ్య శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #23'
  rasadhaaraa:
  - text: |-
      ఘటనల గాలమ్మున గడువుల్ ముంపున్
      నటనల నాట్యమ్ముల నర లాస్యమ్మున్ 
      కిటుకుగ నీ రూప నిఖిల తేజమ్మై
      జటిల సమస్యల్ పలుచనలౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #463'
  rasana:
  - text: |-
      శ్రీనివాసుడ !నీదు పదముల్ చిత్తమందునిడి భూ జీ
      వానురక్తిని కూర్చితి సిరిన్ పద్య ముక్తి పథ రీతిన్
      పూని నిల్పితి విష్ణు కృపలన్ !పుణ్య కావ్యమున భావ
      మ్మై నివేదిత సారముగ సామంతమై వెలుగు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #intro-1'
  - text: |-
      ఏడుకొండల వేంకట హరీ !హేల చూపర మురారీ
      వేడుకొందును నీదు పథమున్ వీడజాలని తటిన్ మా
      రేడువై నరలోక గిరులన్ లిప్త దర్శన విహారీ
      మోడువారిన జీవుడను సమ్మోహనా ! గనర శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #689'
  rasikarasaalaa:
  - text: |-
      కటిక నలుపు శిలవై కరుణాద్రిన్ సుమ మాహేశ కలిమి కమలాక్షా !
      చిటుకల చిరు పిలుపున్ సిరితోడై వరదాయీ శుచి పథ జితమీవై
      పటిమనడరు బలిమిన్ పరమార్ధమ్ముగ కారుణ్య వరద ! పరమాత్మా!
      ఘటనల ఘటికుడవై గరుడాద్రీశుడ రోదించు గతిని గను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #390'
  rati-surati:
  - text: |-
      ఘనకీర్తిన్ నిలు గరుడ గమనా మా
      యని దీప్తిన్ విజయ మురహరివై ని
      ల్చిన కృష్ణా సురుచిర తనువిలాసా
      వినతుల్ చేయుదు విమలయశ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #225'
  ratilaekha:
  - text: |-
      సిరితోడుత తిరుమల శిఖర చిరవాసీ
      పరిపాలక జనహిత పథగ సుమధారీ
      వరదాయక !  సతత తపముల నిలు సూరీ
      శరణాగతి నిడర దశ దిశలను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #572'
  ratileelaa:
  - text: |-
      ప్రధాన గిరి గోవిదాంపతిగ సుప్రభాత నిలయానన్ 
      నిధాన సిరి దర్శనమ్ములిడు వెన్నెలాత్మ విమలాత్మా
      సుధారస నివాసమౌ తిరుమలన్ సురేశ గరిమన్ సం
      విధాన చెలిమిన్ వరమ్ములిడు భావితమ్మమర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #137'
  ravOnmukhee:
  - text: |-
      సులభుడవై సుశీలుడా !
      మెలకువ నిల్పు జీవులన్
      నిలువర పంచభూతమై
      గెలుపు నొసంగి! శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #231'
  roopaamaalee:
  - text: |-
      దైత్యాళిన్  చంపున్ నీ తేజమ్మే 
      సత్యాంతర్యమ్మున్ భావార్ధమ్మున్
      ముత్యమ్మౌ మోక్షార్ధమ్మున్ నీవై
      నిత్యాత్మా!వేదాద్రీశా !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #232'
  ruchiraa:
  - text: |-
      చిరుత నవ్వుల గిరీశా
      విరుల మాలల నరేశా
      పరముడా !తిరుమలేశా
      వరదుడా గనుమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #181'
  ruchiramu:
  - text: |-
      నరోత్తమా !తిరుమల నారసింహమా
      సురోత్తమా !గరిమల సూర్య తేజమా
      గురూత్తమా !విదురుల కూర్మి నైజమా
      చరాచరమ్ముల నిలు శౌరి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #79'
  ruchiravibhrama:
  - text: |-
      భక్త జనల పదముల విభావరుల్
      రక్తి యగు కలతచెదురు రాగముల్
      శక్తి నొసగు చలపతి సుకీర్తనల్
      ముక్తినిగమము పుడమిన శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #97'
  ruchivarNaa:
  - text: |-
      అనంత శయనా !హరీ !తిరుమలేశా !
      సనాతన విలాస విశ్వ లయకారా !
      మనోహరుడవై మహత్తులిడు భూలో
      క నాయకుడవై కదాచనుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #418'
  rukmavati:
  - text: |-
      ఆత్రముల్ సంతాప సూత్రమ్ముల్
      పాత్రలౌ సంసారమన్ వార్ధిన్  
      గాత్రమున్ నీ నామ గీతమ్ముల్
      మాత్రమే మోక్షమ్మిడున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #237'
  sRtaSikhaa:
  - text: |-
      తోపెల్ల సుశీలాత్ముని సంతుష్ణుని నుతియింతున్
      సోపాన సుపద్యార్జన నీశుండగు గురుదేవున్
      వ్యాపించెడు ఛందో ప్రభలన్ వాణికి సుతుడై సం
      దీపించెడు సమ్రాట్టును శోధించు కృపను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #intro-6'
  - text: |-
      ముక్కోటి సురల్ నీ వెలుగై మోక్ష పథమునందన్
      చుక్కానిగ మార్గమ్మును సంశోభిత హరి భక్తిన్
      దక్కించర వైభోగములన్ ధర్మనిలయుడా రా
      లెక్కించని పాపమ్ముల పాలెంచక గను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #695'
  saMbuddhi:
  - text: |-
      ఋజుతత్వమ్మై ద్యుతివౌచున్ 
      విజయమ్మై భాసిలు గోవిం
      ద జపమ్ముల్ తిర్మల దంతిన్
      నిజమంత్రమ్మై నిలు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #115'
  saMhatikaa:
  - text: |-
      జగదీశ !చల్లని చంద్రుడా
      నగధీర !నల్లని రాయడా
      యుగపాల !యోగ విశేషుడా
      తగు నేర్పు దాతవు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #51'
  saadhvi:
  - text: |-
      పావన జయజయ వైష్ణవ తిరుమల భాగ్యనిలయుడ విభాకర సూరీ
      దీవన లిడు జగధీశుడ కనుమల తీర్ధమున మెరయు దివ్య విధాతా
      రావణునదిమిన రామ విభవమున లాలసల దునుము రాఘవ శూరా
      భావిత సిరుల నివాసుడ వరముల వడ్డనల నడరు పాశమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #160'
    notes: yati/prasa relaxed, score=90%
  saakshee:
  - text: |-
      వ్యవసాయములౌ పరార్ధ జాలమ్మున్
      నవచంద్రికలౌ నరార్ధ జీవమ్మున్
      ధవళాచలమున్ ధనాధి నాధుండై
      రవళించుమ నారసింహమా !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #61'
  saaraMgaM-Syaama:
  - text: |-
      తిమిర శరాఘాతముల్ త్రా
      సము కలిగించెన్ భువిన్  జ
      న్మ మరణ బాధా వ్యధాళిన్ 
      శమనమిడన్ రార శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #281'
  saaravatee:
  - text: |-
      అండగ మ్రొక్కుల యాగమున మున్గంగన్
      మెండుగ పున్నెము మేలుకొలుపుల్ దక్కున్
      నిండుగ కర్మను నిల్పు హరి వాసమ్మున్
      తాండవ కృష్ణుడ తారకమువౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #458'
  saardha-padaa:
  - text: |-
      అప్పులన్ విషాహార విధమ్మనెంచకన్
      నిప్పులౌ గతిన్ నిల్చు చిరాగ్ని మంటలన్
      తిప్పలన్ పరాధీన వికర్మలన్ జనుల్
      ముప్పులౌ రుణామోదములార్చు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #123'
  saaree-suMdari:
  - text: |-
      శుభదాయక వేదాంతపు సిరివై జ్యోతిర్మయ తేజమువై సౌ
      రభ మాలివి వేదాద్రి నిలయుడా !రామాత్మసరూప !మురారీ !
      విబుధాధిపతీ !వేంకటగిరి సర్వేశా !దయజూపర !శ్రీశా !
      ప్రభవించు పరాభక్తిని లయమై రాజిల్లు పరాత్పర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #659'
  saariNee:
  - text: |-
      ఊయలూపెడి విలాపమున్ యుగ విశోకమున్
      మాయనాగని సజీవమున్ మసలు మైకమున్
      సాయమౌచు జగధీశమై సమర కృష్ణమై
      ధ్యేయమున్ నిలుపు విష్ణువున్ తెలచు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #326'
  sahaelikaa:
  - text: |-
      సహేతుకమ్ముగ మ్రెక్కులన్
      సహోక్తి వాద వివాదమున్
      సహాయకారిగ దిక్కువౌ
      విహార వెన్నుడ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #229'
  sahajaa-chaarulOchanaa:
  - text: |-
      గరుడాద్రిన యోగమై చరా
      చరముల్ కలిమై జపార్ధమౌ
      పరమాత్మ సరూప తత్వముల్
      ధరణీగిరి పూత శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #44'
  samaahitaM:
  - text: |-
      పరవశలోకపు లాలన శ్రీపతి మంత్రము వేంకట నాథుడ! వేదాం
      త రవళి కూర్పున వెల్గెడు పూత నొసంగు విశేషము నీదు పదమ్ముల్
      పరితపమున్ నిలు పావన వైభవ విష్ణు రవమ్ము నియోగ ఫలమ్మై
      హరిణములై తరళాస్త్రములై  యశమై పరమాత్ముని జేర్చును శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #701'
  samayaprahitaa:
  - text: |-
      మహిమాన్విత ధామమై తిర్మలాద్రుల్
      విహరించు హరిన్ విలోకించు శోభన్
      మహదేవుని ధామ బ్రహ్మోత్సవమ్మున్
      మొహరించు భువిన్ ముదమ్మంద శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #394'
  sarOjaavaLee:
  - text: |-
      సదానంద సద్యోజాత లక్ష్మీపతీ !
      పదానంద పద్యాపద్య జీవాత్మ నా
      రదానంద సత్యాలంకృతమ్మై విశా
      రదానంద ముక్తిన్ లబ్ధి వౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #276'
  saraavikaa:
  - text: |-
      అనన్య భక్తి సాహచర్యమున్
      వినూత్న యుక్తి శోభితమ్ములన్
      వినీల కాంతులన్ విశిష్టమౌ
      ఘనాత్మ ! విశ్వమౌగ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #422'
  sarasaaMkamu:
  - text: |-
      జనకోటి వేచె వరదా శరణమ్ము గోరన్
      నిను జేరి మ్రొక్కులనిడన్ నిగమాంతవేద్యా ! 
      కనుమా !విషాద గతులన్ కథనమ్ములెల్లన్ 
      వినుమా !జనార్ధన ! పరాకులు వాణి !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #551'
    notes: yati/prasa relaxed, score=100%
  saraseeruhalOchana-jagadudaya:
  - text: |-
      తమతమ తపనల కతలన కదులు జీవులన్
      సమయములెరుగని వసతిన చెలగు దేహమున్
      మమతల కమతములమరక నిలుపు కర్మలన్
      కమల నయనుని దరి కరుణ దొరుకు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #353'
  sarasi:
  - text: |-
      ఆరంభమ్మేదో కడయేదో
      తారంగమ్మేదో నిజమేదో
      భూరంగమ్మందున్ తమ పాద
      మ్మే రమ్యమ్మౌ ముక్తికి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #112'
  satkaetu@h:
  - text: |-
      నిత్యావాస ధరణి గుణిని జన్మ చక్ర జాతకమ్మున్
      సత్యాక్రోశమున నలుగు సనాతనాత్మ కల్పితమ్మున్
      నిత్యానంద నిలయుని కనికార వీక్షణన్ విరాగిన్
      నిత్యోత్సాహమలరు హరి నియుక్తుడన్ సుశీల శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #626'
  seetaa:
  - text: |-
      వీత రాగమ్ముల్ సజీవమ్మై విశోకమ్ముల్ గడిన్
      భీతి తాళమ్ముల్ నినాదమ్మై విలోకమ్ముల్ గుడిన్
      రాతి యోగమ్ముల్ నిపాతమ్మై రసోద్ధారల్ సుడిన్
      నీతి వేదమ్ముల్ వరమ్మౌ శ్రీనివాసా !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #154'
  shaTpadaeritaM:
  - text: |-
      తరములన్ తరాంతరములన్ తరించు తర చక్రమున్
      ధరణి సీమలన్ తలములన్ ధరించు సుమ ధారణన్
      పురములన్ సజీవ చరముల్ పునీత శత జన్మలన్
      పరమువై పరోక్షహరివై వశించు తిరు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #404'
  siMdhusauveeraM:
  - text: |-
      ఇంద్రజాలమ్ములాద్యంతమై హీరకమ్మౌ యశోశృంగముల్
      చంద్రలోకమ్ములాసాంతమై సంద్రమౌ ఛార్మిళమ్ముల్ ప్రభన్
      మంద్రగోవిందనామమ్ము సామంతమై రాగ యంత్రమ్ములన్
      సాంద్రమౌ నవ్య వైకుంఠమై జీవనాధారమౌ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #191'
    notes: yati/prasa relaxed, score=100%
  siMhapuchChaM:
  - text: |-
      నియోగమ్ములన్ పుణ్యమై నిత్య సౌభాగ్యమందన్
      వియోగమ్ములన్ వేదనల్ భీతినిన్ బాపు శక్తిన్   
      దయామూర్తివై శ్రీహరీ !  తత్త్వ  మార్గమ్ము జూపన్
      నయమ్మై జనానంద కందమ్ము నీవయ్య శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #542'
  siMhavikramamu:
  - text: |-
      రాజహంసవౌచు రాజ్య రక్షకై విదిల్చి నీటిన్ 
      రాజసంపు పాలనుంచి ప్రాభవమ్ము బెంచు రీతిన్ 
      రాజమార్గమందు సానురాగ బావపూరమై వి 
      భ్రాజమానవీయ శక్తి బంచు తారకమ్ము !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #591'
    notes: yati/prasa relaxed, score=96%
  siMhavisphoorjitaa:
  - text: |-
      ఆధారమ్మై గోవిందమ్ముల దీప్తిన్ యాగమౌ వేంకటేశా !
      సాధుత్వమ్మున్ సౌశీల్యమ్ముగ కాంతిన్ శక్తివై సారభూతా !
      సాధింపుల్ వేధింపుల్ జన్మనియోగిన్ చందనాత్మా విహారీ!
      మాధుర్యమ్మౌ వేదాద్రీశుని చింతన్ మాలిమిన్ నిల్పు !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #629'
  sivaMgi:
  - text: |-
      దీపాలంకృత సేవల్ మెరయు తీర్ధమ్మై మహత్తుల్ నిడున్
      ధూపమ్ముల్ నివురై పాతక సుదూరమ్మౌ జగత్తుల్నిడున్
      చాపమ్మై హరివాసమ్ము నవ చైతన్యమ్ము సారించు భూ
      తాపోద్రిక్త విముక్తుల్ పొసగు తధ్యమ్మై మహిన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #192'
  smRti:
  - text: |-
      చలింప జేసెడు జననమ్ములన్ ప్ర
      జ్వలింప జేసెడు జప బాధలన్ గౌ
      గిలించు కర్మము కిరణమ్ములోలన్
      ఫలించు ధర్మ తపనవీవు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #326'
  snaehalataa:
  - text: |-
      యోగుల మోక్షార్ధ యుగార్తిన్ మూర్తివై
      భోగుల వైభోగ పునీతార్ధమ్మువై
      దాగెడి విశ్వేశ తరంగానన్ యశో
      రాగమువౌ ధీవర ప్రీతిన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #193'
  snigdha:
  - text: |-
      నీ మృదు స్తోత్రమ్ముల్ భూమిన్ నా
      మామృత గానమ్మై మంత్రమ్మై
      భూ మృత ప్రాయమ్మౌ జీవిన్ పం
      చామృత ధారై నిల్చున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #283'
  sphOTaka:
  - text: |-
      అతకని జన్మన్ జీవమ్మున్  యాగమ్మున్ భోగమ్మున్
      కతకని కర్మన్ వాసమ్మున్ కైవల్యానన్ నిల్పన్ 
      సతతము భక్తిన్ బ్రార్దింతున్ శక్తిన్ గోవిందమ్మున్
      సతత సుగీతుల్ ధ్యానమ్మున్ సాఫల్యమ్మౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #192'
  sraeMdra-vajra:
  - text: |-
      ఆసక్తులాసక్తుల దీపమౌ వేంకటేశ్వరా యాతన బాపరా వే
      దాసక్తి నిర్వేదములన్ ప్రభేదించు శక్తివై తారక మంత్రమీవై
      వాసమ్ములాసక్తిని పెంచి దీవించు వేల్పువై వాసిత చక్రధారీ
      దాసానుదాస్యమ్ముల నిల్చు శేషాచలేశ్వరా !దర్శన మీయు శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #661'
    notes: yati/prasa relaxed, score=100%
  - text: |-
      వాతా విఘాతమ్ముల కల్పమున్ లిప్త జీవకోటిన్ నిలు ప్రాణమై సం
      ధాతా ! యశోధారణవౌ విహారీ !ధరిత్రి సంతాపములన్ విభక్తిన్
      పూతాత్మ వై వేద విహంగమై మెప్పులన్ ప్రకాశించు విభాకరా !సం
      జాతమ్ములౌ కర్మ విలాసముల్ త్రెంచ వేల్పువై దీవన లీయు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #662'
  sragdhara:
  - text: |-
      ఆయాసమ్ముల్ నియోగిన్ యమక గడువులన్ యాగగుండమ్మునగ్నిన్ 
      భూ యానమ్మున్ చిరాగ్నిన్ పుడమి చివుకునై పుణ్యమున్ కోరు దేహిన్
      న్యాయాన్యాయమ్ములన్ గానని కలియుగ హీనమ్మునై జన్మ వెల్గున్
      ప్రాయోజ్యమ్మౌ జనుండన్ పలుకర హరుడా !పద్మనాభుండ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #655'
    notes: yati/prasa relaxed, score=100%
  sragviNi:
  - text: |-
      వేంకటాద్రీశ్వరా వేద నారాయణా
      పంకజాక్షా విరూపాక్ష విశ్వేశ్వరా
      సంకటమ్ముల్ జరాజన్మ దఃఖమ్ములన్
      జంకులన్ శక్తివై సాయమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #30'
  suSeelaa:
  - text: |-
      త్రిగుణముల త్రికరణంపు శుద్ధిన్
      సుగుణముల శుభకరంపు వృద్ధిన్
      నిగమముల నియమ సత్య సిద్ధిన్
      సుగమమగు సులువునించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #361'
  sudhaavaeli:
  - text: |-
      కపట విలాసమ్ముల్  లోక నయమ్ముల్  సుమధారీ
      కుపిత ప్రలోభమ్ముల్ శోక తలమ్ముల్ ధనుజారీ
      కపి వరదాయీ రామా ! కరుణన్ జూడర దాసున్
      తపనల ముంపున్ దేహిన్ తరళమ్మీయర శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #564'
    notes: yati/prasa relaxed, score=100%
  sugaMdhi:
  - text: |-
      నెపముల్ కలిసిన జీవిన్
      తపముల్ కుదరని భూమిన్
      జపముల్ తెలియని బుద్ధిన్
      కృప జూపర హరి !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #116'
  sugaMdhi-4:
  - text: |-
      వాయుదేవుడాదిశేషు వాగ్వివాద ఘట్టమున్
      మాయపోరు తేర్చె దివ్యమైన వేంకటాద్రులై
      రాయిరప్ప నిండుకొండ రాచవాసమై విభన్
      భూ యశో విలాసమౌ విభూతి నిల్చె శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #31'
  sukaesaramu:
  - text: |-
      పదములు చాలు జీవితపుపాసనాస్త్రమై
      కదనమునేలు సార్ధక వికాస మంత్రమై
      పదునుగ పల్కు నారద ప్రపద్య నాదమై
      చిదుము మతిన్ ప్రసాదముగ జేరి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #321'
  sukakhasaara-2:
  - text: |-
      శబ్దములెల్లన్ ప్రణవమ్ముల్ సనాతన వరమ్ముల్ 
      శబ్ద నినాదమ్మిల పొంగున్ చరించు గళ శక్తిన్ 
      శబ్ద విరాగమ్ముల మంత్రాస్త్రమై హరి రవమ్మై
      శబ్ద సరాగమ్మగు సత్యేశ ! నీ పదము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #581'
  sukarNapooraM:
  - text: |-
      కమలలోచనా కథాచనా విహారీ
      విమల సీమవౌ విలోక విష్ణుతేజా
      నమక రుద్రుడా నవీనుడా విధాతా
      సుమ విభూషణా సురక్షవీవు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #14'
  sukhaSailam^:
  - text: |-
      పక్షీంద్రుండన్ నిజపాదమ్ముల నీడన్
      యక్షుండన్ శ్రీహరి యాత్రన్ శకటమ్మున్
      దక్షుండన్ విష్ణుకు దాసుండ మురారీ
      సాక్షీభూతమ్ముగ సారమ్మవు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #415'
  sukhaanaMda-prasoonaaMgee:
  - text: |-
      నిగారమ్ముల్ సిరుల్ నీరాజనార్ధమ్మున్
      జగద్ధారాళ పూజాగంధమై లాభ
      మ్ము గంగాదత్త సమ్మోదమ్ములౌ కృష్ణా   
      సుగానమ్మున్ ప్రభన్ శ్లోకమ్ములౌ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #388'
  sukhaelaa:
  - text: |-
      వరదోభవా !పరేశుడా గా
      వర వేల్పువై !భవాంతరమ్మై !
      శరణోభవా !జగమ్మువౌ భూ
      వర శ్రీధరా !భవాత్మ !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #66'
  sukshamaa:
  - text: |-
      అణువణువున సాయమ్మై సచేతనై
      గుణ వితరణలన్ గోవిందమై తమో
      గుణ తపనగిరుల్ గోపాలమై యశో
      రుణముల సిరివౌ లోకాత్మ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #90'
  sulOchanaa:
  - text: |-
      సంతాపములేల భూమి నా
      సాంతమ్మున లీలలన్ యశో
      క్రాంతమ్ముగ వాసుదేవుడే
      శాంతమ్మిడి నిల్వ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #230'
  sulalitaa-2:
  - text: |-
      ఇల నిలయమౌ తిరుమలాగ్రానన్ హిరణ్మయ వాసుడై
      కలవరములన్ సుర పరంజ్యోతిన్ కటాక్ష మహేశుడౌ 
      కలియుగ లయన్ విలయకల్పానన్ ఘనాఘన ధర్ముడై
      పలుకెడు హరిన్ కొలిచెదన్ ప్రీతిన్ వరంబుగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #197'
  sumati:
  - text: |-
      గగనసీమలన్ గరుడ విహారా
      జగడపుంభువిన్ చతురత నీవై
      నెగడు కర్మలన్ నిలుపగ రా రా
      సుగమమీయరా !సులభుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #136'
  suraakshee:
  - text: |-
      మరపు వలల్లో మనోదీపా
      తెరిపి కలల్లో దిగంతమ్మై
      కరుణను జూపున్ గభస్తీ నీ
      సురుచిర నామస్తుతుల్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #178'
  suraanaMda:
  - text: |-
      విగంధమ్ము నర దేహ విలయమ్ములోన్
      సుగంధమ్ము సురలోక సుమ ధారణౌ
      నిగందమ్ము లతలౌ జనిత జన్మలన్
      దిగంతమ్ములిడు సన్నుతిగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #424'
  surabhoojaraajamu:
  - text: |-
      కలియుగమ్మున తోడువై నవ గమనముల సమవర్తివై
      పలుకులందున తేనెవై గళ పరవశ సతత భక్తివై
      తలపునేలెడి రాజువై మతి తళుకుల యజన శక్తివై
      సులభుడౌ హరి తేజమై భువి సుమభరితుడవు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #56'
  suruchi:
  - text: |-
      తగరమడరు భూతసహితమౌ ఘాతానిలయమున జతన దేహమ్ముల్
      నిగమ సుగమమౌ నిరతమ భక్తిన్ నింపు హరిపదమునిడు సాధ్యమ్మున్
      గగన కిరణ తీగల మెరుపున్ గంగాజల కెరట నికర పాద్యమ్మున్
      చిగురు సుమమునై చెలగు విముక్తిన్ శ్రీహరి పదజల చినుకున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #380'
  suruchiraa:
  - text: |-
      చరించలేనిక శరణార్ధిన్ కదానన్ 
      భరింపలేనిక పరదేహంపు యాత్రన్
      ధరిత్రి జీవన తమసమ్మున్ తపమ్మున్
      స్మరింప జాలని చరితన్ దేర్చు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #398'
  sutalaM:
  - text: |-
      అవికారాయ విస్మయ రూపమ్ములన్
      సవితన్ ధారణల్ దశమోధ్యాయమై
      పవితన్ వాసుదేవ భవమ్మై జగ
      ద్రవియై సంభవించు రథీ !శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #288'
  suvaktraa:
  - text: |-
      కురిసెడు సేవలన్ కుశాగ్ర సీమవై
      వరముల వర్షమున్ పరంజయాత్మవై
      మురిసెడు దర్శనమ్ము రెప్పపాటులన్
      చెర విడుపౌ ప్రపూజితమ్ము శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #88'
  suvarNaruchira:
  - text: |-
      ఇంద్రాది దేవతల భూతిన్
      చంద్రోదయమ్ముల విభూతిన్
      సంద్రమ్మువై తపన శృంగిన్
      చంద్రా !విముక్తి నిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #24'
  svarNaakshi:
  - text: |-
      ఆక్షేపించు లోక జలధిన్నలవౌ మహేశా
      సాక్షాత్కార సారముగ భూషణజేయు శైలిన్
      వీక్షావిభ్రమమ్మువు హరీ !విరిలోకదీపా
      సాక్షీభూతమై జగతి నిశ్చలసీమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #198'
    notes: yati/prasa relaxed, score=100%
  svaravarshiNee:
  - text: |-
      జనులెల్లరున్  జగమందనిత్యంబౌ  
      ధనసంగ్రహార్ధము జీవనంబీడ్చన్ 
      ఘన మైన చీకటిలో శుభాంగా చ 
      క్కని దీపమై కనవయ్య  శ్రీ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #215'
    notes: yati/prasa relaxed, score=95%
  svinnaSareeraM:
  - text: |-
      శ్రీనిలయా !భూపతీ !శ్రీనివాసా !హరీ !
      శ్రీనిధివౌ !వెన్నుడా !శ్రీశుడా !శ్రీవరా !
      శ్రీనిజ వాసుండవై !శ్రీధరా !శంకరా !
      శ్రీనగవౌ !భూధరా !శ్రీకరా !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #301'
  taaMDavajava-1:
  - text: |-
      జవసత్వముల వెలుగు పురుషార్ధ గుణమువై భూ
      ర్భువనత్వముల చతురత శుభాంగ జతనమై నీ
      రవ జాలముల పొలుచు నవలాస్యముల వనమ్మై
      భువినేలెడు తిరుమల గిరి పూజ్యుడ !గను !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #455'
    notes: yati/prasa relaxed, score=100%
  taamarasamu:
  - text: |-
      గగన నిశీధి నిగార వినీలా
      జగతి సునీల విశాలపు నింగిన్
      సగటు విముక్తిని సత్య పథమ్మున్
      తెగని ప్రబంధ గతిన్నిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #167'
  taarakaM-taaraka:
  - text: |-
      హరిచందన చర్చిత హారతులందున్
      విరి మేఘమువై నిలు వేంకటరామా
      సిరి తోడుత కొల్విడి చింతల దీర్చన్
      పరమాత్ముడ రా !గను వాసిత శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #464'
  talpakatallajaM:
  - text: |-
      లాలస లౌకిక భూమిని సిద్దుల పొందని విరాగినౌ నిల్పున్
      కాలము చెల్లని కారణ కర్మ కథాంగముల నాట్య రంగమ్మున్
      గాలము నీ పద చింతన మెండుగ పుణ్యఫలముల్ ప్రసాదించున్
      మేలిమి సీమల జేర్చి తపమ్ము మిగుల్చు పరమాస్త్రమై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #648'
  talupulamma:
  - text: |-
      పావన గోవింద నామమ్ము భాగ్యములనిడు జీవితమ్మున్
      చేవ నొసంగున్ విలాపమ్ము జేరు సమయములన్ శరమ్మై
      నావగ తీరమ్ము చేర్చున్ సనాత తిరుమల వాసునిన్ నా
      నా వగలన్ త్రెంచి రక్షించు నందన తిరుమలేశు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #632'
  tanumadhyamaa:
  - text: |-
      యదార్ధమ్మున్ భక్తిన్ దయాసంద్రమున సంచయమ్మౌ విధిన్  
      పదార్థమ్మౌ వ్యాప్తిన్ సుపాద్యమ్మున జ్వలించు పాతమ్మునై
      విదారమ్మౌ దీపించు భేదమ్మున కృతిన్ వివేకమ్ములన్
      నిదానమ్మున్ పూజించు నిర్వేదకుడ రాణ్మణీ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #345'
  tanvee-2:
  - text: |-
      ఏ శ్వాసన్ వీడన్ హరిపద జపమున్ హేలగ నింపుచు నిజ పరమార్తిన్
      నిశ్వాసమ్మున్ నిల్పి కొలుతు భవుడన్ నీడగ గాచెడు తిరుమలమూర్తిన్
      విశ్వాసమ్మున్ చేరి నిలిపెద మదిన్ ప్రీతిని గూర్చెడు కనుమలకీర్తిన్
      విశ్వాకారా !వేంకట రమణుడవై వేదన దీర్చుమ మురహరి శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #20'
  tanvi:
  - text: |-
      సాధన తాధ్యాత్మికతన వివశావాసుడనై తిరుమల గిరియందున్ 
      శోధన మిథ్యాగతి విడుపును దాసోహ వియోగములనడరితిన్ భూ
      నాధుడ విద్యావినయముల ప్రభన్ నాద నివేదనల రుచిర గీతుల్
      యోధన సల్పన్ హరి పదముల సద్యోగము పట్టితి విడువక శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #130'
    notes: yati/prasa relaxed, score=100%
  taralamu:
  - text: |-
      కుసుమ మేఘమ వేంకటాద్రిన కుందనాద్రిగ శిల్పమౌ
      వసిత భూతమ సంచరాత్మవు వాసుదేవ సుధాకరా !
      భసిత సంకట వేల్పువై జనపాలకా సురపూజితా !
      మసకబారు నరాలయమ్మున మాన్యతన్నిడు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #358'
  tarali:
  - text: |-
      ఈశుడ పరమేశుడ జగధీశుడ గరుడేశుడా
      రాశుల పెనుసూర్యుడ ఘనలాస్యుడ నరసింహుడా
      వాశిత జనకోటుల జగపాలుడ తిరుకోవెలన్
      దాశరథి సరూపమలరు తారకమువు, శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #12'
  taravaarikaa:
  - text: |-
      శత కుసుమహారములన్ సహస్ర శుభంకరా
      మితములమితమ్ముల భూమినేలు విభాకరా
      గత విలయపాతకమున్ కదుల్చు పురంధరా
      సతత మహిమాన్వితమౌ శతమ్మిడు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #166'
  taruNeevadanaeMdu:
  - text: |-
      తొలిరోజుల బాల్యములన్ తొలగించని ప్రాయపు లీలన్
      మలిరోజుల పాపములన్ మరపించని నాటిన కర్మల్
      కలతల్ కడుశోకము తాకగ నీ శరణిచ్చిన దేవా !  
      బలవర్ధకమౌ హరి పావన నామమె దిక్కగు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #258'
  tata:
  - text: |-
      రగులు వెతల కారాగారమ్మున్ వర
      మ్ముగ హరిపద సొమ్మున్ సంప్రాప్తమ్ములన్
      సుగుణమొసగు విశ్వోద్దారాస్త్రమ్మువై
      మిగులు నిడు సమీక్షా సాక్షీ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #297'
    notes: yati/prasa relaxed, score=100%
  traataa:
  - text: |-
      తేజోమయ క్రాంతిన్ దిగంతమ్ముల్ వ్యాసాత్మా
      రాజా విరిరాజా !రమాకాంతా !సర్వేశా !
      పూజాసుమ మాలన్ భురిక్కున్ పెన్ జీమూత
      మ్మై జాగృతి దీపా !మహాత్మా !దక్షా !శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #423'
  trilOkagaamee:
  - text: |-
      కౌమారమ్మున్ జరామయమ్మున్
      మీమాంసమ్ముల్ వియోగ సంధ్యన్
      ప్రేమాకారా !విశేష మాయా
      ధామమ్మున్ రక్షవీవు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #233'
  tripuraari:
  - text: |-
      ముడుపుల మ్రొక్కుల్ మునకల శోభల్ మురిపెమొసంగున్
      గడువుల లెక్కల్ కలవర చిక్కుల్ గరిమల చేర్చున్
      దుడుకు వికర్మల్ తుళుకు వరమ్ముల్ దునుము నిరాశన్
      కడకు శుభమ్మౌ కనకపు సీమన్ గతినిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #616'
  turagamu:
  - text: |-
      సతమత వెతల గతులగు నరుల జన్మ జీవన చక్రమున్
      గతముల కతలను భవితనదుమ కర్మ సాధన చట్రమున్
      మతమభిమత మితముల మతులన మర్మ గర్భ పరాక్రమున్
      చతురత వరముగ నొసగెడి ఘన జాలమీవుగ, శ్రీపతీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #399'
  tvaritapadagati:
  - text: |-
      వరుస పిలుపులనులికి పడక కులుకు ధీమం
      త రమణుడ గతుకుల వెతల నలతల పొంగా
      రు రజిత కవచమగు నరుల కమతపు జన్మన్
      వరదుడ !పరమమునిడి వలస నిలుపు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #426'
  uMdari:
  - text: |-
      వేంకట గిరీంద్రుడా
      సంకట నరేంద్రుడా
      సంకుల సురేంద్రుడా
      శంకరుడ !శ్రీపతీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #269'
  udaraSree:
  - text: |-
      ఇసుమంతగ చోటుల్ చాలున్
      భసితమ్మగు భోగమ్మేలన్
      వసివాఱని సాన్నిధ్యమ్మౌ
      వసుధాధిపు చెంతన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #172'
  udgataa:
  - text: |-
      ఘన సింహవాహన గమనాన వేంకటేశ్వరా
      జన సాగరమ్మున చరాచర విశ్వజేతవై 
      వన రాజవౌ నర వనమ్ముల నారసింహమా
      పెనుయుత్సవమ్మున విభమ్మును గూర్చు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #174'
    notes: yati/prasa relaxed, score=93%
  ujjvalaa:
  - text: |-
      ఇనకుల జగదీశ్వర వేంకటా
      ద్రి నవ విభములీను శుభాంకరా !
      ధన బలముల తారక శౌర్యమౌ
      ఘన హనుమను గాంచుమ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #266'
  ulkaabhaasa@h:
  - text: |-
      ప్రాయశ్చిత్తమ్ముల్ తరుగు సంభారమ్మున్ భూ
      ప్రాయమ్ముల్ పొంగారు వెలుగున్ ప్రాకారమ్మై
      ప్రాయోజ్యమ్మౌ దేహముల సంప్రాప్తిన్ లీలన్
      ప్రేయస్సుల్ వర్షించు హరివై ప్రీతిన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #471'
  upachyuta:
  - text: |-
      కమల నయన శ్రీధరా
      సుమ శతధర శ్రీకరా
      విమల శుభద భాస్కరా
      శమనమునిడు శ్రీపతీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #232'
  upadhaanam^:
  - text: |-
      ప్రభాత తెరగున విప్రగళమ్మున్
      శుభోదయ జతనమై శుభగీతుల్
      శుభాంగుని నిలయ భాసురమై సు
      ప్రభాతము మెరయు విభ్రమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #39'
  upadhaayyaa:
  - text: |-
      గట్టున నిలిచి కనికట్టున్
      పట్టును విడక వర బెట్టున్
      కట్టుగ మెరయు గరుడీశా
      పుట్టు కల గెలుపుగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #183'
  upalaekhaa:
  - text: |-
      కమలాక్షా !నమకమున శంకరా
      విమలాక్షా !సురభిముఖ భాస్కరా
      శమనాక్షా !మతిజగతినీశ్వరా
      సుమ సంభాజన ! సులభ !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #286'
  upamaalinee:
  - text: |-
      కటువు గమనముల్ చీకటిన్ నిలు జన్మలన్
      గుటక దిగని గొంతున్ కుదించు విషమ్ములన్
      ఘటికుడ గరుడాద్రిన్ గభస్తి ప్రకాశుడా
      చిటుకున గొనిపో సంచితార్ధిని శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #135'
  upasaMkulaa:
  - text: |-
      జనకోటి పాశమై వీక్షణ
      మ్ము నయమ్ము సొమ్ము దేదీప్యమై
      వినతుల్ మనోవిచారమ్ములన్
      ధనమై వరార్ధమౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #55'
  upasthita-vyavasthita:
  - text: |-
      నిశాంత ధరణిన్ నీ రాక కొరకై వే
      చు శాలిక గడిన్ సూక్షమ్మునగు జీవిన్
      ప్రశాంత గరిమల్ రాజిల్లు చిరు కోర్కెన్
      విశాల నయనా ప్రీతిన్ గనుము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #419'
  utkaTapaTTikaa:
  - text: |-
      పట్టున్ విడనాడకీ భువిన్ శుభంకర తిరుమల పద్మాక్షుడా ! శ్రీకరా!
      కట్టున్ నరజన్మ బెట్టులన్ ప్రకాశ కలియగ వడిన్ కర్మ భూ నృత్యమున్
      గట్టున్ హరి కొల్వునేలు భక్తి గంధముల చెలగు కళ్యాణ సన్మూర్తివై
      నెట్టున్ జగదాంతరార్ధమున్ గుణించు గరిమలన నిల్పంగ రా శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #407'
    notes: yati/prasa relaxed, score=100%
  vRddhavaamaa:
  - text: |-
      వడ్డించు జన్మాంతర పాతకమ్మందు పెన్
      వడ్డాణమై చుట్టు నివాతమౌ కర్మలన్
      వడ్డీల రూపమ్మున వాసుదేవుండవై
      విడ్డూర లీలామృత పెమ్మివౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #81'
  vaMSaarOpee:
  - text: |-
      కృపాపూర్ణా ఘన కృష్ణా సంక్షో
      భ పార్ధుండన్ గను బాలావస్థన్
      నిపాతమ్మున్ భువి నిత్యావస్థన్
      సుపాత్రుండన్ నవ సొంపున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #155'
  vaMSalOnnataa:
  - text: |-
      ఓపజాల నిత్య కర్మ కోలాటమ్ముల్ నియోగ యోగ పోరాటమ్ముల్
      కోప తాప మాత్సరమ్ములన్ దీపమ్మౌ నికేత గోపురమ్ముల్ మాయల్
      తాపముల్ విశోకముల్ పరాదీనత్వమ్ములన్ సుతారమౌ దైన్యమ్ముల్
      రూపశిల్పివౌ హరీ !ధరిత్రిన్ దాటించు రమ్య రూపధారీ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #658'
  vaMSasthamu:
  - text: |-
      గిరీశ గోవింద సుకేశ తేజమా
      సురేశ సర్వేశ యశో సరోజమా
      నరేశ నారాయణ నారసింహమా
      పరేశ పర్జన్య నృపాల శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #28'
  vaaMdhara:
  - text: |-
      ఏడుకొండల సహేతుక వాసమున్
      మూడు మూర్తుల విమోచన రూపమున్
      గోడు దీర్చు భువి కోవెల నాధుడై
      వేడుకౌ పరమ విశ్వమ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #279'
  vaaNee:
  - text: |-
      జాగారమ్ముల్ నిలువని వాసముల నివాసుండ విహారీ
      రాగానందమ్మున కొలువై రజిత గృహమ్మున్ మదనారీ
      భూ గోవిందమ్మను పదమున్ పొలుచు విశేషాచల కీర్తీ !
      వేగమ్మే రా !సుమ హరివై !విధిలయలన్ నిల్పుగ శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #636'
  vaaNeebhooshaa:
  - text: |-
      ఇష్టమ్మై దుశ్చింతల్ దీరన్  హితకర సద్భక్తిన్
      కష్టమ్మున్ శస్త్రంబై బాపన్ కలి మహిమన్ గల్గన్  
      నష్టమ్ముల్ బోద్రోయన్ విశ్వానలముల నార్పంగా 
      దృష్టాంతమ్మై రక్షింపన్ రా !  కృపను గనన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #538'
  vaahinee:
  - text: |-
      ఆజ్యమ్ము పొంగంగన్ సాధ్యాసాధ్యమందున్
      రాజ్యమ్ము వైరాగ్యమ్మున్ రాజాధిరాజా !
      పూజ్యాధికారానన్ సంపూర్ణాద్రతన్ వి
      శ్వజ్యోతివై రా వేల్పై భాసించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #163'
  vaahinee-2:
  - text: |-
      అభయ వలయముల్ హరించు కాలమ్మున్
      నిభముల కలి పూని దారుణార్తిన్ సౌ
      రభముల మడుగున్ రగుల్చు దేహమ్మున్
      శుభములనిడు రాజువై !  హరీ !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #438'
  vaama:
  - text: |-
      తపస్సుల తీరమువై ధనుజారి తపోబల కాంతుల విశ్వము నీవై
      జపమ్ముల రాగమువై స్వరమై నిజపాదములన్ ఘన సన్నిధి నించన్
      నెపమ్ముల నీడన మానవుడన్ కనికట్టుల శ్రీశుని జట్టున నిల్పున్
      కపోతమునై హరిపాదములన్ నికరమ్ముగ చుట్టిన దాసును శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #700'
  vaamadaeva:
  - text: |-
      సామదానభేదములన సారమెంచు శస్త్రమై
      కామరూప సూక్ష్మ చలన గండపిండ తేజమై
      రామకృష్ణవైష్ణవ హరి రాగమాల హారమై
      నామ మంత్రయుక్తులగుచు   నందమౌను శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #171'
  vaamavadanaa:
  - text: |-
      వీక్షణల దీప్తికై వేచి యుంటిన్ నిజా
      పేక్షల సుధామమౌ విశ్వ వేదాద్రులన్
      సాక్షిగ సభూతమై సారమై లోక సం
      రక్షకుడ గాంచుమా రాయుడా శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #96'
  vaaraaha:
  - text: |-
      యుక్తాయుక్తమ్మున్ ధైన్యమ్మున్ యుద్ధమ్మున్ యోధున్
      ముక్తాయింపున్ జీవార్ధమ్మున్ మోక్షమ్మున్ మౌనిన్
      రక్తాంగమ్మున్ సింధూరమ్మున్ రాగమ్మున్ గీతన్
      సూక్తమ్మున్ సాక్షీభూతా !రా !సూర్యుండై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #444'
  vaasakaleelaa:
  - text: |-
      ఘోర కలిన్ వేదాంతము సంకోచించు జగమ్మున్ కూర్పుల రాసమ్మున్ సం
      చార విలాసీ శ్రీ నిలయా చాలించర మోహజ్వాల గతోద్దీపమ్ముల్
      కారణమౌ జన్మల్ ఋణముల్ గాలమ్ముల జీవాంకమ్ముల సంసారమ్మున్
      చేరని వైకుంఠమ్మున సంక్షేమమ్మిడు మాయోచ్చేదన కొల్వున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #667'
  vaasavilaasavatee:
  - text: |-
      దీన పరాయణ !కీర్తి నిరాసక్తుండన్
      కోనల రాయుడ !వ్యాకుల చిత్తుండన్ దా
      వానల పాప పరాభవ నిర్వాకమ్మున్
      కానగ రావ !హరీ గరుడాద్రిన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #128'
  vaayuvaega-1:
  - text: |-
      వేదాంతమ్మున వెల్గు రాఘవుడవై విజయ విశేషమై
      వైదీకమ్ముల యజ్ణకర్త సిరివై వలస నివాసమున్  
      వేదాలంకృత దివ్య విశ్వ హరివై వినయ విహారివై
      వేదాద్రిన్ వర వేంకటేశుడ భువిన్ వెలసిన శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #364'
  vaedaSree:
  - text: |-
      నమ్మకమ్ము బెంచు రామనారాయణ స్థిర బుద్ధిన్  
      నెమ్మనమ్మనందు సత్యనిత్యాచరణము నిల్పన్  
      వమ్ము చేయకుండ కాలవైచిత్రిని యరవింద 
      మిమ్మహిన్ సృజించి నిర్వహించన్ బలమిమ్ము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #592'
    notes: yati/prasa relaxed, score=93%
  vaelaa:
  - text: |-
      తిరుమల దేవా !దివ్య శేషాచలేశా !
      నరతతి ముప్పున్ నారసింహమ్మువై గా
      వర వరదాయీ !భక్త రక్షావ్రతుండా ! 
      సుర పతివంద్యా శేషపర్యంక ! శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #239'
    notes: yati/prasa relaxed, score=100%
  vaellita:
  - text: |-
      అణు నిర్మితమౌ యవనిన్ హిత కర్మాగారమ్మై  
      కణుపున్ చెఱకున్ కమనీయ రుచుల్వ్యాపించంగా  
      గుణవంతులకై కుల శూన్యమునౌ భూసస్యమ్మౌ 
      తృణమౌ నరుడన్ కృప జూపుము దాసుండన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #579'
  vaellitaa:
  - text: |-
      ప్రసవార్చిత రూప !వరదకర విన్యాసా ! సూ
      ర్య సుధాకర నేత్ర !యదుకుల యశోదానందా ! 
      వసుధాస్థలి దివ్య వన తిరుమలేశా శ్రీశా ! 
      వసుదేవసుతా!  శుభకర వరద దాతా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #575'
    notes: yati/prasa relaxed, score=93%
  vahirvali:
  - text: |-
      సనాతన సారధీ
      వినూత్న పయోనిధీ
      మనోజ్ఞ సిరిన్నిధీ
      వినాయక శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #159'
  vaiSvadaevee:
  - text: |-
      వేదమ్ముల్ యోగమ్ముల్ విభేదించు జన్మన్
      మోదమ్ముల్ రోగమ్ముల్ విముక్తిన్ మితమ్మున్ 
      నాదమ్ముల్ రాగమ్ముల్ వినాశోన్ముఖార్ధున్
      ఖేదమ్ముల్ దీర్చన్ రా సుకేశుండౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #383'
    notes: yati/prasa relaxed, score=95%
  vaikharee:
  - text: |-
      పైశున్య ఘాతమ్మున్ భయాన్మోహమ్ములన్
      పైశల్యముద్దీప్తిన్ ప్రయాసా శ్వాసలన్
      వైశాల్య జీవార్తిన్ వరమ్మై శ్రీహరీ !
      వైశద్య శేషాద్రిన్ వశమ్మౌ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #421'
  vaisaaroo:
  - text: |-
      పాదమ్ములన బ్రహ్మాండమ్ముల్
      వేదమ్ములన నీ రూపమ్ముల్
      నాదమ్ములన గోవిందమ్ముల్
      మోదమ్ము నిడు శూరా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #168'
  vajraaLee:
  - text: |-
      దివిసీమలన్ లక్ష్మీనాథా !దేదీప్యమ్మౌ కాంతిన్ 
      రవిచంద్ర నేత్రా!  శేషాహీశా  !  రాజచ్చక్రాబ్జా  ! 
      దివిభూష !  చిద్రూపమ్మున్ భూమిన్ దీపమ్మై ధ్యాన
      మ్ము వెలుంగ శ్రీవేదాద్రిన్ వేల్పౌ ముత్యమ్మౌ  శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #554'
  vajraaLee-2:
  - text: |-
      అష్టాదశ వర్ణమ్ముల్ వ్యాసున్ సాధ్యాయమ్ముల్ వేదా
      ర్ధష్టాదశ గ్రంధోగంధమ్ముల్ రాయంచల్ భంగిన్ సం
      తుష్టాలయ వేదాంగమ్ముల్ భూతిన్ తోడై రంజించున్
      కష్టాన పురాణమ్మై పుణ్యమ్ముల్ కల్గించున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #83'
    notes: yati/prasa relaxed, score=100%
  vakraavalOka@h:
  - text: |-
      ఒదిగి దేహామ్మున్ యుద్ధమున్ జేయు దేహిన్
      కదులు కాలమ్మున్ కారణార్ధిన్ నివాసిన్
      నదురు లోకమ్మున్ నాశమౌ లిప్త మాత్రున్
      ముదురు శోకమ్మున్ ముక్తినందించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #461'
    notes: yati/prasa relaxed, score=100%
  valabhee:
  - text: |-
      శాపము సోకని సంప్రదాయ నేలన్
      పాపము చేరని భాగ్యసీమ చేర్పున్ 
      తాపము నెగ్గని దాస్య మార్ధవానన్
      రూపము నీది విలోక మౌళి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #372'
  valadhaaree:
  - text: |-
      విజయమ్మీవె భువి తలంపన్ 
      ప్రజకున్ గొనుమర్చనలీశా
      నిజపాదమ్ముల నెనరాజ
      న్మజ రోగమ్ములణచ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #206'
    notes: yati/prasa relaxed, score=95%
  valivadanaM:
  - text: |-
      బిళహరి రాగమ్మే నాదమ్మై విరియు రమేశా
      కళ కల జీవమ్మున్ తేజమ్మై గరుడ విహారా
      తళుకుల దేహమ్మున్ ప్రాణమ్మై దరిగన జేయన్  
      భళిర ! సదా శ్రీవాసమ్మున్ దీవన లిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #566'
  vallakee:
  - text: |-
      చక్రధారీ !తిరుమలేశ !సందర్శనంబుల్ విరాజిల్లగన్
      సక్ర మమ్మౌ నవ మనో విచారంబు లాలించు భాగ్యమ్మువై
      విక్ర మార్కుండు నగు ధైర్య వీర్యంబునందించు దైవంబువై
      వక్రగామిన్ దయను జూపు వాసావిరాగంబుతో శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #370'
  vallaree:
  - text: |-
      తనదను తపనల తరిమెడు తరముల తాడన వలయ జన్మలన్
      ధనమను దరిగొను దమనపు దరువుల దాగని దురుసు కర్మలన్
      కనులకు కలమిగ కలవని కలలన కారణ మడరు పుణ్యమున్
      జన వన జగతిన జితముల జతనిడి జాగృతి నొసగు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #417'
  vanalataa:
  - text: |-
      హిమగిరి కనుమల శివుడిగ హితుడిగ కలిమివౌ సత్
      సుమగిరి తిరుమల నిలయ కుసుమ హృదయ వరదాయీ
      శమనమిడు గరుడ గమన విజయపథముల విహారీ
      కమన నయనుడ కమతముల గనుమ సిరిపతి శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #646'
  vanamaMjari:
  - text: |-
      నదురు పతాకవరోహణఘట్టమే కడపెమ్మియౌ
      కుదురు మహోత్సవ లీలగు వేదమంత్ర విభావరిన్
      విదురులొనర్చెడు విష్ణు పెరంజు పూజగ ఖ్యాతి నొం
      దు దురితహార వరమ్ము దొరంకొనింపుగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #183'
  vanamaMjari-2:
  - text: |-
      తిరుమల కోవెల కాంచన రాయుడ తీరుతెన్నుల గావరా
      వరముల ధారల ముంపున నిల్పుచు పాపకర్మల నార్పరా
      కరముల నీ ఘన పూజన నిశ్చల కారణమ్ముగనుంచరా
      పరమను భావన యుక్తిగ నీయర భాగ్యరేఖగ శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #27'
  vanitaavilOka@h:
  - text: |-
      నాలోకమే నీదు నయనారవింద
      మ్మౌ లోక విన్యాస మధుకమ్ము శాంత
      మ్మై లోచనమ్ముల్ తమసహారకమ్మై
      కాలాంత కారుణ్య కనుదోయు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #355'
  varalakshmi:
  - text: |-
      బాటన్ పరేశుడవై పరమావధిగ నీవై
      నీటిన్ ఘనుప్పెనవై నిలు శేషశయనా !వా
      గ్ధాటిన్ చతుర్ముఖ దాతగ దాస్యమునిడన్ రా !
      మేటిన్ ఘటించెడు కామితముల్ నిలుప !శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #82'
  varatraa:
  - text: |-
      నిర్ణిత జరా నిలయమ్మున కుంతీ
      కర్ణుడను భాస్కర శక్తి నియుక్తిన్
      పర్ణినరమై పలు శాప పురమ్మున్
      వర్ణనకు కేవల మాత్రుడ శౌరీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #365'
  varmitaa:
  - text: |-
      అంజనాద్రి శ్రీ హరి రామమై
      పంజరమ్ములౌ వర దేహముల్
      కుంజరమ్ములౌ కొస మోక్ష భూ
      మంజరమ్ములై మను శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #45'
  varoothinee:
  - text: |-
      నమో తిరుమల వాసుడ !నరుడన్ నను కరుణించుమా !
      విమోచన గతి నిల్పుమ !తపమున్ వినతుల దీర్చుమా !
      తమోగుణ గతి త్రెంచు !సులభుడా !తరముల సూర్యమా !
      సమోదక జగధీశమ !బలమై శరణిడు శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #195'
  vasaMtahaasa@h:
  - text: |-
      ఆత్మానందమ్మిడుమ!  అశేషమౌ నం
      దాత్మా !భూలోక గిరి తరంగమై వే
      దాత్మా !మోక్షమ్ము నిడు తపమ్ములన్ జీ
      వాత్మా !ప్రాణమ్మునిలుప రమ్ము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #381'
  vasanaviSaalaa:
  - text: |-
      ఉడుకు నెగడు యుగానన్ ఘాతమ్మౌ
      దుడుకు వెతల దురంతమ్ముల్ హేలన్
      మిడుకు శుభ శమితమ్మై నీ నామ
      మ్మడరు క్షితిని !మనోజ్ఞమ్మై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #349'
  vastu:
  - text: |-
      అంతర్యామీ చంద్రహాసుడా వేదాద్రీశా !
      చింతాక్రాంతిన్ నిత్య జీవితానన్ దీనాత్మన్
      వింతౌ భ్రాంతిన్ నిల్చు భీతి భూతమ్మున్ పృథ్విన్
      సాంతమ్మీవై గాచు జన్మ సాధ్యమ్మై శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #119'
  vasuMdhara:
  - text: |-
      ప్రశస్తి గొల్చెద భక్తిన్ !పరాత్పరున్ గణరాజున్
      విశేష పద్య కదానన్ విరించియౌ గజరాజున్
      విశాల కావ్య మహమ్మున్ వినాయకాత్మ నియుక్తిన్
      స్పృశింతు పాద ద్వయమ్మున్ పురాణ హస్తిని శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #intro-3'
    notes: yati/prasa relaxed, score=100%
  - text: |-
      అనాథ నాథుడ నారాయణా! వృషాద్రినృపాలా
      వినోద వైభవ లీలన్ విరించివౌ విరిధారీ
      మనోవిహారుడవై సామ దాన భేదములన్ భూ
      ఘనాత్మవై గతివై సంకటమ్ములన్ గను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #692'
  vasupadamaMjaree:
  - text: |-
      సతమత లోక లౌకిక సమూల సజీవ జాలమున్
      గతయుత భూరి పాతకములేలు గభీర జన్మలన్
      మితమగు పుణ్య సార్ధక సశేష మితాశనార్ధమున్
      జతయగు వేంకటేశు చరణార్తి జపమ్ము శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #352'
  veeNaadaMDaM:
  - text: |-
      సహస్ర శిరముల్ జగన్మాయా మంత్రా
      ర్ధ హేల లయకార !మోక్షంబీయంగన్  
      సహాయకములై జగానన్ భాసించున్
      విహార హరివై విరాజిల్లున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #353'
  veeraaMtaa:
  - text: |-
      యదార్ధముల ధ్యేయమ్మై నీడై
      వదాన్యతల భావమ్మై శోక
      మ్ము దీర్చు శరమై మోక్షమ్మై ర
      క్ష దాత దిగి రా కర్తా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #174'
  veeraneeraajanaa:
  - text: |-
      పరాభక్తినందించు జీవేశ్వరా పాపమ్ములన్ త్రెంచి కాపాడ రా వే
      దరాహిత్య శూన్యమ్ములన్ జీల్చి సంభూతమ్ములన్ నిల్పి రక్షించు సంతా
      న రాసమ్ము లాడించి పాలించు సంధానమ్ములన్ పుణ్యమున్ జేర్చి వైకుం
      ఠ రాజ్యమ్ము దక్కించు విశ్వేశ్వరా వెంటాడు శోకమ్ము నిర్జించి శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #675'
  viSaalaaMbhOjaalee:
  - text: |-
      నీరాజనములన్ నివేద్యంబందున్ నీ
      పారాయణములన్ పరోక్షామ్మౌ పూజన్
      తారాగణములంతటన్ దివ్యాళిన్ బెన్
      సారంపు గతివే ! జగస్సాక్షీ !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #166'
  viSaalaaMtikaM:
  - text: |-
      కైవల్య వైభోగ సంద్రమ్మువై
      పావంచ సందీప తీరమ్మువై
      దైవత్వ సంధాత బ్రహ్మాండమున్
      జీవంపు కాణాచియౌ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #89'
  viSadachChaaya@h:
  - text: |-
      నయనానందా నరమిత్రుండా 
      శయనానందా శరణార్ధిన్ నీ
      దయతో నీ పాదములిమ్మా చే
      ర యశోదా పుత్ర  హరీ !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #284'
  viSalyaM:
  - text: |-
      మదోన్మత్తుడన్ భూమియందున్  
      సదా చింతలన్ మున్గు రేణున్
      వదాన్యా మదిన్ కోరెదన్ స
      ర్వదా దివ్యమౌ రక్ష శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #236'
  viSikhalataa:
  - text: |-
      శయన విలాస శేషశాయీ !హరీ !
      భయహర పాప దూరతీరమ్ములన్
      నయముగ గాన లాహిరిన్ !చేర్చుమా !
      స్వయముగ దీవనల్ పొడన్ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #263'
  vibhaa:
  - text: |-
      జగముల చీకట్లన్ త్రెంచు శరచ్ఛంద్రా
      నిగమములన్ సంచారాత్మ నివేదాంతా
      సుగమ వరమ్ముల్ పొంగారు సుమంత్రమ్మున్
      నగధర శ్రీకారా !భావనవౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #462'
  vibhaavari-janakaatmaja:
  - text: |-
      తిరుమలేశ విధి శంకర శ్రీధరా
      గిరిపురీశ నిఖిలాత్మ పురంధరా
      విరిధరుండ రవినేత జనార్ధనా
      సిరిధరుండ వసితానల శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #92'
  vibhramagati:
  - text: |-
      లక్ష్మీదేవి హృదిన్ నిరంతరముగన్ లక్ష్యమ్ము దీపించు కౌస్తుభ మూర్తివై
      సాక్షీభూత విలాసమున్ తిరుమలన్ సందర్శనార్ధమ్ము నిల్పున చేరువై
      దీక్షాద్వార వియోగ పాశ విడుపున్ దేవేంద్ర నాధుండవై జప గెల్పువై
      రక్షో దక్షత రాజ్య పాలకుడవై రక్షించు శేషాద్రి శేఖర !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #412'
    notes: yati/prasa relaxed, score=100%
  vidhaaritaa:
  - text: |-
      ఇతోధికమౌ హితమెంచు జన్మలన్
      శతాధిక వాస నివాసమాలికన్
      గతించెడి శోకవిలాస లాస్యమున్
       పతంగ పథిన్ వడినైతి శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #251'
  vidhunidhuvanaM:
  - text: |-
      ధ్యానమ్ముల్ చెలగు తపన లోలోన్ తళుకుల సంచారీ !రా !
      గానమ్మున్ సురుచిర సుధవై లోకమలరు  సంగీతమ్మై
      మౌనమ్మున్ విడు తిరుమల కోనన్ మధువనమై శిల్పమ్మున్
      వైనమ్మౌ వెలుగుల హరివై గావర పరమాత్మా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #634'
  vidhuravitaanam^:
  - text: |-
      ఉరగ శయనుడా !ఉరుకున రారా !
      తురగ గమనమున్ !దురిత వినాశా !
      తరుగు గడియలన్ !తమకము హెచ్చెన్
      తరముల చెర మ్రోత నిలుపు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #436'
  vidyaa:
  - text: |-
      పరిహాసమౌ నర జన్మల్
      హరి చింతనన్ విడు వేళన్
      ధర జన్మ చక్ర గతిన్ బా 
      పి రమేశ కావుమ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #238'
  vidyaadhaara@h:
  - text: |-
      గోదానమ్మున్ గోవున్ గోపాలాత్మన్ నీవై
      భూదానమ్మున్ భూమిన్ భూదేవాత్మన్ నీవై
      మైదానమ్మున్ మేరున్ మైమర్పున్ నీవై ని
      ర్వేదాత్మన్ సారమ్మౌ వేదాద్రీశా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #382'
  vidyaanaMda:
  - text: |-
      సౌమిత్రిన్ రామానందమ్మున్ సాకారమ్మౌ సావాసమ్మున్ ధారాళమ్మౌ భక్తిన్
      కౌమారున్ బాల్యావస్థన్ వృద్దాప్యమ్ముల్ తాకట్టున్ ఘాతమ్ముల్ మాయన్నన్ బెట్టున్
      నామాస్త్రమ్మున్ శేషాద్రీశున్ దాసుండన్ గానమ్మున్ గాత్రమ్మున్ గేయమ్మున్ రక్తిన్
      పూమాలీ !నీ పాదమ్మున్ చామంతిన్ శ్రీశా !భూలోకమ్మున్ సాయమ్మై రా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #671'
  vidyudaalee:
  - text: |-
      నిరాధార ధారమ్ములౌ జీవముల్ నీదు నామామ్ములన్ చేతనొందున్
      నిరాకార సారమ్ములౌ జీవులన్ నీలి మేఘమ్మువై కాంతిచిందున్
      నిరాచార తీరమ్ములౌ దీవులన్ నిత్య గోవింద నాదమ్ము మ్రోయున్
      నిరాటంక మాయన్ విబేధించి రాణించు ధైర్యమ్మునందించు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #657'
  vidyullata:
  - text: |-
      లోపమ్ము కూర్పులై భూలోకమ్మె లోకమై
      కోపమ్ము ధారణౌ లోకోత్తర్మరందమున్
      శాపమ్ము విత్తమౌ వాసాగార దేహమున్
      కాపాడు మానవుండన్ !కారుణ్య శ్రీపతీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #85'
  vidyumadOlaa:
  - text: |-
      హరిమయమౌ భూయంత్రమ్మున ధూళిన్
      నర నిలయానన్ నారాయణ తున్కన్
      పరమపదానన్ భాసిల్లు వియోగిన్
      హరిచరణానన్ యాత్రిన్ గను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #133'
  vidyunmaalika:
  - text: |-
      అలసట సమాహారమ్ములన్ చిక్కులన్
      ములుగు కలి సమ్మోహించు మాయాంకమున్
      గొలుసు బతుకున్  గోపాల గీతమ్మునై
      పలుకుల ప్రభన్ భాసించనీ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #95'
  vigaahitagaehaM:
  - text: |-
      కచికలగు తనువుల గృహమ్మున్ గారమ్మున్ చెలగుచు మైకములందున్
      విచలిత గతుల కతుకు జన్మల్ వేదమ్మున్ విడిచి నిరాశలనొందున్
      రుచులుడుగు దిన దినము మోక్షారోహమ్మున్ నిలుపు గిరీశు పదమ్ముల్
      సుచిర సుకృత ఘన హరి భక్తిన్ శోభిల్లున్ తరళ పథమ్ముగ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #703'
  vijayaparichayaa:
  - text: |-
      వినయ గుణకముల్ పెంచు నియుక్తిన్
      కనకమయ నిధుల్ కైవస యుక్తిన్
      జనిత వెతల నిస్సార విరక్తిన్
      గని వరమిడు శ్రీకారుడ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #344'
  vilaMbitagati:
  - text: |-
      అయోధ్యనదురు వేంకటాచల మహామహీద్రమ్ములౌ
      దయామయ హరి వాసమై వెలుగు ధాత్రి వైకుంఠమై
      నియోగజనుల రాముడై నిశల నీరజారాతి జ
      న్మయోగమున విముక్తి ధారనిడు మాలిమిన్ !  శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #189'
  vilaasa-2:
  - text: |-
      భావోద్వేగపు రోషమువై భాషవై వేషమై పూర్ణమై
      సావాసమ్ముల శోభితమై చైత్రమై క్షాత్రమై సర్వమై
      దైవాధీన విదేహములన్ ధర్మ సంప్రీతమై దేహమై
      జీవాత్మన్ నెలవై కొలువౌ శ్రీధరా శంకరా శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #190'
  vilaasee:
  - text: |-
      ఆరాటమ్ముల్ హేయమౌ జీవార్తిన్ విశ్వమ్మై
      సూరీడా !వేదీ !సుమాద్రిన్ జీమూతమ్మౌ పెన్
      భూ రాట్టై !తోరంపు శోభన్ వేదాద్రిన్ శ్రీశా
      తారాటన్ !సంజాత రేణున్ గావన్ రా శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #118'
    notes: yati/prasa relaxed, score=100%
  vilulitavanamaalaa:
  - text: |-
      హృదయ కమల సందీపా కృపలనిడుమ గోపాలా !
      వదనపు తిరునామమ్ముల్ పరమ కలిమియోగమ్మై
      కదము నడరు పాదమ్ముల్ కరుణ గతిని శాసించన్
      పద పదమున ‘గోవిందా’ ప్రణవములలరన్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #427'
  vipakva:
  - text: |-
      తలాతలమ్ములావలార్తివై చరాచరమ్ము ధారణన్ విలాస వేణువై
      తలంపునేలు తారకమ్మువై ముభావ భావ తంత్రులన్ వివేక వీణవై
      బలాబలమ్మునుంచు శక్తివై నియుక్త యుక్త వారధిన్ ప్రధాన సాక్షివై
      సులోచనా !విసంకటమ్ము త్రెంచు వేంకటాద్రి సుందరా !మహేశ !శ్రీపతీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #212'
  vipannakadanaM:
  - text: |-
      ఉలుకులేలరా !నియుత నామమ్ముల్ నీ
      వెలుగు జూప భక్తి విధముల్ విశ్వానన్ 
      కలిమి నిల్పులై సకల వైభోగమ్ముల్
      నిలుపు శీలమై కనికరమ్మౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #121'
  vipinatilakaM:
  - text: |-
      కనులెదుట రూపమ గభీర విశ్వాత్ముడా
      మనకుహర మాధవ సుశీల విశ్వేశుడా
      మెనయు మధుసూధన మెరంగు సర్వేశుడా
      విను మనవి శ్రీనిధి విధాతవై శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #147'
    notes: yati/prasa relaxed, score=100%
  vipulabhujaa:
  - text: |-
      అనునుయ నిర్ధయ వాసాల్లో
      ధనముల నీరద పాతాల్లో
      మనుగడ దూర మహత్తుల్లో
      ఘన జనులేలికవౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #33'
  vipulapaalikaa:
  - text: |-
      సుప్రభాతముల్ వసుధ సచేతనౌ
      విప్రచేతనౌచు సుచిర గీతమై
      శిప్ర పోలికన్ వశిత మహీధ్రమున్ 
      వప్ర పుణ్యమై మెరుపగు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #277'
    notes: yati/prasa relaxed, score=100%
  virOdhinee:
  - text: |-
      రజిత కోవెలన రవంత శిల్పమున్
      సజల నేత్రముల సమస్త విశ్వమా
      యజన జీవముల యశోవిరాజమై
      విజయ గంధమిడు విజేత శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #93'
  viraLaviraaga:
  - text: |-
      ఇదిగో భువి సీమన్ హిరణ ప్రకాశ
      మ్మిదిగో కనెదన్ వేయి ప్రభల రూపున్
      మది దోచు నివాసమ్మది తిరుశేషా
      ద్రి దివిన్ భువియందే దిగిచెను శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #229'
    notes: yati/prasa relaxed, score=100%
  viraha:
  - text: |-
      మంద్రమ్మౌ సరిగమలన మాధుర్యములౌ వేంకటరమణుని పదగీతుల్
      సంద్రమ్మై జన హృదయ విచారమ్మును నిర్జించు ఘన చరణముల రీతుల్
      చంద్రాదిత్యుల వెలుగుల సారమ్ముగ కాంతుల్ మెరయు సతత కలిమిన్ మా
      హేంద్రార్తిన్ బలిమిగ గణ హేరంబుని సిద్ధిన్ నిలిచి హితమునిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #180'
  viralaa:
  - text: |-
      వృషభాద్రి దేవ కృపను జూపి నై
      మిష తీరమై తిమిర నిహారమౌ
      విషయాద్రి వేద విధుల శ్రీగిరిన్
      తృషనార్చు జీవనృపుడ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #284'
  viralaa-2:
  - text: |-
      భవసాగరముపచార కర్మలన్
      నవతీగల జనలోక కొల్వులన్
      భువనమ్ములన పురాంతకా ! హరీ ! 
      దివిసీమల గతినిల్పు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #285'
  virataprabhaa:
  - text: |-
      మ్రొక్కుల క్రీడ సముచిత సేవలన్
      మక్కువ గొల్పు రమణుని కోవెలన్
      దక్కునపార సతత వియోగముల్
      పెక్కుగ జీవన విధిగ శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #275'
  viratiprahati:
  - text: |-
      పెన్నాగున రవిగ మెరయు శ్రీశా
      మిన్నాగులగు మిత గడువులన్ భూ
      మన్నున్ నలుగు మనుగడల జన్మన్
      సాన్నిధ్యముల శరణమిడు శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #327'
  vishamavyaalee:
  - text: |-
      పుడమి శిఖరమ్మున్ వైభోగమ్మున్ చా
      రెడు కమల నేత్రమ్ముల్ శ్రీకారమ్మై
      మిడుకు హరివై లోకమ్మీవన్ భావ
      మ్మడరు జపమ్మీవై రామా ! రా !  శౌరీ !
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #363'
    notes: yati/prasa relaxed, score=95%
  vivaravilasitaM:
  - text: |-
      అంకమ్ముల లయలగు జీవార్ధమ్మున్
      సంకీర్తనల సరళ సంగీతమ్మున్
      సంకోచముల చతుర సందేహమ్మున్
      వేంకట్రమణ వినతినిల్పౌ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #329'
  viyadgaMgaa:
  - text: |-
      ఇనుండున్ నీదు కంటన్ వెల్గునిచ్ఛాశక్తి శోభిల్లన్ 
      జనాళిన్ నిత్య వైరాగ్యమ్ము సంభావించు దేహాత్మన్
      ఘనాభాకార!  వేదాద్రిన్ నిగారింపౌ నగమ్మందున్ 
      మనో వీధిన్ దలంచన్ నిత్యమై కన్పించుమ  శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #588'
    notes: yati/prasa relaxed, score=96%
  vyOma:
  - text: |-
      శేషవాహనాననేగు చిదంబర త్రిమూర్తివై
      శేషనాగు కోర్కె దీర్చ శిరాగ్రమున యాత్రలన్ 
      శేషమెంచనాద్య కర్మచిరాగ్నులను త్రెంచి మా
      శేష జీవతమ్ము గాచు జితమ్మునిడు శ్రీపతీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శ్రీపతీ చతుశ్శతి #173'
  vyOmagaMgaa:
  - text: |-
      రామనామమ్మున్ స్మరించంగా రమానాథుండు మేఘ
      శ్యామ దివ్యాంశన్ నరేంద్రుండై  సత్కర్మాచార దీప్తిన్ 
      వ్యోమ వర్ణమ్మున్ వినీలమ్మై పురాణార్ధమ్మువై సం
      క్షేమ సౌభాగ్యమ్మునిమ్మా యోగివంద్యా ! నమో !   శౌరీ!
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #593'
    notes: yati/prasa relaxed, score=93%
  yaSasvi:
  - text: |-
      చౌర్యమ్మున్ నిలు జతన యదు ఘనుడ జన్మన చంచల చక్రమ్మై
      శౌర్యమ్మున్ నవ సరితల వరదుడ జానకి రాముడ సాధ్యమ్మై
      కార్యమ్ముల్ నిలకడ నిలుపర భువి గండమునిల్పెడు గారమ్మై
      సూర్యాత్మా !మనసున నిలిచి గను విశోకపు పెన్ నలుసున్ శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #669'
  yatanaM:
  - text: |-
      రసవత్తరమ్మై వరమ్మై
      రసచిత్ర గోవిందమై సా
      రససంద్రమౌ నీదు నామ
      మ్ము సుభక్తి సౌధమ్ము శౌరీ
    author: వేగరాజు శ్రీరామ్
    reference: 'శౌరీ సప్తతి #171'
