     <svg width="100%" height="auto" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" class="max-w-[300px] drop-shadow-2xl">
                <defs>
                    <!-- Top Face Gradient -->
                    <linearGradient id="topGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FFD452;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#F7941D;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Left Face Gradient -->
                    <linearGradient id="leftGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#7FBEEF;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#3978B5;stop-opacity:1" />
                    </linearGradient>
                    
                    <!-- Right Face Gradient -->
                    <linearGradient id="rightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#BCE0FD;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#6CB2E6;stop-opacity:1" />
                    </linearGradient>
                </defs>

                <!-- Left Side Face -->
                <path d="M 250 250 L 120 175 L 120 325 L 250 400 Z" 
                        fill="url(#leftGradient)" stroke="#2E5A88" stroke-width="1.5" />

                <!-- Right Side Face -->
                <path d="M 250 250 L 380 175 L 380 325 L 250 400 Z" 
                        fill="url(#rightGradient)" stroke="#4A8DC2" stroke-width="1.5" />

                <!-- Top Face -->
                <path d="M 250 250 L 120 175 L 250 100 L 380 175 Z" 
                        fill="url(#topGradient)" stroke="#D47C10" stroke-width="1.5" />
                        
                <!-- Internal Edge Highlights -->
                <path d="M 120 175 L 250 250 L 380 175" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.3" />
                <path d="M 250 250 L 250 400" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.2" />
            </svg>