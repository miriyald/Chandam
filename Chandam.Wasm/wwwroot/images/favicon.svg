<svg width="100%" height="auto" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" class="max-w-[300px] drop-shadow-2xl">
    <defs>
        <linearGradient id="floorGradient" x1="50%" y1="100%" x2="50%" y2="0%">
            <stop offset="0%" style="stop-color:#FFD452;stop-opacity:1" /> <stop offset="100%" style="stop-color:#F7941D;stop-opacity:1" /> </linearGradient>
        
        <linearGradient id="leftWallGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#3978B5;stop-opacity:1" /> <stop offset="100%" style="stop-color:#7FBEEF;stop-opacity:1" /> </linearGradient>
        
        <linearGradient id="rightWallGradient" x1="100%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" style="stop-color:#6CB2E6;stop-opacity:1" /> <stop offset="100%" style="stop-color:#BCE0FD;stop-opacity:1" /> </linearGradient>
    </defs>

    <!-- Floor (Square) -->
    <path d="M 250 250 L 50 350 L 250 450 L 450 350 Z"
          fill="url(#floorGradient)" stroke="#D47C10" stroke-width="1.5" />

    <!-- Left Wall -->
    <path d="M 50 350 L 50 100 L 250 50 L 250 250 Z"
          fill="url(#leftWallGradient)" stroke="#2E5A88" stroke-width="1.5" />

    <!-- Right Wall -->
    <path d="M 450 350 L 450 100 L 250 50 L 250 250 Z"
          fill="url(#rightWallGradient)" stroke="#4A8DC2" stroke-width="1.5" />

    <!-- Edge Highlights -->
    <path d="M 250 250 L 250 50" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.2" />
    <path d="M 50 350 L 250 250 L 450 350" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- Horizontal Line on Floor (Center) -->
    <line x1="150" y1="350" x2="350" y2="350" stroke="#D47C10" stroke-width="4" opacity="0.6" />

    <!-- Dot on Left Wall (Center) -->
    <circle cx="150" cy="200" r="8" fill="#2E5A88" opacity="0.8" />

    <!-- Dot on Right Wall (Center) -->
    <circle cx="350" cy="200" r="8" fill="#4A8DC2" opacity="0.8" /> </svg>
