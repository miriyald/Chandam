server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM MIME types
    types {
        application/wasm wasm;
        application/octet-stream dll;
        application/json json;
        application/javascript js;
        text/css css;
        text/html html htm;
        text/plain txt;
        image/png png;
        image/svg+xml svg;
        font/woff woff;
        font/woff2 woff2;
    }

    # Enable gzip/brotli for WASM assets
    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/css application/json;

    # Serve pre-compressed brotli files if available
    location /_framework/ {
        gzip_static on;
        # Serve .br files with correct encoding
        location ~* \.br$ {
            default_type application/octet-stream;
            add_header Content-Encoding br;
        }
        # Serve .gz files with correct encoding
        location ~* \.gz$ {
            default_type application/octet-stream;
            add_header Content-Encoding gzip;
        }
        # Cache framework files aggressively
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Cache static data files
    location /data/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # SPA fallback - GitHub Pages compatible
    # All routes fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
