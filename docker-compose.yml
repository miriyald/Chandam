version: '3.8'

services:
  chandam-api:
    build:
      context: .
      dockerfile: Chandam.API.WebApi/Dockerfile
    image: chandam-api:latest
    container_name: chandam-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - CHANDAM_RULESET=default
    volumes:
      - ./config/rules:/app/config/rules:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: Chandam API with complete Telugu rules
  chandam-api-complete:
    build:
      context: .
      dockerfile: Chandam.API.WebApi/Dockerfile
    image: chandam-api:latest
    container_name: chandam-api-complete
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - CHANDAM_RULESET=telugu-complete
    volumes:
      - ./config/rules:/app/config/rules:ro
    restart: unless-stopped
    profiles:
      - complete

  # MCP HTTP/SSE Server (remote AI agent access)
  chandam-mcp-http:
    build:
      context: .
      dockerfile: Chandam.MCP.Http/Dockerfile
    image: chandam-mcp-http:latest
    container_name: chandam-mcp-http
    ports:
      - "3001:3001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./Config:/app/Config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/sse", "-m", "2"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MCP Stdio Server (for Docker-based Claude Desktop integration)
  # Usage: docker run -i chandam-mcp-stdio
  chandam-mcp-stdio:
    build:
      context: .
      dockerfile: Chandam.MCP.Stdio/Dockerfile
    image: chandam-mcp-stdio:latest
    container_name: chandam-mcp-stdio
    stdin_open: true
    volumes:
      - ./Config:/app/Config:ro
    profiles:
      - stdio

networks:
  default:
    name: chandam-network
