version: '3.8'

services:
  chandam-api:
    build:
      context: .
      dockerfile: Chandam.API.WebApi/Dockerfile
    image: chandam-api:latest
    container_name: chandam-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - CHANDAM_RULESET=default
    volumes:
      - ./Chandam.Config/rules:/app/Chandam.Config/rules:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: Chandam API with complete Telugu rules
  chandam-api-complete:
    build:
      context: .
      dockerfile: Chandam.API.WebApi/Dockerfile
    image: chandam-api:latest
    container_name: chandam-api-complete
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - CHANDAM_RULESET=telugu-complete
    volumes:
      - ./Chandam.Config/rules:/app/Chandam.Config/rules:ro
    restart: unless-stopped
    profiles:
      - complete

  # MCP HTTP/SSE Server (remote AI agent access)
  chandam-mcp-http:
    build:
      context: .
      dockerfile: Chandam.MCP.Http/Dockerfile
    image: chandam-mcp-http:latest
    container_name: chandam-mcp-http
    ports:
      - "3001:3001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - ./Chandam.Config/Rules:/app/Chandam.Config/Rules:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health", "-m", "2"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MCP Stdio Server (for Docker-based Claude Desktop integration)
  # Usage: docker run -i chandam-mcp-stdio
  chandam-mcp-stdio:
    build:
      context: .
      dockerfile: Chandam.MCP.Stdio/Dockerfile
    image: chandam-mcp-stdio:latest
    container_name: chandam-mcp-stdio
    stdin_open: true
    volumes:
      - ./Chandam.Config:/app/Chandam.Config:ro
    profiles:
      - stdio

  # Chandam WASM Web UI (Vite + TypeScript + Blazor WASM)
  chandam-wasm:
    build:
      context: .
      dockerfile: Chandam.Wasm/Dockerfile
    image: chandam-wasm:latest
    container_name: chandam-wasm
    ports:
      - "8082:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # LangGraph Agent API Server
  chandam-agent:
    build:
      context: ./Chandam.Agent
      dockerfile: Dockerfile
    image: chandam-agent:latest
    container_name: chandam-agent
    ports:
      - "8123:8123"
    environment:
      - CHANDAM_MCP_URL=http://chandam-mcp-http:3001/sse
      - DEFAULT_MODEL=claude-sonnet-4
    env_file:
      - ./Chandam.Agent/.env
    depends_on:
      chandam-mcp-http:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ok"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  default:
    name: chandam-network
